packages:
  - 'frontend/apps/web'
  - 'packages/*'
  - 'apps/*'
overrides:
  # security overrides (grype --fail-on high, task D12): pin transitive deps
  # whose parents haven't caught up to the patched floor yet. Remove each
  # entry once the owning parent's own dependency range clears it natively.
  'nanoid@<3.3.17': ^3.3.17
  'js-yaml@4': ^4.3.1
  'brace-expansion@2': ^2.1.4
  'brace-expansion@5': ^5.0.9
  'fast-uri@2': ^2.4.4
  'fast-uri@3': ^3.1.5
  # vitest's own internal vite dependency (^5||^6||^7-0) otherwise resolves
  # to the lowest satisfying 5.x in workspaces with no direct vite devDep
  # (docx-renderer, shared-tokens, shared-types, eigenpal-adapter).
  vite: ^6.4.3
  postcss: ^8.5.18
  linkify-it: ^5.0.2
  find-my-way: ^9.7.0
allowBuilds:
  canvas: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@opentelemetry/api-logs@0.220.0'
  - '@opentelemetry/context-async-hooks@2.9.0'
  - '@opentelemetry/core@2.9.0'
  - '@opentelemetry/exporter-trace-otlp-http@0.220.0'
  - '@opentelemetry/otlp-exporter-base@0.220.0'
  - '@opentelemetry/otlp-transformer@0.220.0'
  - '@opentelemetry/resources@2.9.0'
  - '@opentelemetry/sdk-logs@0.220.0'
  - '@opentelemetry/sdk-metrics@2.9.0'
  - '@opentelemetry/sdk-trace-base@2.9.0'
  - '@opentelemetry/sdk-trace-node@2.9.0'
  - '@opentelemetry/sdk-trace@2.9.0'
  - fastify@5.11.3
