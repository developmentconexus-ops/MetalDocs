name: T8-E Promotion Executor

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.number == 136 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arch/t8e-wire-contract
          fetch-depth: 0
      - name: Execute staged fail-closed durable promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          t = Path('.github/workflows/t8e-promote-sync.yml').read_text()
          marker = "        run: |\n"
          start = t.index(marker) + len(marker)
          lines = t[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/t8e-promote.sh').write_text(script)
          PYEXTRACT
          bash /tmp/t8e-promote.sh
