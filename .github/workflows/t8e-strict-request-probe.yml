name: T8-E Strict Request Probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  strict-request-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Probe OpenAPI and envelope strictness
        shell: bash
        env:
          SPEC_GZ_B64: ""
          GO_GZ_B64: ""
        run: |
          set -euxo pipefail
          work="$(mktemp -d)"
          cd "$work"
          printf '%s' "$SPEC_GZ_B64" | base64 -d | gzip -d > openapi.yaml
          printf '%s' "$GO_GZ_B64" | base64 -d | gzip -d > main.go
          go mod init strictprobe
          go get github.com/getkin/kin-openapi@v0.142.0
          go mod tidy
          go run .
