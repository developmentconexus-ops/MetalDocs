name: governance-check

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Run governance checks (PowerShell)
        shell: pwsh
        run: ./scripts/check-governance.ps1 -BaseRef "origin/${{ github.base_ref }}"

      # ADR status-field budget gate (F-R2, Dim-10): fails the PR if any ADR's
      # `> **Status:**` block exceeds 3 physical lines or 400 chars — the
      # "mega-status anti-pattern" guard. Blocking (no continue-on-error); the
      # sweep logic is the single-source script, not an inline one-liner.
      - name: ADR status-field budget gate
        run: bash scripts/check-adr-status.sh

  # A1 item 3 — two deterministic, zero-infra scripts that existed in
  # scripts/ and were never referenced by any workflow. Both are RED today on
  # real drift (see docs/superpowers/analysis/A1-verification-ledger.md D-5,
  # D-6), so they are separate jobs: the `check` job above stays promotable to
  # a required status check, and these two report until their drift closes.
  # They are wired now rather than after the fix because an unwired script
  # proves nothing, and the drift they found is the evidence that they work.
  wiki-tally:
    name: wiki module/tech-debt tally sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check §11 severity tallies against the tech-debt registers
        shell: pwsh
        run: ./scripts/wiki-tally-check.ps1 -All

  db-dictionary-coverage:
    name: DB schema dictionary coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every baseline table has a wiki/database/tables page
        shell: pwsh
        run: ./scripts/check-db-dictionary-coverage.ps1

  docx-v2-isolation:
    name: docx-v2 PR must not touch CK5 paths
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.title, 'docx-v2') || startsWith(github.event.pull_request.head.ref, 'feat/docx-v2-')
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if PR edits CK5 paths
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=$(git diff --name-only "$base" "$head" | grep -E '^(frontend/apps/web/src/features/documents/ck5/|apps/ck5-export/|apps/ck5-studio/|internal/modules/documents/application/service_ck5_|internal/modules/documents/delivery/http/handler_ck5_)' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::docx-v2 PR must not touch CK5 paths:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no CK5 paths touched"
