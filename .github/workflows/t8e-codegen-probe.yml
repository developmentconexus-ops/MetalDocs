name: T8-E Codegen Probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  codegen-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate and compile representative Go and TypeScript boundaries
        shell: bash
        env:
          OPENAPI_B64: 
          CONFIG_B64: cGFja2FnZTogcHJvYmUKZ2VuZXJhdGU6CiAgbW9kZWxzOiB0cnVlCiAgY2hpLXNlcnZlcjogdHJ1ZQogIHN0cmljdC1zZXJ2ZXI6IHRydWUKb3V0cHV0OiBwcm9iZS5nZW4uZ28K
          GOTEST_B64: 
          TS_B64: 
        run: |
          set -euxo pipefail
          work="$(mktemp -d)"
          cd "$work"
          printf '%s' "$OPENAPI_B64" | base64 -d > openapi.yaml
          printf '%s' "$CONFIG_B64" | base64 -d > oapi-codegen.yaml
          printf '%s' "$GOTEST_B64" | base64 -d > probe_test.go
          printf '%s' "$TS_B64" | base64 -d > smoke.ts

          printf 'Go toolchain: '; go version
          printf 'Node: '; node --version
          printf 'npm: '; npm --version

          mkdir -p bin
          GOTOOLCHAIN=auto GOBIN="$work/bin" go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          go version -m "$work/bin/oapi-codegen" | head -20
          "$work/bin/oapi-codegen" -config oapi-codegen.yaml openapi.yaml

          go mod init probe
          GOTOOLCHAIN=auto go mod tidy
          GOTOOLCHAIN=auto go test ./...

          npx --yes openapi-typescript@7.13.0 openapi.yaml -o types.d.ts
          npx --yes -p typescript@5.9.2 tsc --strict --noEmit --skipLibCheck --moduleResolution node --module esnext smoke.ts

          echo '=== Go generated evidence ==='
          grep -nE 'type (Status|Page|ProbeReplace|ProbeUnion)|ReplaceProbe(200|201)JSONResponse' probe.gen.go | head -40
          echo '=== TypeScript generated evidence ==='
          grep -nE 'Status:|next_cursor|required_nullable|optional_nonnullable|200:|201:' types.d.ts | head -60
          echo 'T8-E CODEGEN PROBE PASS'
