name: T8-E Bounded Edited Trigger

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Close resolved bookkeeping
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/work/current/proposal.md')
          s=p.read_text()
          reps=[
          ('1. Company replacement currently says -> Audit','1. Company replacement originally said -> Audit'),
          ('8. T8-E defines Idempotency-Key as UUID identity, while T8-D currently persists `key TEXT`','8. T8-E defines Idempotency-Key as UUID identity, while T8-D originally persisted `key TEXT`'),
          ('Bounded authority edits, if approved:','Operator-approved bounded authority edits now durable:'),
          ('T8-D currently persists only `csrf_secret_digest`, and no other ratified state can reconstruct the token on a later `GET /session`.','T8-D originally persisted only `csrf_secret_digest`, and no other ratified state could reconstruct the token on a later `GET /session`.')]
          for old,new in reps:
              if s.count(old)!=1: raise SystemExit(f'anchor mismatch {old!r} count={s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/work/current/proposal.md
          git commit -m 'docs(architecture): close reconciled T8-E bookkeeping'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
