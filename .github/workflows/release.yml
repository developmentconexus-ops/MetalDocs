name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      # supply-chain.yml's tag-triggered sbom job, moved verbatim. The
      # `if: startsWith(github.ref, 'refs/tags/')` guard from the source job
      # is dropped here — this workflow's own trigger (`push: tags: ['v*']`)
      # already makes that condition always true, so the guard would be
      # redundant rather than protective.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: metaldocs-sbom.spdx
          format: spdx-json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: metaldocs-sbom.spdx
