name: docx-renderer CI

# This is a post-merge main-branch belt, not a PR gate. The PR execution lives
# in ci.yml:verify, where `verify --profile=changed` keeps the required context
# reporting even for a docs-only change. Keeping only the push trigger removes
# the duplicate PR execution without removing the post-merge bundle check.
#
on:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod, cache: true }
      - run: pnpm install --frozen-lockfile
      # Check set for this job lives in tools/verify/registry.go
      # (docx-typecheck, docx-build, docx-test). The registry points their
      # blocking CIJob at "ci.yml:verify"; this main-only job is a post-merge
      # recheck, not a second PR definition.
      #
      # ONE invocation. docx-test contains bundle-guard.test.ts, which
      # reads dist/meta.json to assert the server bundle is framework-free —
      # so it consumes docx-build's output. That ordering used to be
      # enforced only by splitting this job into two `verify` invocations
      # (build, then test); the registry's Check.After edge
      # (docx-test After docx-build) now enforces it inside a single
      # invocation instead, so the split is no longer needed. It would also
      # now be refused: `verify` rejects a selection that contains a check
      # without its After predecessor (--only=docx-test alone excludes
      # docx-build), specifically because running it anyway is how a
      # stale dist/meta.json from an earlier build used to pass the guard
      # without re-validating current source.
      # --require-infra: without it, a missing pnpm/node (or any other
      # missing tool on Argv[0]) reports SKIP and this job exits 0 over zero
      # executed checks — the exact hole --require-infra exists to close, and
      # this job's checks are why docx-renderer.yml matters (bundle-guard.test.ts
      # is what asserts the server bundle stays framework-free; see this
      # file's header comment).
      - run: go run ./tools/verify --require-infra --only=docx-typecheck,docx-build,docx-test

# The `go` job that used to live here ran `go build ./...` plus `go test` over
# seven hand-listed packages. Every one of them is already covered by
# go-test-unit (`go test ./...`, now run in ci.yml's verify job), a strict
# superset of any package list; the compile coverage go-build claimed is
# implied by go test + go vet compiling every package.
# Removed as duplicated compute on every PR, not to reach green: coverage is
# unchanged because ci.yml:verify owns the blocking execution.
