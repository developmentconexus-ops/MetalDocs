name: docx-renderer CI

# No `paths:` filter, deliberately. A required status check is matched by NAME,
# and a job that never runs never reports — GitHub then counts it as pending
# forever and the PR can never merge. So a path-filtered workflow is structurally
# ineligible to be required, which means its checks gate nothing. Diff-scoping
# belongs one level down, in `verify --profile=changed`, where the job still
# always reports. Full rationale in api-contract.yml and A1 ledger §1b.
#
# This one matters more than most: node runs bundle-guard.test.ts, which asserts
# the docx-renderer server bundle stays framework-free. That invariant is broken
# by adding a dependency, and the old filter did not match package.json or the
# lockfile — so the exact change most likely to break it was the one change that
# did not run the guard.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod, cache: true }
      - run: pnpm install --frozen-lockfile
      # Check set for this job lives in tools/verify/registry.go
      # (docx-v2-typecheck, docx-v2-build, docx-v2-test) — see CIJob:
      # "docx-renderer.yml:node".
      #
      # ONE invocation. docx-v2-test contains bundle-guard.test.ts, which
      # reads dist/meta.json to assert the server bundle is framework-free —
      # so it consumes docx-v2-build's output. That ordering used to be
      # enforced only by splitting this job into two `verify` invocations
      # (build, then test); the registry's Check.After edge
      # (docx-v2-test After docx-v2-build) now enforces it inside a single
      # invocation instead, so the split is no longer needed. It would also
      # now be refused: `verify` rejects a selection that contains a check
      # without its After predecessor (--only=docx-v2-test alone excludes
      # docx-v2-build), specifically because running it anyway is how a
      # stale dist/meta.json from an earlier build used to pass the guard
      # without re-validating current source.
      # --require-infra: without it, a missing pnpm/node (or any other
      # missing tool on Argv[0]) reports SKIP and this job exits 0 over zero
      # executed checks — the exact hole --require-infra exists to close, and
      # this job's checks are why docx-renderer.yml matters (bundle-guard.test.ts
      # is what asserts the server bundle stays framework-free; see this
      # file's header comment).
      - run: go run ./tools/verify --require-infra --only=docx-v2-typecheck,docx-v2-build,docx-v2-test

# The `go` job that used to live here ran `go build ./...` plus `go test` over
# seven hand-listed packages. Every one of them is already covered by
# go-test-unit (`go test ./...`, now run in ci.yml's verify job), a strict
# superset of any package list; the compile coverage go-build claimed is
# implied by go test + go vet compiling every package.
# Removed as duplicated compute on every PR, not to reach green: coverage is
# unchanged, and dropping the filter above means `node` now runs on every PR,
# which is a net increase in what this workflow gates.
