name: Smoke Probe

# Manual-dispatch only. There is no hosted staging/production environment yet —
# the previous scheduled probes targeted URLs and API routes that do not exist
# (retired Approval-v2/K8s era; see ops/archive/approval-v2-smoke-roundtrip.sh).
# Re-add a schedule + alerting only once a real hosted environment exists.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL of the deployed stack (e.g. https://host or http://ip:80)'
        required: true
        type: string

jobs:
  smoke:
    name: Health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: health live + ready
        run: bash ops/smoke/healthz.sh
        env:
          BASE_URL: ${{ inputs.base_url }}
