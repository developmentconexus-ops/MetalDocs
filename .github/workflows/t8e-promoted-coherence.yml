name: T8-E Promoted Coherence Proof

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'arch/t8e-wire-contract'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify promoted T8-E candidate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re

          wire = Path('docs/architecture/wire-contract.md').read_text()
          roadmap = Path('docs/roadmap.md').read_text()
          index = Path('docs/index.md').read_text()
          decisions = Path('docs/decisions/index.md').read_text()
          forward = Path('docs/decisions/forward-obligations.md').read_text()
          ci = Path('.github/workflows/ci.yml').read_text()

          assert 'kind: authority' in wire.split('\n', 8)[0:8]
          assert 'Ratification:** PENDING explicit operator ratification' in wire
          assert not Path('docs/reference/t8e-checkpoint.md').exists()
          assert not any(Path('docs/work').rglob('*')) if Path('docs/work').exists() else True

          ledger = wire.split('# 6. Closed 78-operation ledger',1)[1].split('# 7. Document admission limits',1)[0]
          rows=[]
          for line in ledger.splitlines():
              m=re.match(r'^\|(\d+)\|`([^`]+)`\|`([^`]+)`\|(.*)$', line)
              if m:
                  rows.append((int(m.group(1)),m.group(2),m.group(3),line))
          assert len(rows)==78, len(rows)
          assert [r[0] for r in rows]==list(range(1,79))
          assert len({r[1] for r in rows})==78
          assert len({r[2] for r in rows})==78
          assert 'operation79' not in ledger

          idem={r[1] for r in rows if 'IDEMPOTENT_CREATE' in r[3] or 'SUBMISSION_CREATE' in r[3]}
          expected_idem={'createUser','createArea','createGroup','createRoleAssignment','createDocumentType','createDocument','createDocumentRevision','createSubmission','createGovernanceFeedback','createObsolescenceRequest'}
          assert idem==expected_idem,(idem,expected_idem)
          assert sum('`JSON_ETAG`' in r[3] for r in rows)==13
          assert sum('`JSON_ETAG_MUTATION`' in r[3] for r in rows)==13
          exact=[r[1] for r in rows if 'exact bytes`' in r[3] or 'exact PDF bytes`' in r[3]]
          assert exact==['getRevisionDraftSource','getSubmissionSource','getReleaseSource','getOfficialRenditionContent'],exact

          assert 'SubmissionRepresentationGate { required:boolean, satisfied:boolean }' in wire
          assert 'attention_required' not in wire
          assert 'OAS_BRANCH' in wire and 'FIXTURE_PRESENCE' in wire
          assert 'If-Match + absent profile       -> 412 precondition.resource_changed' in wire
          assert 'ShortText\n  nonblank, maxLength=256' in wire
          assert 'LongText\n  nonblank, maxLength=4096' in wire
          assert '`type=https://errors.metaldocs.io/{code}`.' in wire
          assert 'errors.conexus.fun' not in wire
          assert 'No `Retry-After` header is part of the Launch application contract' in wire
          assert 'a 200 response may reach its declared Content-Length ONLY after the complete exact-byte proof succeeds' in wire
          assert 'DocumentTypeCreatedAuditFacts' in wire
          assert 'DocumentTypeReconfigurationAuditFacts' in wire
          assert 'DocumentGovernanceAuditFacts' in wire
          assert 'TemplateEligibilityAuditFacts' in wire
          assert 'exactly **20 oneOf branch schemas**' in wire
          assert 'full **37-entry discriminator mapping**' in wire
          assert 'ObsolescenceCreateResult.state=obsolete' in wire and 'uses `state=completed`' in wire
          assert 'Embedded feedback is first20 and its continuation cursor authenticates/targets `listGovernanceFeedback`' in wire

          by_id={r[1]:r[3] for r in rows}
          assert 'validation.failed' not in by_id['searchProviderSubjects']
          assert 'validation.failed' not in by_id['listDocuments']

          assert 'architecture/wire-contract.md' in index
          assert 'reference/t8e-checkpoint.md' not in index
          assert 'T8-E' in decisions and 'wire-contract.md' in decisions
          assert 'DOC-12' not in forward
          for kind,count in {'PRESERVE':21,'REOPEN':3,'DEFERRED':27}.items():
              actual=len(re.findall(rf'^- \*\*[^*\n]+ — {kind}\*\* —',forward,re.M))
              assert actual==count,(kind,actual)
          assert 'TOTAL     51' in forward
          assert 'docs/architecture/wire-contract.md' in ci
          assert 'docs/reference/t8e-checkpoint.md' not in ci
          assert "expected = {'PRESERVE': 21, 'REOPEN': 3, 'DEFERRED': 27}" in ci
          assert 'T8-E EXECUTABLE WIRE CONTRACT' in roadmap
          assert 'ACTIVE / DRAFT PR #136' in roadmap
          assert 'rerun exact whole-candidate Global Coherence + required CI on the promoted tree' in roadmap

          print('ledger_rows=78')
          print('operation_ids=78_unique')
          print('method_paths=78_unique')
          print('idempotent_creations=10_exact')
          print('etag_domains=13_13')
          print('exact_byte_resources=4_exact')
          print('fable_material_findings=adjudicated')
          print('promotion=durable_authority_no_work_no_checkpoint')
          print('forward_obligations=21_3_27_total51')
          print('promoted_global_coherence=PASS')
          PY

          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -v '^.github/workflows/t8e-promoted-coherence.yml$' | grep -v '^.github/t8e-promoted-coherence-trigger.yml$')
          expected=(
            .github/workflows/ci.yml
            docs/architecture/async-and-search.md
            docs/architecture/authorization-and-audit.md
            docs/architecture/content-integrity.md
            docs/architecture/interfaces.md
            docs/architecture/persistence.md
            docs/architecture/wire-contract.md
            docs/decisions/forward-obligations.md
            docs/decisions/index.md
            docs/development/documentation.md
            docs/index.md
            docs/reference/t8e-checkpoint.md
            docs/roadmap.md
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" > /tmp/expected
          diff -u /tmp/expected /tmp/changed
