name: fe-ci

# Frontend gate for the main web app (frontend/apps/web).
# Before this workflow existed the ONLY enforced FE checks were a
# 1-invariant ESLint rule and path-gated advisory Playwright — tsc and
# vitest ran solely on developer memory. This makes them blocking.

# A1 item 6 — no `paths:` filter, deliberately. This job is a required
# status check, and a required check that never reports leaves the PR
# permanently pending. Diff-scoping lives in tools/verify/registry.go
# (`Paths` per check, `changed` profile) instead, where the job still
# reports. See the same note in api-contract.yml for the full rationale.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-typecheck-test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: pnpm install --frozen-lockfile
      # Check set for this job lives in tools/verify/registry.go
      # (fe-typecheck, fe-test) — see CIJob: "fe-ci.yml:web-typecheck-test".
      - name: verify (fe-typecheck, fe-test)
        run: go run ./tools/verify --only=fe-typecheck,fe-test
