name: T8-E Adjudicate Via Review

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  adjudicate:
    if: github.event.pull_request.number == 137 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arch/t8e-wire-contract
          fetch-depth: 0
      - name: Execute fail-closed Lead adjudication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          t = Path('.github/workflows/t8e-fable-adjudicate.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = t.index(start_marker) + len(start_marker)
          end = t.index(end_marker, start)
          lines = t[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/t8e-fable-adjudicate.py').write_text(script)
          PYEXTRACT
          python3 /tmp/t8e-fable-adjudicate.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/work/current/proposal.md docs/roadmap.md
          git commit -m 'docs(architecture): adjudicate T8-E Fable findings'
          git push origin HEAD:arch/t8e-wire-contract
