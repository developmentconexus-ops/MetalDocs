name: T8-E Final Lead Patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply fail-closed Lead corrections
        env:
          PATCH_B64: "     Tk9fU1RPUkVgfG5vbmV8YFUgKyBOICsgUyArIHN0YXRlLnVwbG9hZF9leHBpcmVkICsgdmFsaWRhdGlvbi5jb250ZW50X2ludmFsaWRgfCIiIiwKIiIifDYwfGBjb21wbGV0ZVJldmlzaW9uRHJhZnRVcGxvYWRgfGBQT1NUIC9hcGkvdjEvcmV2aXNpb25zL3tyZXZpc2lvbl9pZH0vZHJhZnQvdXBsb2Fkcy97dXBsb2FkX2lkfS9jb21wbGV0ZWB8bm8gYm9keSAvIGBVTlNBRkVfQ1NSRmB8YDIwNGA sIGluY2x1ZGluZyBleGFjdCBSRUFEWSByZXBlYXQgd2l0aG91dCBjbGFpbSByZXZpdmFsfGBT  "
        run: |
          set -euxo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          git diff -- docs/work/current/proposal.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/work/current/proposal.md
          git commit -m 'docs(architecture): close final T8-E Lead findings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}