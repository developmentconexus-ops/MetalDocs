name: Go Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          # Report only issues introduced by this PR (diffed against its base
          # branch), not the whole branch's divergence from main — otherwise a
          # long-lived integration branch floods every PR with pre-existing
          # findings in files the PR never touched.
          only-new-issues: true
          args: --timeout=5m ./apps/api/... ./internal/... ./tools/...
