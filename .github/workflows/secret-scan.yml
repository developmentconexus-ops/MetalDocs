name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Working-tree scan (--no-git): blocks any secret present in checked-in
      # files. History scanning is intentionally off until the F-18 history
      # rewrite (Wave 0 item 0.4) lands; flip to git mode afterwards if desired.
      - name: Run gitleaks over checked-in files
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --no-git --redact --exit-code 1
