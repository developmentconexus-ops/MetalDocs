name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Working-tree scan (--no-git): blocks any secret present in checked-in
      # files. This is the blocking gate. Full git-history scanning is deferred
      # to Wave 1 (tracked): it surfaces ~15 historical test-fixture/dummy-token
      # findings that need a triage-or-allowlist pass first, so enabling it now
      # would red-line CI on pre-existing noise rather than on a real leak.
      - name: Run gitleaks over checked-in files
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --no-git --redact --exit-code 1
