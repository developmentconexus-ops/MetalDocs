name: secret-scan

# The push trigger is scoped to `main` deliberately. Unscoped, a PR branch
# fires BOTH triggers on the same commit, producing two check runs that share
# the name `gitleaks` — and a required status check is matched by name, so the
# ruleset would have no defined answer about which run it means. Scanning is
# not lost: `pull_request` covers the branch pre-merge and `push: main` covers
# the merge commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for git-mode scan
      # Full git-history scan: walks every commit so secrets removed from HEAD
      # but still present in history are caught. The allowlist in .gitleaks.toml
      # covers all triaged non-secrets (test fixtures, .gen.go spec chunks,
      # dummy literals, stale plan-doc tokens). Triage completed Wave Z item
      # Z-26 (F-18 round-2); zero real secrets found in history.
      # -v is not optional. Without it the step reports only "leaks found: 5"
      # and names none of them, which makes the failure unactionable — a gate
      # that fails without saying what failed is its own defect.
      - name: Run gitleaks over full git history
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --config /repo/.gitleaks.toml --redact -v --exit-code 1
