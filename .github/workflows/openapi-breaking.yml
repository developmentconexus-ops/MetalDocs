name: openapi-breaking

# F1.1 (global-maximum-remediation, Milestone 1) — oasdiff breaking-change gate.
#
# What this enforces: on any PR that touches api/openapi/v1/openapi.yaml, the PR's spec
# (head) is compared against the spec as it existed on the PR's base branch (from) using
# oasdiff in "breaking" mode. Any OpenAPI-level breaking change (removed path/operation,
# a property dropped from a response schema's `required` list, a narrowed enum/type, etc.)
# fails this job with a named diagnostic. This is a BLOCKING check — no continue-on-error —
# per repo Principle-5 posture (see api-contract.yml).
#
# Base-resolution choice: `pull_request` events always have two real refs to compare —
# github.event.pull_request.base.sha (the merge-base-adjacent base commit) and the PR head
# checked out by actions/checkout by default. We fetch just enough history
# (fetch-depth: 0 is avoided; we fetch the base sha directly) and use `git show <base-sha>:<path>`
# to materialize the base spec into a temp file, then run oasdiff against the checked-out
# head spec. This avoids a second full checkout and works for any base branch, not just main.
#
# On `push: branches: [main]` there is no PR base ref to diff against (a push is already
# merged). Per the spec's guard requirement we do NOT attempt a same-branch parent-commit
# diff here (HEAD~1 on main is not a "base vs proposed change" comparison and would produce
# false positives on merge commits / squash histories) — the job simply does not run on
# push. Breaking-change protection for main is guaranteed because every change to main goes
# through a PR, where this job is blocking.

on:
  pull_request:
    paths:
      - 'api/openapi/v1/openapi.yaml'
      - '.github/workflows/openapi-breaking.yml'

jobs:
  oasdiff-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest

      - name: Materialize base-branch spec
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          git show "${{ github.event.pull_request.base.sha }}:api/openapi/v1/openapi.yaml" > /tmp/openapi.base.yaml

      - name: oasdiff breaking-change gate (BLOCKING — any breaking change fails)
        run: |
          oasdiff breaking /tmp/openapi.base.yaml api/openapi/v1/openapi.yaml --fail-on ERR
