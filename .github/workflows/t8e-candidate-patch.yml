name: T8-E Candidate Consolidation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded evidence consolidation
        env:
          PATCH_B64: "
   BleHBhbmRlZCBieXRlcyA+IERPQ1hfRVhQQU5ERURfTUFYX0JZVEVTCiAgLT4gNDIyIHZhbGlkYXRpb24uY29udGVudF9pbnZhbGlkCgphY3R1YWwgRE9DWC   GNvbnZlcmdlLCBjcmVhdGUgcmV2aWV3L3Q4ZS1mYWJsZSBmcm9tIHRoYXQgZXhhY3QgY2FuZGlkYXRlIEhFQUQKRS4gaW5kZXBlbmRlbnQgRmFibGUgY2hhbGxlbmdlCkYuIExlYWQgYWRqdWRpY2F0aW9uIG9mIEZhYmxlIGV2aWRlbmNlCkcuIGV4cGxpY2l0IG9wZXJhdG9yIHJhdGlmaWNhdGlvbgpgYGAKClVudGlsIEHihpJDI GNvbnZlcmdlOgoKYGBgdGV4dApUOC1FIEFDVElWRQpUOC1GIE5PVCBPUEVOCmltcGxlbWVudGF0aW9uIEJMT0NLRUQKRmFibGUgTk9UIFNUQVJURUQKYGBgJycnLnJzdHJpcCgpICsgIlxuIgoKcC53cml0ZV90ZXh0KHMpCg=="
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          git diff -- docs/work/current/proposal.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/work/current/proposal.md
          git commit -m 'docs(architecture): consolidate T8-E executable evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
