name: api-contract

on:
  pull_request:
    paths:
      - 'api/openapi/**'
      - '**/api.gen.go'
      - 'frontend/apps/web/src/lib/api-types/**'
      - 'frontend/apps/web/package.json'
      - 'frontend/apps/web/package-lock.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/api-contract.yml'
      - 'redocly.yaml'
      - 'scripts/api-lint/**'
      - 'internal/modules/**'
      - 'db/reference-data/**'
      - 'wiki/concepts/authz-tiers.md'
      - 'wiki/references/local-dev-credentials.md'
      - 'wiki/modules/iam.md'
  push:
    branches: [main]

jobs:
  backend-codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 1.25.x, cache: true }
      - name: API codegen drift check (backend)
        run: |
          go generate ./...
          git diff --exit-code -- '**/api.gen.go' || (echo "::error::Run 'go generate ./...' and commit"; exit 1)

  frontend-codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.0, cache: npm, cache-dependency-path: frontend/apps/web/package-lock.json }
      - run: npm ci
        working-directory: frontend/apps/web
      - name: API codegen drift check (frontend)
        run: |
          cd frontend/apps/web
          npm run gen:api
          git diff --exit-code -- src/lib/api-types/ || (echo "::error::Run 'npm run gen:api' in frontend/apps/web and commit"; exit 1)

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.0 }
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@latest lint api/openapi/v1/openapi.yaml

  api-design-system-lint:
    # ADR 0022 Phase 13 — Principle 5 enforced. Two rule-sets, one job:
    #
    #   BLOCKING (gates this job): the registry-binding guards, the dialect bans
    #   (no-inline / no-rawstring / no-rolestring), authz-area-scope-binding, and
    #   tripwire-pairing. These are 0 on a clean tree; a real drift/dialect
    #   regression turns the build RED.
    #
    #   REPORTED-ONLY (continue-on-error step): the spec-contract-drift families
    #   (ENVELOPE-/AUTHZ-/PAGINATION-DRIFT), ~397 pre-existing hits deferred to a
    #   dedicated spec-hygiene phase. Surfaced + counted, never blocking yet.
    #
    # CRITICAL: pass the REPO ROOT (`.`), not `./internal/modules`. Every binding
    # helper joins its core files off the repo root (internal/modules/...,
    # db/reference-data/..., wiki/...); the old `./internal/modules` arg made
    # every join miss so the guards loaded nothing and passed trivially. `-strict`
    # makes a wrong root a hard error so that can never silently recur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 1.25.x, cache: true }
      - name: api-lint unit tests (incl. e2e self-test)
        run: go test ./scripts/api-lint/... -count=1
      - name: api-lint binding/dialect/tripwire guards (BLOCKING)
        run: go run ./scripts/api-lint/ -strict -enforce=blocking api/openapi/v1/openapi.yaml .
      - name: api-lint spec-contract-drift backlog (reported-only, non-blocking)
        continue-on-error: true
        run: go run ./scripts/api-lint/ -enforce=reported api/openapi/v1/openapi.yaml .
