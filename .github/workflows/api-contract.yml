name: api-contract

# A1 item 6 — NO `paths:` FILTER ON THIS WORKFLOW, DELIBERATELY.
#
# Every job here is a required status check on the `main` ruleset. GitHub
# treats a required check that never reports as permanently pending, so a
# path-filtered required workflow deadlocks any PR outside its filter. A
# control that sometimes does not fire is not a gate — same defect class as
# an unwired script.
#
# Diff-scoping did not disappear, it moved one level down: the job always
# runs and `tools/verify` decides what is relevant (see the `Paths` field on
# each check in tools/verify/registry.go and the `changed` profile). That is
# the correct place for it, because the job still reports either way.
#
# Report-tier workflows that are NOT required (ci, perf, e2e-coverage-gate,
# supply-chain, req-traceability, openapi-breaking) keep their filters.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: API codegen drift check (backend)
        run: |
          go generate ./...
          git diff --exit-code -- '**/api.gen.go' '**/httpsurface_gen.go' '**/httpsurface_e2e_gen.go' || (echo "::error::Run 'go generate ./...' and commit"; exit 1)

  frontend-codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: API codegen drift check (frontend)
        run: |
          cd frontend/apps/web
          pnpm run gen:api
          git diff --exit-code -- src/lib/api-types/ || (echo "::error::Run 'pnpm run gen:api' in frontend/apps/web and commit"; exit 1)

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@latest lint api/openapi/v1/openapi.yaml
      - name: OpenAPI lint (internal-e2e)
        # Task 12: the e2e scaffolding document did not exist until now — a
        # gate authored before its subject would pass vacuously. Same command,
        # second document; the file stays excluded from the public bundle and
        # frontend codegen (checked separately below), only its own contract
        # hygiene is gated here.
        run: npx --yes @redocly/cli@latest lint api/openapi/internal-e2e.yaml

  spec-base-path-gate:
    # AD-1 (api-contract-hardening Phase A): servers.url carries the /api/v1
    # base, so every OpenAPI path key must be relative. A re-prefixed key
    # produces doubled URLs (/api/v1/api/v1/...) for spec-respecting consumers.
    # Blocking — this is the gate that keeps the double-prefix bug class dead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Check set for this job lives in tools/verify/registry.go
      # (api-lint-base-path-v1, api-lint-base-path-e2e) — see CIJob:
      # "api-contract.yml:spec-base-path-gate". internal-e2e.yaml declares an
      # empty servers.url (§4, Task 12) — its paths mount at the server root,
      # not under /api/v1 — but the rule still runs on it so a future edit
      # that reintroduces an /api/ path key into that document is caught too.
      - name: verify (api-lint-base-path-v1, api-lint-base-path-e2e)
        run: go run ./tools/verify --only=api-lint-base-path-v1,api-lint-base-path-e2e

  api-design-system-lint:
    # ADR 0022 Phase 13 — Principle 5 enforced. EVERY api-lint rule is BLOCKING:
    # the registry-binding guards, the dialect bans (no-inline / no-rawstring /
    # no-rolestring), authz-area-scope-binding, tripwire-pairing, AND the spec-
    # contract-drift families (ENVELOPE-/AUTHZ-/PAGINATION-DRIFT, which all
    # graduated to blocking in Phases D/E2). These are 0 on a clean tree; any
    # violation turns the build RED. There is no reported-only/non-blocking tier —
    # the deferral backlog is empty, so a continue-on-error step would only let a
    # real regression be silently bypassed.
    #
    # CRITICAL: pass the REPO ROOT (`.`), not `./internal/modules`. Every binding
    # helper joins its core files off the repo root (internal/modules/...,
    # db/reference-data/..., wiki/...); the old `./internal/modules` arg made
    # every join miss so the guards loaded nothing and passed trivially. `-strict`
    # makes a wrong root a hard error so that can never silently recur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Check set for this job lives in tools/verify/registry.go
      # (api-lint-selftest, api-lint-strict) — see CIJob:
      # "api-contract.yml:api-design-system-lint".
      - name: verify (api-lint-selftest, api-lint-strict)
        run: go run ./tools/verify --only=api-lint-selftest,api-lint-strict

  problem-codes-freshness:
    # ADR 0089 step 12 — the Problem code catalog is generated from the registry
    # (cmd/problem-codes-dump), and two committed artifacts have to agree with it:
    # the frontend PT-BR coverage snapshot and the wiki code table. Neither is
    # imported by Go code, so nothing else notices when they go stale — the
    # frontend coverage test would then be checking parity against a snapshot that
    # is itself out of date, i.e. passing while wrong.
    #
    # `-check` regenerates in memory and byte-compares. It does not write, so a
    # green run proves the committed files ARE the generated files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Check set for this job lives in tools/verify/registry.go
      # (problem-codes-fresh) — see CIJob: "api-contract.yml:problem-codes-freshness".
      - name: verify (problem-codes-fresh)
        run: go run ./tools/verify --only=problem-codes-fresh

  contract-sync:
    # M1 F1.3 — check-module-contract-sync.ps1 promoted from advisory to a
    # BLOCKING gate over the four generated-boundary modules that are fully
    # reconciled to current runtime truth (relative AD-1 spec keys + the
    # actual delivery/http mount files): templates, documents,
    # controlleddocuments, taxonomy. `approval` (UsesGeneratedBoundary=$false)
    # is intentionally excluded — its ownership questions are entangled with
    # the M9 F9.5 approval-promotion/boundary decision (see
    # docs/superpowers/milestones/global-maximum-remediation/
    # milestone-1-contract-fe-gates/validation-contract.md §F1.3). No
    # continue-on-error: a drift in any of the four gated modules fails CI.
    #
    # Runner: ubuntu-latest with `shell: pwsh` (not windows-latest). PowerShell
    # Core ships preinstalled on GitHub-hosted ubuntu runners, matching the
    # convention of every other job in this workflow, and the checker itself
    # is pure Get-Content/regex/HashSet with no Windows-only cmdlets — no
    # reason to pay for a Windows runner here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Check set for this job lives in tools/verify/registry.go
      # (contract-sync) — see CIJob: "api-contract.yml:contract-sync".
      - name: verify (contract-sync)
        run: go run ./tools/verify --only=contract-sync
