name: T8-E Coherence Apply

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Apply staged coherence delta after script leaves tree
        shell: bash
        run: |
          set -euxo pipefail
          if git ls-files --error-unmatch .github/t8e-coherence-patch.py >/dev/null 2>&1; then
            echo 'staged script still tracked; wait for removal commit'
            exit 0
          fi
          git show HEAD^:.github/t8e-coherence-patch.py > /tmp/t8e-coherence-patch.py
          python3 /tmp/t8e-coherence-patch.py
          git diff --check
          git diff -- docs/work/current/proposal.md docs/roadmap.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/work/current/proposal.md docs/roadmap.md
          git commit -m 'docs(architecture): record final bounded T8-E coherence package'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
