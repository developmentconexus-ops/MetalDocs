name: T8-E Record Lead Pass

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Record verified Lead convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/work/current/proposal.md')
          s=p.read_text()
          old='''# 11. Remaining closure gate

The measurement, generated-boundary feasibility, provider presign feasibility, strict-request validator split, 78-row ledger-census fixture obligations and all evidence-triggered upstream reconciliations are closed at candidate level.

Remaining Lead gate:

```text
A. rerun whole-candidate Structural Inversion / YAGNI / overengineering / global-coherence exact-delta check
B. revalidate main/base + exact candidate HEAD + intended authority/work diff + required CI
C. only if A→B converge, create review/t8e-fable from that exact candidate HEAD
D. independent Fable challenge
E. Lead adjudication of Fable evidence
F. explicit operator ratification
```

Until A→B converge:

```text
T8-E ACTIVE
T8-F NOT OPEN
implementation BLOCKED
Fable NOT STARTED
```'''
          new='''# 11. Remaining closure gate

The measurement, generated-boundary feasibility, provider presign feasibility, strict-request validator split, 78-row ledger-census fixture obligations and all evidence-triggered upstream reconciliations are closed at candidate level.

## 11.1 Final Lead Global Coherence — PASS

Fresh executable proof on 2026-08-21 established:

```text
ledger_rows                         78
operation_ids                       78 unique
method+path                         78 unique
Idempotency-Key creations           exact 10
ETag read/mutation domains          13 / 13
exact-byte resources                exact 4
bounded findings 8.4–8.6            RESOLVED
authority parity                    PASS
global_coherence                    PASS
```

Structural Inversion / YAGNI result remains subtractive: no Product operation, owner, lifecycle, generic workflow, second validation framework, generic async bus, duplicate PDF rendition work, second CSRF credential surface or implementation code was introduced.

Remaining gate:

```text
A. remove temporary proof/recording harness and revalidate main/base + exact clean candidate HEAD + intended 8-file authority/work diff + required CI
B. only if A converges, create review/t8e-fable from that exact candidate HEAD
C. independent Fable challenge
D. Lead adjudication of Fable evidence
E. explicit operator ratification
```

Until A converges:

```text
T8-E ACTIVE
T8-F NOT OPEN
implementation BLOCKED
Fable NOT STARTED
```'''
          if s.count(old)!=1: raise SystemExit(f'proposal gate anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('docs/roadmap.md')
          s=p.read_text()
          old='''The correction remained subtractive/precision-only: no Product operation, owner, lifecycle state, permission, table family, generic worker, second cookie or new API was added.

## Exact next action

```text
rerun exact whole-candidate Structural Inversion / YAGNI / overengineering / global-coherence delta
→ revalidate main/base + exact candidate HEAD + intended authority/work diff + required CI
→ if and only if the Lead delta converges, create isolated review/t8e-fable from exact candidate HEAD
→ independent Fable challenge
→ Lead adjudication
→ explicit operator ratification
```'''
          new='''The correction remained subtractive/precision-only: no Product operation, owner, lifecycle state, permission, table family, generic worker, second cookie or new API was added.

The final Lead whole-candidate Structural Inversion / YAGNI / overengineering / global-coherence proof passed on 2026-08-21: 78 unique operations, exact 10 durable-idempotent creations, 13 ETag read/mutation domains, exact four byte resources, §§8.4–8.6 resolved and authority parity PASS.

## Exact next action

```text
remove temporary proof/recording harness
→ revalidate main/base + exact clean candidate HEAD + intended 8-file authority/work diff + required CI
→ if and only if that clean-head revalidation converges, create isolated review/t8e-fable from exact candidate HEAD
→ independent Fable challenge
