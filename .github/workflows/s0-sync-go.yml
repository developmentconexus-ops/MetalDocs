name: S0 Sync Go Module

on:
  push:
    branches:
      - fix/verification-baseline-2026-08

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout S0 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/verification-baseline-2026-08
          fetch-depth: 0

      - name: Set up selected Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: false

      - name: Regenerate module checksums and vendor tree
        run: |
          set -euo pipefail
          go mod tidy
          go mod vendor

      - name: Remove temporary synchronizer and publish generated result
        run: |
          set -euo pipefail
          git rm .github/workflows/s0-sync-go.yml
          git add go.mod go.sum vendor
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected generated module changes, but the tree is unchanged." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): sync Go module vendor"
          git push origin HEAD:fix/verification-baseline-2026-08
