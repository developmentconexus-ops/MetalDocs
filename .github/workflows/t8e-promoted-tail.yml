name: T8-E Promoted Tail Proof

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'arch/t8e-wire-contract'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify promotion tail
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          grep -Eq 'T8-E EXECUTABLE WIRE CONTRACT[[:space:]]+ACTIVE / DRAFT PR #136' docs/roadmap.md
          grep -Fq 'rerun exact whole-candidate Global Coherence + required CI on the promoted tree' docs/roadmap.md
          test -f docs/architecture/wire-contract.md
          test ! -e docs/reference/t8e-checkpoint.md
          if git ls-files 'docs/work/**' | grep -q .; then
            echo 'tracked docs/work remains'
            exit 1
          fi
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -v '^.github/workflows/t8e-promoted-coherence.yml$' | grep -v '^.github/workflows/t8e-promoted-tail.yml$' | grep -v '^.github/t8e-promoted-coherence-trigger.yml$')
          expected=(
            .github/workflows/ci.yml
            docs/architecture/async-and-search.md
            docs/architecture/authorization-and-audit.md
            docs/architecture/content-integrity.md
            docs/architecture/interfaces.md
            docs/architecture/persistence.md
            docs/architecture/wire-contract.md
            docs/decisions/forward-obligations.md
            docs/decisions/index.md
            docs/development/documentation.md
            docs/index.md
            docs/reference/t8e-checkpoint.md
            docs/roadmap.md
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed
          printf '%s\n' "${expected[@]}" > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo promoted_tail=PASS
