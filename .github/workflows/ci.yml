name: CI
on:
  pull_request:
    branches: [main]

# No trigger-level paths:. A path filter at the trigger makes the workflow not
# run at all, which leaves a required context permanently pending and blocks
# the merge. Filtering happens per job, via the changes job below, so every
# job still reports a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docx: ${{ steps.filter.outputs.docx }}
      contract: ${{ steps.filter.outputs.contract }}
      db: ${{ steps.filter.outputs.db }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - 'scripts/**'
            frontend:
              - 'frontend/**'
            docx:
              - 'apps/docx-renderer/**'
              - 'packages/docx-editor/**'
            contract:
              - 'api/openapi/**'
              - 'internal/modules/*/delivery/http/**'
            db:
              - 'db/**'
            workflows:
              - '.github/workflows/**'
              - '.github/rulesets/**'

  lint-go:
    name: lint-go
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - name: registry checks
        run: >
          go run ./tools/verify --require-infra
          --only=gofmt,go-vet,go-vet-integration,cilint,staticcheck,module-boundaries,test-discipline
      # golangci-lint stays report-tier for this restructure: 1078 findings at
      # the configured scope, and apps/worker and apps/jobs have no lint
      # coverage at all today. Spec §11.1. Promoting it is a later milestone's
      # work, not this one's. Copied verbatim from golangci-lint.yml, SHA-pinned.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          # Report only issues introduced by this PR (diffed against its base
          # branch), not the whole branch's divergence from main — otherwise a
          # long-lived integration branch floods every PR with pre-existing
          # findings in files the PR never touched.
          only-new-issues: true
          args: --timeout=5m ./apps/api/... ./internal/... ./tools/...
        continue-on-error: true

  lint-contract:
    name: lint-contract
    needs: [changes]
    if: needs.changes.outputs.contract == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # oasdiff compares against the base ref
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - name: registry checks
        run: >
          go run ./tools/verify --require-infra
          --only=problem-codes-fresh,api-lint-base-path-e2e,api-lint-strict,api-lint-selftest,contract-sync
      # backend-codegen-drift — copied verbatim from api-contract.yml, SHA-pinned.
      - name: API codegen drift check (backend)
        run: |
          go generate ./...
          git diff --exit-code -- '**/api.gen.go' '**/httpsurface_gen.go' '**/httpsurface_e2e_gen.go' || (echo "::error::Run 'go generate ./...' and commit"; exit 1)
      # frontend-codegen-drift — copied verbatim from api-contract.yml, SHA-pinned.
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: API codegen drift check (frontend)
        run: |
          cd frontend/apps/web
          pnpm run gen:api
          git diff --exit-code -- src/lib/api-types/ || (echo "::error::Run 'pnpm run gen:api' in frontend/apps/web and commit"; exit 1)
      # openapi-lint — copied verbatim from api-contract.yml, SHA-pinned.
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@latest lint api/openapi/v1/openapi.yaml
      - name: OpenAPI lint (internal-e2e)
        # Task 12: the e2e scaffolding document did not exist until now — a
        # gate authored before its subject would pass vacuously. Same command,
        # second document; the file stays excluded from the public bundle and
        # frontend codegen (checked separately below), only its own contract
        # hygiene is gated here.
        run: npx --yes @redocly/cli@latest lint api/openapi/internal-e2e.yaml
      # oasdiff-breaking — copied verbatim from openapi-breaking.yml, SHA-pinned.
      # fetch-depth: 0 above (checkout step) covers this step's need for base-ref history.
      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest
      - name: Materialize base-branch spec
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          git show "${{ github.event.pull_request.base.sha }}:api/openapi/v1/openapi.yaml" > /tmp/openapi.base.yaml
      - name: oasdiff breaking-change gate (BLOCKING — any breaking change fails)
        run: |
          oasdiff breaking /tmp/openapi.base.yaml api/openapi/v1/openapi.yaml --fail-on ERR

  lint-frontend:
    name: lint-frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: registry checks
        run: >
          go run ./tools/verify --require-infra
          --only=fe-eslint,css-token-discipline,eigenpal-selector-pin,docx-v2-typecheck

  test-go:
    name: test-go
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/verify --require-infra --only=go-test-unit

  test-frontend:
    name: test-frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docx-v2-build before docx-v2-test, in one job, in this order. The
      # registry admits at registry.go:273 that these two are order-dependent
      # and that nothing enforced the order; putting them in one sequential
      # job is what makes the ordering true rather than hoped for.
      - run: go run ./tools/verify --require-infra --only=fe-typecheck,fe-test,docx-v2-build,docx-v2-test

  governance:
    name: governance
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # check-governance.ps1 diffs against origin/main; also needed for the migration-history check below
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./tools/verify --require-infra --only=adr-status,wiki-tally,db-dictionary,req-trace-selftest,req-trace,required-gate-selftest
      # Migration monotonicity check — copied verbatim from
      # invariants.yml:migration-gapless.
      - name: Check gapless sequence + no historical edits
        run: |
          set -euo pipefail
          MIGRATION_DIR="db/migrations"

          # After the 2026-07-29 fold (migrations 0257-0315 squashed into
          # db/baseline, files moved to
          # archive/migrations/post-baseline-2026-07-fold/) the directory holds
          # only its README. Under `set -euo pipefail` an unmatched `ls` glob
          # would abort the step, so the empty case is guarded explicitly: skip
          # the gapless sequence check (there is no sequence), but still run the
          # historical-edit check below — that one is a git-history question,
          # not a filesystem one, and stays meaningful with an empty directory.
          shopt -s nullglob
          files=("$MIGRATION_DIR"/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "✅ No forward migrations (post-fold baseline) — gapless check skipped"
          else
            # Discover min and max from filesystem (never hardcoded). Match only
            # the leading 4-digit prefix of each basename — `grep -oE '[0-9]+'` on
            # the full path also captured digits inside descriptions (e.g. phase8),
            # making MIN collapse to 2.
            nums=$(printf '%s\n' "${files[@]}" \
              | xargs -r -n1 basename | grep -oE '^[0-9]{4}' | sort -n)
            MIN=$(echo "$nums" | head -1)
            MAX=$(echo "$nums" | tail -1)

            echo "Checking migrations $MIN..$MAX for gapless sequence..."
            for n in $(seq "$MIN" "$MAX"); do
              padded=$(printf "%04d" "$n")
              hits=("$MIGRATION_DIR"/${padded}_*.sql)
              if [ ${#hits[@]} -eq 0 ]; then
                echo "❌ Gap: migration $padded missing"
                exit 1
              fi
            done

            echo "✅ Gapless $MIN..$MAX"
          fi

          # Check no historical migrations were modified after merge
          # (only check files that exist in main already). The pathspec is fully
          # quoted so GIT expands it — with nullglob an unquoted `*.sql` would
          # vanish from the argv and turn this into a repo-wide query.
          BASE=${GITHUB_BASE_REF:-main}
          MODIFIED=$(git log --diff-filter=M --follow --name-only \
            "origin/$BASE...HEAD" -- "$MIGRATION_DIR/*.sql" 2>/dev/null | grep '\.sql$' || true)

          if [ -n "$MODIFIED" ]; then
            echo "❌ Historical migrations modified: $MODIFIED"
            exit 1
          fi
          echo "✅ No historical migration edits"
      # check-governance.ps1 — copied verbatim from governance-check.yml:check.
      - name: Fetch base ref
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Run governance checks (PowerShell)
        shell: pwsh
        run: ./scripts/check-governance.ps1 -BaseRef "origin/${{ github.base_ref }}"
      # Invariant→spec-ID coverage grep — copied verbatim from
      # e2e-coverage-gate.yml:coverage-map-check.
      - name: Check all invariants have ≥1 spec ID
        run: |
          COVERAGE=frontend/apps/web/e2e/COVERAGE.md
          echo "Scanning $COVERAGE for unmapped invariants..."

          # Find all invariant rows (lines with | Pn-Ixx | or | Fn | pattern)
          UNMAPPED=$(grep -E '^\|[[:space:]]*(P[0-9]+-I[0-9]+|F[0-9]+)[[:space:]]*\|' "$COVERAGE" \
            | grep '❌' \
            | awk -F'|' '{print $2}' | xargs)

          if [ -n "$UNMAPPED" ]; then
            echo "❌ Unmapped invariants found: $UNMAPPED"
            echo "Add ≥1 spec ID for each before merging."
            exit 1
          fi

          echo "✅ All invariants are mapped."

  test-integration:
    name: test-integration
    # The whole fix for the original complaint. The 20-minute suite does not
    # start until the cheap jobs pass. It stays pre-merge and blocking:
    # A1 item 4 and test-full.yml:2 both require the full suite before merge.
    needs: [changes, lint-go, lint-contract, lint-frontend, test-go]
    # !cancelled() is a status-check function; it suppresses the implicit
    # success() so a skipped upstream job does not skip this one (a plain
    # AND-of-success `if:` propagates skip through `needs:`). The per-job
    # `!= 'failure'` guards keep the edge's real purpose: don't start the
    # 20-minute suite when a cheap check already failed. Bracket syntax is
    # required because hyphenated job ids can't be dot-dereferenced
    # (needs.lint-go parses as subtraction).
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.changes.outputs.go == 'true' || needs.changes.outputs.db == 'true')
      && needs['lint-go'].result != 'failure'
      && needs['lint-contract'].result != 'failure'
      && needs['lint-frontend'].result != 'failure'
      && needs['test-go'].result != 'failure'
    runs-on: ubuntu-latest
    # services:, the postgres user/db names and timeout-minutes: 20 below are
    # copied verbatim from test-full.yml:full — not from the sketch in the
    # task brief, which used different (invented) credentials.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metaldocs
          POSTGRES_PASSWORD: metaldocs
          POSTGRES_DB: metaldocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      # --require-infra is what makes this job's green mean anything. Without
      # it, an unset METALDOCS_DATABASE_URL yields SKIP and the job exits 0
      # over zero executed integration tests. test-full.yml did not carry
      # --require-infra; adding it here is this task's deliberate fix.
      - name: verify (go-test-integration)
        env:
          METALDOCS_DATABASE_URL: postgres://metaldocs:metaldocs@localhost:5432/metaldocs?sslmode=disable
        run: go run ./tools/verify --require-infra --only=go-test-integration
        timeout-minutes: 20

  security:
    name: security
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload; this is why these live in YAML, not in verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # gitleaks scans full history
      # gitleaks — copied verbatim from secret-scan.yml:gitleaks.
      - name: Run gitleaks over full git history
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source /repo --config /repo/.gitleaks.toml --redact -v --exit-code 1
      # grype (CVE scan) — copied verbatim from supply-chain.yml:cve-scan, SHA-pinned.
      - id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          cache-db: true
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  required:
    name: required
    if: ${{ always() }}
    needs: [changes, lint-go, lint-contract, lint-frontend, governance,
            test-go, test-frontend, test-integration, security]
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate all CI results
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e -f scripts/required-gate.jq <<<"$NEEDS_JSON" >/dev/null; then
            jq -r 'to_entries[] | "\(.key)=\(.value.result // "null")"' <<<"$NEEDS_JSON"
            exit 1
          fi
