name: CI
on:
  pull_request:
    branches: [main]

# No trigger-level paths:. A path filter at the trigger makes the workflow not
# run at all, which leaves a required context permanently pending and blocks
# the merge. Filtering happens per job, via the changes job below, so every
# job still reports a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docx: ${{ steps.filter.outputs.docx }}
      contract: ${{ steps.filter.outputs.contract }}
      db: ${{ steps.filter.outputs.db }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'tools/**'
              - 'scripts/**'
            frontend:
              - 'frontend/**'
            docx:
              - 'apps/docx-renderer/**'
              - 'packages/docx-editor/**'
            contract:
              - 'api/openapi/**'
              - 'internal/modules/*/delivery/http/**'
            db:
              - 'db/**'
            workflows:
              - '.github/workflows/**'
              - '.github/rulesets/**'
