name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify clean-slate repository shape
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/index.md
          test -f docs/status.md
          test -f docs/development/documentation.md
          test ! -e wiki
          test ! -e docs/superpowers
          test ! -e api
          test ! -e apps
          test ! -e cmd
          test ! -e db
          test ! -e deploy
          test ! -e frontend
          test ! -e internal
          test ! -e packages
          test ! -e scripts
          test ! -e tests
          test ! -e tools
          test ! -e vendor
          git diff --check
