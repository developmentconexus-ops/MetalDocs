name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify Repository Standard v1 envelope
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Review branches are isolated Evidence channels and are deliberately
          # non-mergeable. They must target the current candidate branch, not
          # main; the candidate base must be an ancestor of the review head;
          # and the only delta may be the temporary Fable dialogue.
          if [[ "$HEAD_REF" == review/* ]]; then
            if [[ "$BASE_REF" == "main" ]]; then
              echo "::error::review branches must target their candidate branch, never main"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
              echo "::error::review branch does not contain the current candidate base"
              exit 1
            fi
            mapfile -t changed < <(git diff --name-only "$BASE_SHA..$HEAD_SHA")
            [[ "${#changed[@]}" -eq 1 ]]
            [[ "${changed[0]}" == "docs/work/current/ai-dialog.md" ]]
            git diff --check "$BASE_SHA..$HEAD_SHA"
            echo "::error::review branches are Evidence channels and must be closed/deleted, never merged"
            exit 1
          fi

          # Main-targeting architecture-first PRs admit only the accepted live surfaces.
          [[ "$BASE_REF" == "main" ]]
          allowed_path() {
            [[ "$1" =~ ^(AGENTS\.md|CLAUDE\.md|README\.md|\.gitignore|\.gitattributes|\.github/.+\.ya?ml|docs/.+\.md)$ ]]
          }

          allowed_path "docs/roadmap.md"
          allowed_path ".github/workflows/ci.yml"
          if allowed_path "src/main.go" || allowed_path "openapi/app.yaml" || allowed_path "migrations/001.sql"; then
            echo "::error::architecture-only allowlist accepted implementation path"
            exit 1
          fi

          invalid=0
          while IFS= read -r path; do
            if ! allowed_path "$path"; then
              echo "::error file=$path::tracked path is outside the architecture-first allowlist"
              invalid=1
            fi
          done < <(git ls-files)
          [[ "$invalid" -eq 0 ]]

          # Required bootstrap and unique routing surfaces.
          test -f AGENTS.md
          test -f docs/index.md
          test -f docs/roadmap.md
          test ! -e docs/status.md
          test ! -e docs/decisions/stage-program.md

          bootstrap_bytes=$(( $(wc -c < AGENTS.md) + $(wc -c < docs/index.md) + $(wc -c < docs/roadmap.md) ))
          echo "bootstrap_bytes=$bootstrap_bytes"
          [[ "$bootstrap_bytes" -le 20480 ]]

          # README/routers cannot become parallel mutable roadmaps.
          if grep -Eiq 'PR #[0-9]+|Current (posture|stage|gate)|Exact next action|T8-[A-Z].*(ACTIVE|PAUSED|CLOSED)|IMPLEMENTATION[[:space:]]+(BLOCKED|ALLOWED)' README.md AGENTS.md docs/index.md; then
            echo "::error::mutable stage/status leaked outside docs/roadmap.md"
            exit 1
          fi

          # Merge candidates/main contain no temporary work or permanent review trees.
          if [[ "$PR_DRAFT" != "true" ]] && git ls-files 'docs/work/**' | grep -q .; then
            echo "::error::docs/work must be absent from a merge candidate"
            exit 1
          fi
          if git ls-files | grep -Eqi '(^|/)(docs/superpowers|old|archive|tombstones?|reviews?|rounds?|handoffs?)(/|$)|ai-dialog'; then
            echo "::error::permanent old/archive/review/handoff surface detected"
            exit 1
          fi

          # Required Product/R10 authority set survives the reset.
          for path in \
            docs/product/contract.md \
            docs/product/alignment.md \
            docs/product/journeys.md \
            docs/architecture/ownership.md \
            docs/architecture/domain-model.md \
            docs/architecture/lifecycle.md \
            docs/architecture/authorization-and-audit.md \
            docs/architecture/content-integrity.md \
            docs/architecture/async-and-search.md \
            docs/architecture/technical-baseline.md \
            docs/architecture/backend.md \
            docs/architecture/interfaces.md \
            docs/architecture/persistence.md \
            docs/architecture/wire-contract.md \
            docs/decisions/api-operation-census.md \
            docs/decisions/forward-obligations.md; do
            test -f "$path"
          done

          # Decision forward-obligation census is mechanically closed.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/decisions/forward-obligations.md').read_text()
          expected = {'PRESERVE': 21, 'REOPEN': 3, 'DEFERRED': 27}
          for kind, count in expected.items():
              actual = len(re.findall(rf'^- \*\*[^*\n]+ — {kind}\*\* —', p, re.M))
              if actual != count:
                  raise SystemExit(f'{kind}: expected {count}, got {actual}')
          if 'TOTAL     51' not in p:
              raise SystemExit('forward-obligation total proof missing')
          PY

          # Router links resolve; durable docs are reachable from docs/index.md.
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote

          root = Path('.').resolve()
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')

          def targets(path):
              text = path.read_text()
              for raw in link_re.findall(text):
                  target = raw.strip().split('#', 1)[0]
                  if not target or '://' in target or target.startswith(('mailto:', '#')):
                      continue
                  target = unquote(target)
                  resolved = (path.parent / target).resolve()
                  if root not in resolved.parents and resolved != root:
                      raise SystemExit(f'link escapes repo: {path} -> {target}')
                  if not resolved.exists():
                      raise SystemExit(f'broken link: {path} -> {target}')
                  if resolved.is_file() and resolved.suffix == '.md':
                      yield resolved

          start = (root / 'docs/index.md').resolve()
          seen, stack = set(), [start]
          while stack:
            p = stack.pop()
            if p in seen:
              continue
            seen.add(p)
            stack.extend(t for t in targets(p) if t not in seen)

          durable = {
              p.resolve() for p in (root / 'docs').rglob('*.md')
              if 'work' not in p.relative_to(root / 'docs').parts
          }
          missing = sorted(str(p.relative_to(root)) for p in durable - seen)
          if missing:
              raise SystemExit('unrouted durable docs: ' + ', '.join(missing))

          # Durable docs may discuss work rules but may not link to temporary work.
          for p in durable:
              for t in targets(p):
                  rel = t.relative_to(root)
                  if len(rel.parts) >= 2 and rel.parts[0:2] == ('docs', 'work'):
                      raise SystemExit(f'durable doc depends on work: {p.relative_to(root)} -> {rel}')
          PY

          # Explicit archive refs preserve unmerged PR #131/#132 byte lineages.
          pr131=$(git ls-remote --heads origin refs/heads/archive/r10-pr131-pre-reset-20260820 | awk '{print $1}')
          pr132=$(git ls-remote --heads origin refs/heads/archive/repository-governance-pr132-20260820 | awk '{print $1}')
          [[ "$pr131" == "d8b1c6d31e704e9552a14faa7764c634a29b081d" ]]
          [[ "$pr132" == "b0ebe54cb010e9837a25f7b778f3d9814d283cb8" ]]

          # PR diff whitespace proof must compare the actual base and candidate.
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          [[ "${#changed[@]}" -gt 0 ]]
          git diff --check "$BASE_SHA...$HEAD_SHA"

  record-ratification:
    needs: required
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'arch/t8e-wire-contract'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arch/t8e-wire-contract
          fetch-depth: 0
      - name: Record explicit T8-E operator ratification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once('docs/architecture/wire-contract.md', '> **Ratification:** PENDING explicit operator ratification. Program stage/status and implementation permission remain exclusively in `../roadmap.md`.', '> **Ratification:** OPERATOR-RATIFIED on 2026-08-21. Program stage/status and implementation permission remain exclusively in `../roadmap.md`.')
          replace_once('docs/decisions/index.md', '| T8-E | Executable wire contract | CANDIDATE / AWAITING OPERATOR RATIFICATION | Exact 78-operation OAS 3.0.3 application wire is durably promoted; no operation 79 without material Product/T6 reopen | `../architecture/wire-contract.md` |', '| T8-E | Executable wire contract | CURRENT / RATIFIED | Exact 78-operation OAS 3.0.3 application wire is binding; no operation 79 without material Product/T6 reopen | `../architecture/wire-contract.md` |')
          replace_once('docs/roadmap.md', 'T8-E EXECUTABLE WIRE CONTRACT         ACTIVE / AWAITING OPERATOR RATIFICATION', 'T8-E EXECUTABLE WIRE CONTRACT         CLOSED / OPERATOR-RATIFIED')
          replace_once('docs/roadmap.md', 'T8-E — Executable Wire Contract, durable candidate in PR #136 on branch `arch/t8e-wire-contract`.', 'T8-E — Executable Wire Contract is **CLOSED / OPERATOR-RATIFIED** as of 2026-08-21. PR #136 remains the unmerged integration carrier on `arch/t8e-wire-contract`; T8-F stays unopened until this ratified result is integrated into and revalidated on `main`.')
          replace_once('docs/roadmap.md', 'The reconciled T8-E contract is promoted to durable candidate authority at `docs/architecture/wire-contract.md`.', 'The reconciled T8-E contract is the ratified durable authority at `docs/architecture/wire-contract.md`.')
          replace_once('docs/roadmap.md', 'The durable candidate contains the closed 78-operation request/success/header/problem/filter/action ledger.', 'The ratified authority contains the closed 78-operation request/success/header/problem/filter/action ledger.')
          replace_once('docs/roadmap.md', 'Independent Fable review PR #137 challenged candidate `ef329534fc9d5df3254d59c3787197fefa8435e6`. Lead adjudication accepted the material promotion/presence/bounds/profile findings, restored the current T6 Problem namespace rather than reopening it, and preserved T3 configuration Audit via closed typed facts rather than deleting auditability. No material contradiction survived to justify Round 2. PR #137 is closed and unmerged; its review branch remains Evidence-only pending branch cleanup.', 'Independent Fable review PR #137 challenged candidate `ef329534fc9d5df3254d59c3787197fefa8435e6`. Lead adjudication accepted the material promotion/presence/bounds/profile findings, restored the current T6 Problem namespace rather than reopening it, and preserved T3 configuration Audit via closed typed facts rather than deleting auditability. No material contradiction survived to justify Round 2. PR #137 is closed and unmerged, and `review/t8e-fable` was deleted after preserving the review as Evidence history.')
          replace_once('docs/roadmap.md', 'Ratification has **not** occurred yet.', 'Operator ratification occurred explicitly on **2026-08-21**.')
          replace_once('docs/roadmap.md', '## Exact next action\n\n```text\ndelete review/t8e-fable after closed Evidence PR #137\n→ explicit operator ratification of T8-E\n```', '## Exact next action\n\n```text\nexplicit operator merge authorization for PR #136\n→ squash merge PR #136 into main\n→ revalidate main + required CI + durable T8-E authority\n→ delete absorbed arch/t8e-wire-contract branch when safe\n→ only then open T8-F from updated main\n```')
          replace_once('docs/roadmap.md', '| T8-E — Executable Wire Contract | Exact OpenAPI application wire, schemas, headers, problems, ETags, idempotency, pagination, upload/exact-byte contract, generated Go/TypeScript boundaries | ACTIVE; exits by operator ratification |', '| T8-E — Executable Wire Contract | Exact OpenAPI application wire, schemas, headers, problems, ETags, idempotency, pagination, upload/exact-byte contract, generated Go/TypeScript boundaries | CLOSED / OPERATOR-RATIFIED; PR #136 integration pending |')
          replace_once('docs/roadmap.md', '| T8-F — Frontend Realization | Route tree, feature/package topology, generated transport consumption, query/state behavior, read-model consumption, editor/viewer boundaries | Opens after T8-E ratification |', '| T8-F — Frontend Realization | Route tree, feature/package topology, generated transport consumption, query/state behavior, read-model consumption, editor/viewer boundaries | READY but NOT OPEN; opens only after ratified T8-E is merged/revalidated on main |')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/wire-contract.md docs/decisions/index.md docs/roadmap.md
          git commit -m 'docs(architecture): ratify T8-E executable wire contract'
          git push origin HEAD:arch/t8e-wire-contract
