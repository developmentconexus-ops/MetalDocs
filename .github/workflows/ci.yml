name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify objective repository properties
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          for path in \
            AGENTS.md \
            docs/index.md \
            docs/roadmap.md \
            docs/development/engineering-method.md \
            docs/development/frontend-product-experience-planning-method.md \
            docs/development/engineering-rules.md; do
            test -f "$path" || { echo "::error file=$path::required operating file missing"; exit 1; }
          done

          diff_check=$(git diff --check "$BASE_SHA...$HEAD_SHA" 2>&1 || true)
          conflict_issues=$(printf '%s\n' "$diff_check" | grep -F 'leftover conflict marker' || true)
          if [[ -n "$conflict_issues" ]]; then
            echo "::error::leftover merge-conflict marker in PR diff"
            printf '%s\n' "$conflict_issues"
            exit 1
          fi

          whitespace_issues=$(printf '%s\n' "$diff_check" | grep -v -F 'leftover conflict marker' || true)
          if [[ -n "$whitespace_issues" ]]; then
            echo "::warning::non-blocking whitespace findings in PR diff"
            printf '%s\n' "$whitespace_issues"
          fi

          if grep -Eq '^IMPLEMENTATION[[:space:]]+BLOCKED$|Product implementation.*BLOCKED|IMPLEMENTATION[[:space:]]+\*\*BLOCKED' docs/roadmap.md; then
            while IFS= read -r path; do
              case "$path" in
                apps/*|src/*|cmd/*|internal/*|backend/*|frontend/*|migrations/*|openapi/*|contracts/*|deploy/*|Dockerfile|docker-compose*|go.mod|go.sum|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock)
                  echo "::error file=$path::Product implementation is blocked by docs/roadmap.md"
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          fi

          if [[ "$PR_DRAFT" != "true" ]] && git ls-files 'docs/work/**' | grep -q .; then
            echo "::error::temporary docs/work material must be absent from a merge candidate"
            exit 1
          fi

          echo 'required: PASS'
