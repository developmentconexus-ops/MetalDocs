name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify Repository Standard v1 envelope
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # Review branches are isolated Evidence channels and are deliberately
          # non-mergeable. They must target the current candidate branch, not
          # main; the candidate base must be an ancestor of the review head;
          # and the only delta may be the temporary Fable dialogue.
          if [[ "$HEAD_REF" == review/* ]]; then
            if [[ "$BASE_REF" == "main" ]]; then
              echo "::error::review branches must target their candidate branch, never main"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
              echo "::error::review branch does not contain the current candidate base"
              exit 1
            fi
            mapfile -t changed < <(git diff --name-only "$BASE_SHA..$HEAD_SHA")
            [[ "${#changed[@]}" -eq 1 ]]
            [[ "${changed[0]}" == "docs/work/current/ai-dialog.md" ]]
            git diff --check "$BASE_SHA..$HEAD_SHA"
            echo "::error::review branches are Evidence channels and must be closed/deleted, never merged"
            exit 1
          fi

          # Main-targeting architecture-first PRs admit only the accepted live surfaces.
          [[ "$BASE_REF" == "main" ]]
          allowed_path() {
            [[ "$1" =~ ^(AGENTS\.md|CLAUDE\.md|README\.md|\.gitignore|\.gitattributes|\.github/.+\.ya?ml|docs/.+\.md)$ ]]
          }

          allowed_path "docs/roadmap.md"
          allowed_path ".github/workflows/ci.yml"
          if allowed_path "src/main.go" || allowed_path "openapi/app.yaml" || allowed_path "migrations/001.sql"; then
            echo "::error::architecture-only allowlist accepted implementation path"
            exit 1
          fi

          invalid=0
          while IFS= read -r path; do
            if ! allowed_path "$path"; then
              echo "::error file=$path::tracked path is outside the architecture-first allowlist"
              invalid=1
            fi
          done < <(git ls-files)
          [[ "$invalid" -eq 0 ]]

          # Required bootstrap and unique routing surfaces.
          test -f AGENTS.md
          test -f docs/index.md
          test -f docs/roadmap.md
          test ! -e docs/status.md
          test ! -e docs/decisions/stage-program.md

          bootstrap_bytes=$(( $(wc -c < AGENTS.md) + $(wc -c < docs/index.md) + $(wc -c < docs/roadmap.md) ))
          echo "bootstrap_bytes=$bootstrap_bytes"
          [[ "$bootstrap_bytes" -le 20480 ]]

          # README/routers cannot become parallel mutable roadmaps.
          if grep -Eiq 'PR #[0-9]+|Current (posture|stage|gate)|Exact next action|T8-[A-Z].*(ACTIVE|PAUSED|CLOSED)|IMPLEMENTATION[[:space:]]+(BLOCKED|ALLOWED)' README.md AGENTS.md docs/index.md; then
            echo "::error::mutable stage/status leaked outside docs/roadmap.md"
            exit 1
          fi

          # Merge candidates/main contain no temporary work or permanent review trees.
          if [[ "$PR_DRAFT" != "true" ]] && git ls-files 'docs/work/**' | grep -q .; then
            echo "::error::docs/work must be absent from a merge candidate"
            exit 1
          fi
          if git ls-files | grep -Eqi '(^|/)(docs/superpowers|old|archive|tombstones?|reviews?|rounds?|handoffs?)(/|$)|ai-dialog'; then
            echo "::error::permanent old/archive/review/handoff surface detected"
            exit 1
          fi

          # Required Product/R10 authority set survives the reset.
          for path in \
            docs/product/contract.md \
            docs/product/alignment.md \
            docs/product/journeys.md \
            docs/architecture/ownership.md \
            docs/architecture/domain-model.md \
            docs/architecture/lifecycle.md \
            docs/architecture/authorization-and-audit.md \
            docs/architecture/content-integrity.md \
            docs/architecture/async-and-search.md \
            docs/architecture/technical-baseline.md \
            docs/architecture/backend.md \
            docs/architecture/interfaces.md \
            docs/architecture/persistence.md \
            docs/decisions/api-operation-census.md \
            docs/decisions/forward-obligations.md \
            docs/reference/t8e-checkpoint.md; do
            test -f "$path"
          done

          # Decision forward-obligation census is mechanically closed.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/decisions/forward-obligations.md').read_text()
          expected = {'PRESERVE': 21, 'REOPEN': 4, 'DEFERRED': 27}
          for kind, count in expected.items():
              actual = len(re.findall(rf'^- \*\*[^*\n]+ — {kind}\*\* —', p, re.M))
              if actual != count:
                  raise SystemExit(f'{kind}: expected {count}, got {actual}')
          if 'TOTAL     52' not in p:
              raise SystemExit('forward-obligation total proof missing')
          PY

          # Router links resolve; durable docs are reachable from docs/index.md.
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote

          root = Path('.').resolve()
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')

          def targets(path):
              text = path.read_text()
              for raw in link_re.findall(text):
                  target = raw.strip().split('#', 1)[0]
                  if not target or '://' in target or target.startswith(('mailto:', '#')):
                      continue
                  target = unquote(target)
                  resolved = (path.parent / target).resolve()
                  if root not in resolved.parents and resolved != root:
                      raise SystemExit(f'link escapes repo: {path} -> {target}')
                  if not resolved.exists():
                      raise SystemExit(f'broken link: {path} -> {target}')
                  if resolved.is_file() and resolved.suffix == '.md':
                      yield resolved

          start = (root / 'docs/index.md').resolve()
          seen, stack = set(), [start]
          while stack:
              p = stack.pop()
              if p in seen:
                  continue
              seen.add(p)
              stack.extend(t for t in targets(p) if t not in seen)

          durable = {
              p.resolve() for p in (root / 'docs').rglob('*.md')
              if 'work' not in p.relative_to(root / 'docs').parts
          }
          missing = sorted(str(p.relative_to(root)) for p in durable - seen)
          if missing:
              raise SystemExit('unrouted durable docs: ' + ', '.join(missing))

          # Durable docs may discuss work rules but may not link to temporary work.
          for p in durable:
              for t in targets(p):
                  rel = t.relative_to(root)
                  if len(rel.parts) >= 2 and rel.parts[0:2] == ('docs', 'work'):
                      raise SystemExit(f'durable doc depends on work: {p.relative_to(root)} -> {rel}')
          PY

          # Explicit archive refs preserve unmerged PR #131/#132 byte lineages.
          pr131=$(git ls-remote --heads origin refs/heads/archive/r10-pr131-pre-reset-20260820 | awk '{print $1}')
          pr132=$(git ls-remote --heads origin refs/heads/archive/repository-governance-pr132-20260820 | awk '{print $1}')
          [[ "$pr131" == "d8b1c6d31e704e9552a14faa7764c634a29b081d" ]]
          [[ "$pr132" == "b0ebe54cb010e9837a25f7b778f3d9814d283cb8" ]]

          # PR diff whitespace proof must compare the actual base and candidate.
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          [[ "${#changed[@]}" -gt 0 ]]
          git diff --check "$BASE_SHA...$HEAD_SHA"

  record-coherence:
    needs: required
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Record verified T8-E Lead convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/work/current/proposal.md')
          s=p.read_text()
          old='''# 11. Remaining closure gate

The measurement, generated-boundary feasibility, provider presign feasibility, strict-request validator split, 78-row ledger-census fixture obligations and all evidence-triggered upstream reconciliations are closed at candidate level.

Remaining Lead gate:

```text
A. rerun whole-candidate Structural Inversion / YAGNI / overengineering / global-coherence exact-delta check
B. revalidate main/base + exact candidate HEAD + intended authority/work diff + required CI
C. only if A→B converge, create review/t8e-fable from that exact candidate HEAD
D. independent Fable challenge
E. Lead adjudication of Fable evidence
F. explicit operator ratification
```

Until A→B converge:

```text
T8-E ACTIVE
T8-F NOT OPEN
implementation BLOCKED
Fable NOT STARTED
```'''
          new='''# 11. Remaining closure gate

The measurement, generated-boundary feasibility, provider presign feasibility, strict-request validator split, 78-row ledger-census fixture obligations and all evidence-triggered upstream reconciliations are closed at candidate level.

## 11.1 Final Lead Global Coherence — PASS

Fresh executable proof on 2026-08-21 established:

```text
ledger_rows                         78
operation_ids                       78 unique
method+path                         78 unique
Idempotency-Key creations           exact 10
ETag read/mutation domains          13 / 13
exact-byte resources                exact 4
bounded findings 8.4–8.6            RESOLVED
authority parity                    PASS
global_coherence                    PASS
```

Structural Inversion / YAGNI result remains subtractive: no Product operation, owner, lifecycle, generic workflow, second validation framework, generic async bus, duplicate PDF rendition work, second CSRF credential surface or implementation code was introduced.

Remaining gate:

```text
A. remove the temporary proof harness and revalidate main/base + exact clean candidate HEAD + intended 8-file authority/work diff + required CI
B. only if A converges, create review/t8e-fable from that exact candidate HEAD
C. independent Fable challenge
D. Lead adjudication of Fable evidence
E. explicit operator ratification
```

Until A converges:

```text
T8-E ACTIVE
T8-F NOT OPEN
implementation BLOCKED
Fable NOT STARTED
```'''
          if s.count(old)!=1: raise SystemExit(f'proposal gate anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('docs/roadmap.md')
          s=p.read_text()
          old='''The correction remained subtractive/precision-only: no Product operation, owner, lifecycle state, permission, table family, generic worker, second cookie or new API was added.

## Exact next action

```text
rerun exact whole-candidate Structural Inversion / YAGNI / overengineering / global-coherence delta
→ revalidate main/base + exact candidate HEAD + intended authority/work diff + required CI
→ if and only if the Lead delta converges, create isolated review/t8e-fable from exact candidate HEAD
→ independent Fable challenge
→ Lead adjudication
→ explicit operator ratification
```'''
          new='''The correction remained subtractive/precision-only: no Product operation, owner, lifecycle state, permission, table family, generic worker, second cookie or new API was added.

The final Lead whole-candidate Structural Inversion / YAGNI / overengineering / global-coherence proof passed on 2026-08-21: 78 unique operations, exact 10 durable-idempotent creations, 13 ETag read/mutation domains, exact four byte resources, §§8.4–8.6 resolved and authority parity PASS.

## Exact next action

```text
remove the temporary Global Coherence proof harness
→ revalidate main/base + exact clean candidate HEAD + intended 8-file authority/work diff + required CI
→ if and only if that clean-head revalidation converges, create isolated review/t8e-fable from exact candidate HEAD
→ independent Fable challenge
→ Lead adjudication
→ explicit operator ratification
```'''
          if s.count(old)!=1: raise SystemExit(f'roadmap gate anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/work/current/proposal.md docs/roadmap.md
          git commit -m 'docs(architecture): record T8-E Lead global coherence pass'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
