name: docx-renderer CI

on:
  pull_request:
    paths:
      - 'apps/docx-renderer/**'
      - 'packages/**'
      - 'internal/platform/config/feature_flags*.go'
      - 'internal/platform/featureflags/**'
      - 'internal/modules/templates/**'
      - 'frontend/apps/web/src/features/featureFlags.ts'
      - 'tests/docx_v2/**'
      - 'scripts/docx-v2-*'
      - '.github/workflows/ci.yml'

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:docx-v2
      - run: pnpm run test:docx-v2
      - run: pnpm run build:docx-v2
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 1.25.x, cache: true }
      - run: go build ./...
      - run: go test ./internal/platform/config/... ./internal/platform/featureflags/... ./internal/platform/servicebus/... ./internal/platform/ratelimit/... ./internal/platform/objectstore/... ./internal/modules/templates/... ./tests/docx_v2/...
