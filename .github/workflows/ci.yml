name: docx-renderer CI

on:
  pull_request:
    paths:
      - 'apps/docx-renderer/**'
      - 'packages/**'
      - 'internal/platform/config/feature_flags*.go'
      - 'internal/platform/featureflags/**'
      - 'internal/modules/templates/**'
      - 'frontend/apps/web/src/features/featureFlags.ts'
      - 'tests/docx_v2/**'
      - 'scripts/docx-v2-*'
      - '.github/workflows/ci.yml'

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: pnpm install --frozen-lockfile
      # Check set for this job lives in tools/verify/registry.go
      # (docx-v2-typecheck, docx-v2-test) — see CIJob: "ci.yml:node".
      - run: go run ./tools/verify --only=docx-v2-typecheck,docx-v2-test
      - run: pnpm run build:docx-v2
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go build ./...
      - run: go test ./internal/platform/config/... ./internal/platform/featureflags/... ./internal/platform/servicebus/... ./internal/platform/ratelimit/... ./internal/platform/objectstore/... ./internal/modules/templates/... ./tests/docx_v2/...
