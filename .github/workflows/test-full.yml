name: Test Full Gate (merge to main)
# A1 item 4 — the full integration suite runs PRE-MERGE, not only after.
# Push-only made this a post-mortem: it told you main was broken, it never
# stopped main from breaking. The fast tier (`verify --profile=fast`, ~1 min)
# is what keeps the inner loop short; this is the slow tier and it gates.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metaldocs
          POSTGRES_PASSWORD: metaldocs
          POSTGRES_DB: metaldocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Check set for this job lives in tools/verify/registry.go (go-test-integration)
      # — see CIJob: "test-full.yml:full".
      - name: verify (go-test-integration)
        env:
          METALDOCS_DATABASE_URL: postgres://metaldocs:metaldocs@localhost:5432/metaldocs?sslmode=disable
        run: go run ./tools/verify --only=go-test-integration
        timeout-minutes: 20
