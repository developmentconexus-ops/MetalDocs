name: T8-E Bounded Reconcile

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply approved bounded corrections
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  n = s.count(old)
                  if n != 1:
                      raise SystemExit(f'{path}: anchor mismatch expected=1 got={n}: {old[:160]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('docs/architecture/content-integrity.md', [
          (
          '> **Post-T5 Fable bounded amendment:** 2026-08-18 — restore security non-resurrection + admission-claim GC liveness  \n> **Repository:**',
          '> **Post-T5 Fable bounded amendment:** 2026-08-18 — restore security non-resurrection + admission-claim GC liveness  \n> **T8-E bounded correction:** 2026-08-21 — already-PDF required rendition reuses admitted bytes; rendering only when transformation is required  \n> **Repository:**'
          ),
          (
          'Required OfficialRendition uses the same pattern: rendering happens outside the semantic transaction; final admission revalidates exact READY content and creates the semantic Rendition fact only if the exact Submission remains eligible under T2/T5.',
          '''Required OfficialRendition has exactly two Launch realization paths:\n\n```text\nsubmitted source already PDF + required format PDF\n  -> revalidate the exact already-admitted Submission handle + descriptor\n  -> create OfficialRendition semantic fact over that same handle + descriptor\n  -> no provider copy\n  -> no renderer execution\n  -> no durable rendition intent\n\nsubmitted source DOCX + required format PDF\n  -> render outside the semantic transaction\n  -> admit/verify the produced READY PDF through T4\n  -> final admission revalidates exact READY content and Submission eligibility\n  -> create OfficialRendition semantic fact\n```\n\nThe first path is not a semantic downgrade: OfficialRendition still exists as the required immutable fact, but byte-for-byte PDF duplication/transformation is removed because it proves no additional property. Target proof must show same-PDF rendition preserves the exact Submission handle/descriptor and invokes neither `CopyToNewHandle` nor renderer/durable-intent machinery.''' 
          )
