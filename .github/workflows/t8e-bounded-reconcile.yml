          '''When a frozen Submission policy requires an OfficialRendition, execution is conditional on whether transformation is actually needed.\n\nAlready-PDF path:\n\n```text\nload exact eligible Submission whose source format is PDF\n→ open local transaction\n→ reload current eligibility\n→ prove required PDF rendition still absent/required\n→ revalidate the exact Submission handle + descriptor\n→ create OfficialRendition over that same handle + descriptor\n→ required T3 Audit\n→ if human gate also satisfied, execute T2 system Release\n→ COMMIT\n```\n\nNo renderer, provider copy or durable job participates.\n\nTransformation path (current Launch: DOCX→PDF):\n\n```text\nload Submission + requirement\n→ load exact T4 source bytes\n→ execute renderer outside semantic transaction\n→ admit/verify READY output through T4\n→ open local transaction\n→ reload current eligibility\n→ prove exact Submission remains the current eligible pre-Release candidate\n→ prove required rendition still absent/required\n→ revalidate exact READY descriptor + binding\n→ create OfficialRendition + required T3 Audit\n→ if human gate also satisfied, execute T2 system Release\n→ COMMIT\n```'''
          ),
          (
          'conditional rendition enqueue rolls back with Submission transaction rollback',
          '''conditional rendition enqueue rolls back with Submission transaction rollback\nalready-PDF + required PDF creates OfficialRendition over the same admitted handle/descriptor with zero renderer/copy/job\nDOCX→required PDF still commits the rendition intent atomically when renderer work is activated'''
          )
          ])

          patch('docs/architecture/interfaces.md', [
          (
          '> **Ratified:** 2026-08-19  \n> **Repository:**',
          '> **Ratified:** 2026-08-19  \n> **T8-E bounded correction:** 2026-08-21 — same-PDF rendition emits no renderer intent + session resolve exposes per-session CSRF token material  \n> **Repository:**'
          ),
          (
          '''Authentication public capabilities cover browser login/callback preflight, binding resolution/create/replace, session issue/resolve/revoke and current provider-subject search required by T6.\n\nProvider/network exchange occurs outside the local semantic transaction; binding/session state mutations occur in caller-provided Scope.\n\nSession issuance requires protected current enabled-User truth from Organization.''',
          '''Authentication public capabilities cover browser login/callback preflight, binding resolution/create/replace, session issue/resolve/revoke and current provider-subject search required by T6.\n\nSession resolution returns the current authenticated User identity plus the opaque **per-session CSRF token material** required by T6 `GET /api/v1/session` and unsafe-request validation. The token is session-bound server state, not a second authentication credential: it grants nothing without the valid HttpOnly ApplicationSession cookie. Authentication owns generation/comparison semantics; exact persistence belongs T8-D.\n\nProvider/network exchange occurs outside the local semantic transaction; binding/session state mutations occur in caller-provided Scope.\n\nSession issuance requires protected current enabled-User truth from Organization and creates fresh per-session CSRF token material.'''
          ),
