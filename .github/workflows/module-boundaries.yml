name: module-boundaries

on:
  pull_request:
    branches: [ main ]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }

      # Check set for this job lives in tools/verify/registry.go
      # (module-boundaries, test-discipline) — see CIJob: "module-boundaries.yml:conformance".
      - name: verify (module-boundaries, test-discipline)
        run: go run ./tools/verify --only=module-boundaries,test-discipline
