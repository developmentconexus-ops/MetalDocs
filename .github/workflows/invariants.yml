name: CI Invariants

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cilint:
    name: cilint — custom Go linters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run cilint
        run: go run ./tools/cilint --sarif ./... > sarif-cilint.json 2>&1 || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        # Advisory telemetry only — the real gate is the "Fail on violations"
        # step below. Never fail the job because the SARIF upload lacked the
        # security-events token scope (e.g. fork PRs, restricted integrations).
        continue-on-error: true
        with:
          sarif_file: sarif-cilint.json
      # Check set for this job lives in tools/verify/registry.go (cilint) —
      # see CIJob: "invariants.yml:cilint".
      - name: Fail on violations
        run: go run ./tools/verify --only=cilint

  # NOTE: the former `openapi-drift` job was removed — it regenerated approval
  # frontend types from api/openapi/spec2.yaml (deleted with the rest of the
  # parallel v2 contract surface in Wave 1 item 1.3, F-03/REQ-API-2). Frontend
  # type drift is covered by api-contract.yml's `frontend-codegen-drift` job
  # (npm run gen:api -> src/lib/api-types).
  #
  # NOTE: the former `capability-catalog-hash` job was removed in the same
  # change — it pinned the SHA-256 of sql/seeds/capabilities_v2.sql, a file
  # that never existed, so the gate always exited 0 ("Catalog file not found")
  # and enforced nothing. The real REQ-AUTHZ-5 code↔registry binding guard is
  # api-lint's capability registry rules (scripts/api-lint/registry_rules.go,
  # ADR 0022).

  migration-gapless:
    name: Migration monotonicity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git log --diff-filter
      - name: Check gapless sequence + no historical edits
        run: |
          set -euo pipefail
          MIGRATION_DIR="db/migrations"

          # After the 2026-07-29 fold (migrations 0257-0315 squashed into
          # db/baseline, files moved to
          # archive/migrations/post-baseline-2026-07-fold/) the directory holds
          # only its README. Under `set -euo pipefail` an unmatched `ls` glob
          # would abort the step, so the empty case is guarded explicitly: skip
          # the gapless sequence check (there is no sequence), but still run the
          # historical-edit check below — that one is a git-history question,
          # not a filesystem one, and stays meaningful with an empty directory.
          shopt -s nullglob
          files=("$MIGRATION_DIR"/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "✅ No forward migrations (post-fold baseline) — gapless check skipped"
          else
            # Discover min and max from filesystem (never hardcoded). Match only
            # the leading 4-digit prefix of each basename — `grep -oE '[0-9]+'` on
            # the full path also captured digits inside descriptions (e.g. phase8),
            # making MIN collapse to 2.
            nums=$(printf '%s\n' "${files[@]}" \
              | xargs -r -n1 basename | grep -oE '^[0-9]{4}' | sort -n)
            MIN=$(echo "$nums" | head -1)
            MAX=$(echo "$nums" | tail -1)

            echo "Checking migrations $MIN..$MAX for gapless sequence..."
            for n in $(seq "$MIN" "$MAX"); do
              padded=$(printf "%04d" "$n")
              hits=("$MIGRATION_DIR"/${padded}_*.sql)
              if [ ${#hits[@]} -eq 0 ]; then
                echo "❌ Gap: migration $padded missing"
                exit 1
              fi
            done

            echo "✅ Gapless $MIN..$MAX"
          fi

          # Check no historical migrations were modified after merge
          # (only check files that exist in main already). The pathspec is fully
          # quoted so GIT expands it — with nullglob an unquoted `*.sql` would
          # vanish from the argv and turn this into a repo-wide query.
          BASE=${GITHUB_BASE_REF:-main}
          MODIFIED=$(git log --diff-filter=M --follow --name-only \
            "origin/$BASE...HEAD" -- "$MIGRATION_DIR/*.sql" 2>/dev/null | grep '\.sql$' || true)

          if [ -n "$MODIFIED" ]; then
            echo "❌ Historical migrations modified: $MODIFIED"
            exit 1
          fi
          echo "✅ No historical migration edits"

  staticcheck:
    name: staticcheck + go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Check set for this job lives in tools/verify/registry.go (go-vet,
      # go-vet-integration, staticcheck) — see CIJob: "invariants.yml:staticcheck".
      # The go-vet-integration and staticcheck-pin rationale that used to live
      # here as comments now lives next to those registry entries.
      - name: verify (go-vet, go-vet-integration, staticcheck)
        run: go run ./tools/verify --only=go-vet,go-vet-integration,staticcheck
