name: lint

# Eigenpal Anti-Corruption Layer boundary guard (ADR 0046 §Enforcement).
# Fails the build if @eigenpal/* is imported outside the two ACL walls
# (packages/eigenpal-adapter, packages/editor-ui).

# A1 item 6 — no `paths:` filter, deliberately. These jobs are required
# status checks, and a required check that never reports leaves the PR
# permanently pending. Diff-scoping lives in tools/verify/registry.go
# (`Paths` per check, `changed` profile) instead, where the job still
# reports. See the same note in api-contract.yml for the full rationale.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: pnpm install --frozen-lockfile
      # Check set for this job lives in tools/verify/registry.go (fe-eslint)
      # — see CIJob: "lint.yml:eslint".
      - run: go run ./tools/verify --only=fe-eslint

  # FE-18 — forbids new raw hex color literals in frontend/apps/web
  # module.css files; tokens.css is the source of truth for colors.
  # Pre-existing offenders are grandfathered in a shrink-only allowlist.
  css-token-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Check set for this job lives in tools/verify/registry.go
      # (css-token-discipline) — see CIJob: "lint.yml:css-token-discipline".
      - run: go run ./tools/verify --only=css-token-discipline

  # ADR 0046 §Enforcement, second half. The eslint job above guards the
  # eigenpal IMPORT boundary; this guards the SELECTOR-PIN boundary — the
  # `:global(` and `!important` counts in EditorChrome.module.css that couple
  # our CSS to eigenpal's internal DOM, pinned against the adapter's declared
  # version. Drift on either side means the manual DOM smoke checklist must be
  # re-run before merge. The script existed and was never wired; ADR 0046 has
  # been half-enforced since it was ratified.
  eigenpal-selector-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # Check set for this job lives in tools/verify/registry.go
      # (eigenpal-selector-pin) — see CIJob: "lint.yml:eigenpal-selector-pin".
      - run: go run ./tools/verify --only=eigenpal-selector-pin
