name: T8-E S3 Presign Probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  s3-presign-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove exact-length and create-only headers are signed
        shell: bash
        env:
          GO_B64: 
        run: |
          set -euxo pipefail
          work="$(mktemp -d)"
          cd "$work"
          printf '%s' "$GO_B64" | base64 -d > main.go
          go mod init presignprobe
          go get github.com/aws/aws-sdk-go-v2/service/s3@v1.106.2
          go run .
