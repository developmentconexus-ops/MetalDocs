name: Perf Benchmarks

on:
  pull_request:
    paths:
      - 'internal/modules/approval/application/**'
      - 'api/handlers/approval/**'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full suite (not reduced)'
        type: boolean
        default: false

jobs:
  perf-reduced:
    name: Perf suite (reduced — PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      REDUCED: '1'
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start backend
        run: |
          # A1: this loop used to end with `|| sleep 2` and no exit, so when the
          # API never came up the step still succeeded and k6 ran against a dead
          # port. That produced a full percentile table computed over 300 failed
          # requests and 0 bytes received — numbers that look like a measurement
          # and are not one. A benchmark that cannot detect an absent target is
          # not a benchmark. Fail at the cause instead.
          #
          # KNOWN RED: this job cannot pass today. It has no `services: postgres`,
          # runs no migrations, and reads DATABASE_URL from secrets.PERF_DATABASE_URL,
          # which this repository does not define. Standing up that stack is the
          # perf axis's work; A1's job is to stop the failure from masquerading as
          # a passing measurement. Tracked in the A1 ledger as a recorded defer.
          set -euo pipefail
          go run ./apps/api/cmd/metaldocs-api &
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/api/v1/health/live"; then
              echo "API is live after $i attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: API did not answer $BASE_URL/api/v1/health/live within 60s; refusing to benchmark a dead target"
          exit 1
        env:
          DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
          METALDOCS_E2E: '1'
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Run submit benchmark (reduced)
        run: k6 run tools/perfbench/submit.js
      - name: Run signoff benchmark (reduced)
        run: k6 run tools/perfbench/signoff.js
      - name: Run publish benchmark (reduced)
        run: k6 run tools/perfbench/publish.js

  perf-full:
    name: Perf suite (full — main/manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start backend
        run: |
          # A1: this loop used to end with `|| sleep 2` and no exit, so when the
          # API never came up the step still succeeded and k6 ran against a dead
          # port. That produced a full percentile table computed over 300 failed
          # requests and 0 bytes received — numbers that look like a measurement
          # and are not one. A benchmark that cannot detect an absent target is
          # not a benchmark. Fail at the cause instead.
          #
          # KNOWN RED: this job cannot pass today. It has no `services: postgres`,
          # runs no migrations, and reads DATABASE_URL from secrets.PERF_DATABASE_URL,
          # which this repository does not define. Standing up that stack is the
          # perf axis's work; A1's job is to stop the failure from masquerading as
          # a passing measurement. Tracked in the A1 ledger as a recorded defer.
          set -euo pipefail
          go run ./apps/api/cmd/metaldocs-api &
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/api/v1/health/live"; then
              echo "API is live after $i attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: API did not answer $BASE_URL/api/v1/health/live within 60s; refusing to benchmark a dead target"
          exit 1
        env:
          DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Run full perf suite
        run: |
          k6 run tools/perfbench/submit.js
          k6 run tools/perfbench/signoff.js
          k6 run tools/perfbench/publish.js
          k6 run tools/perfbench/scheduler_tick.js
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: k6-results/
          retention-days: 30
