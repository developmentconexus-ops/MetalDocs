components:
  securitySchemes:
    # Referenced by `security: [- sessionCookie: []]` across the spec. Declared
    # here so codegen emits a defined scope-key type (oapi-codegen v2.7.0 errors
    # out on an undefined scheme). Authentication is actually enforced by the
    # application's session middleware (wiki/concepts/authz-tiers.md); this entry
    # documents the requirement for OpenAPI consumers and the generated server.
    sessionCookie:
      type: apiKey
      in: cookie
      name: metaldocs_session
      description: Session cookie issued by POST /api/v1/auth/login.
  responses:
    BadRequest:
      description: Requisicao invalida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Nao autenticado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Sem permissao
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso nao encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito de estado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Entidade nao processavel
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Pre-condicao falhou (ETag/lock version desatualizado)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Pre-condicao obrigatoria ausente (header If-Match nao enviado)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Recurso expirado ou nao mais disponivel
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite de requisicoes excedido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Falha no servico upstream
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AuthLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
    CurrentUser:
      type: object
      required: [user_id, tenant_id, tenant_name, username, display_name, must_change_password, roles, capabilities]
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        username:
          type: string
        email:
          type: string
        display_name:
          type: string
        must_change_password:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        capabilities:
          type: array
          description: |
            Capability codes the actor holds in the active tenant. UX hint only —
            backend remains the sole authorization boundary (see
            wiki/concepts/authz-tiers.md). May be empty when no capability
            provider is wired (in-memory dev modes).
          items:
            type: string
    AuthLoginResponse:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        expires_at:
          type: string
          format: date-time
    HealthCheckItem:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
        mode:
          type: string
        provider:
          type: string
        enabled:
          type: boolean
        detail:
          type: string
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckItem'
    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
