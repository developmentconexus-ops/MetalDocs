      operationId: updateTemplateSchema
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeholder_schema, metadata_schema, expected_lock_version]
              additionalProperties: false
              properties:
                placeholder_schema:
                  type: array
                  items: { type: object, additionalProperties: true }
                metadata_schema:
                  type: object
                  additionalProperties: true
                expected_lock_version:
                  type: integer
                  format: int32
                  minimum: 0
                  description: >
                    Last-seen `VersionDTO.lock_version`. Server compare-and-swaps;
                    on mismatch returns HTTP 412 with code `stale_lock_version`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [version]
                    properties:
                      version: { $ref: '#/components/schemas/VersionDTO' }
        '400': { description: invalid_request }
        '409': { description: invalid_state_transition }
        '412': { description: stale_lock_version }
        '422': { description: placeholder_validation_error }
