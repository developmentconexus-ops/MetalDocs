  /api/v1/controlled-documents:
    get:
      summary: List controlled documents
      tags: [controlled-documents]
      operationId: listControlledDocuments
      parameters:
        - name: profileCode
          in: query
          schema: { type: string }
        - name: processAreaCode
          in: query
          schema: { type: string }
        - name: departmentCode
          in: query
          schema: { type: string }
        - name: ownerUserId
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, obsolete, superseded] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlledDocument'
        '400': { description: validation_error }
        '401': { description: unauthenticated }
        '403': { description: forbidden }
    post:
      summary: Atomically create controlled document and initial revision
      tags: [controlled-documents]
      operationId: atomicCreateControlledDocument
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAtomicRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtomicCreateResponse'
        '400': { description: validation_error }
        '401': { description: unauthenticated }
        '409':
          description: code_taken or domain conflict, including template artifact missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422': { description: template_invalid }

