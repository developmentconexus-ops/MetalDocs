  /approval/inbox:
    get:
      summary: List approval inbox
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Bounded per-actor inbox of pending sign-offs; offset/limit paging with a total count, no cursor envelope.'
      tags: [approval]
      operationId: listApprovalInbox
      parameters:
        - { name: area_code, in: query, required: false, schema: { type: string }, description: 'Filter to a single process area.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: stage_kind, in: query, required: false, schema: { type: string, enum: [review, approval] }, description: 'F8 (spec.md §4/W4): filter to stages of this kind only.' }
        - { name: due_before, in: query, required: false, schema: { type: string, format: date-time }, description: 'F8 (spec.md §4/W4): filter to stages whose due_at is non-null and <= this RFC3339 UTC timestamp.' }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [oversee] }
