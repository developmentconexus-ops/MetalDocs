components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    AuthLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
    CurrentUser:
      type: object
      required: [userId, tenantId, tenantName, username, displayName, mustChangePassword, roles]
      properties:
        userId:
          type: string
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            type: string
            enum: [system_admin, approver, author, editor, viewer]
    AuthLoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        expiresAt:
          type: string
          format: date-time
    HealthCheckItem:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
        mode:
          type: string
        provider:
          type: string
        enabled:
          type: boolean
        detail:
          type: string
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckItem'
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: Obrigatoria para troca de senha em sessao normal; opcional no fluxo de primeiro acesso com troca obrigatoria.
        newPassword:
          type: string
    ChangePasswordResponse:
      type: object
      required: [changed, user]
      properties:
        changed:
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUser'
    ManagedUserItem:
      type: object
      required: [userId, username, displayName, isActive, mustChangePassword, failedLoginAttempts, roles, createdAt, updatedAt]
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        failedLoginAttempts:
          type: integer
        lockedUntil:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
            enum: [system_admin, approver, author, editor, viewer]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminOnlineUserItem:
      type: object
      required: [userId, username, displayName, lastSeenAt]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        lastSeenAt:
          type: string
          format: date-time
    AdminOverviewResponse:
      type: object
      required: [users, onlineUsers, recentActivities]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/ManagedUserItem'
        onlineUsers:
          type: array
          items:
            $ref: '#/components/schemas/AdminOnlineUserItem'
        recentActivities:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventItem'
    ListManagedUsersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedUserItem'
    CreateManagedUserRequest:
      type: object
      required: [username, displayName, password, roles]
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        password:
          type: string
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [system_admin, approver, author, editor, viewer]
    CreateManagedUserResponse:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
    UpdateManagedUserRequest:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        newPassword:
          type: string
        mustChangePassword:
          type: boolean
    UpdateManagedUserResponse:
      type: object
      required: [userId, updated]
      properties:
        userId:
          type: string
        updated:
          type: boolean
    ResetManagedUserPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
    ResetManagedUserPasswordResponse:
      type: object
      required: [userId, reset, mustChangePassword]
      properties:
        userId:
          type: string
        reset:
          type: boolean
        mustChangePassword:
          type: boolean
    UnlockManagedUserResponse:
      type: object
      required: [userId, unlocked]
      properties:
        userId:
          type: string
        unlocked:
          type: boolean
    ReplaceUserRolesRequest:
      type: object
      required: [displayName, roles]
      properties:
        displayName:
          type: string
        assignedBy:
          type: string
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [system_admin, approver, author, editor, viewer]
    ReplaceUserRolesResponse:
