        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Sem permissao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    post:
      summary: Cria ou atualiza uma versao de schema de metadata de um profile
      parameters:
        - name: profileCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentProfileSchemaUpsertRequest'
      responses:
        '200':
          description: Schema versionado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledDocumentMutationResponse'
        '400':
          description: Requisicao invalida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: Sem permissao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /document-profiles/{profileCode}/schema/{version}/activate:
    put:
      summary: Ativa uma versao de schema de metadata para o profile
      parameters:
        - name: profileCode
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Versao de schema ativada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlledDocumentMutationResponse'
        '400':
          description: Requisicao invalida
          content:
            application/json:
