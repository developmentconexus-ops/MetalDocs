      required: [id, content_hash]
      properties:
        id: { type: string, format: uuid }
        content_hash: { type: string }

    CreateAtomicRequest:
      type: object
      required: [profile_code, process_area_code, title, owner_user_id, document_name, visibility]
      properties:
        profile_code: { type: string, minLength: 1 }
        process_area_code: { type: string, minLength: 1 }
        department_code: { type: string }
        title: { type: string, minLength: 1 }
        owner_user_id: { type: string, minLength: 1 }
        document_name: { type: string, minLength: 1 }
        visibility:
          $ref: '#/components/schemas/ControlledDocumentVisibility'
        template_version_id: { type: string, format: uuid }
        form_data: { type: object, additionalProperties: true }
        manual_code: { type: string }
        manual_code_reason: { type: string }
        override_template_version_id: { type: string, format: uuid }
        override_template_reason: { type: string }

    AtomicCreateResponse:
      type: object
      required: [controlled_document, document]
      properties:
        controlled_document:
          $ref: '#/components/schemas/ControlledDocument'
        document:
          $ref: '#/components/schemas/DocumentRef'

    CreateRevisionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        form_data: { type: object, additionalProperties: true }
        template_version_id: { type: string, format: uuid }

    RevisionResponse:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/DocumentRef'

    PreviewCodeResponse:
      type: object
      required: [profile_code, area_code, next_seq, code]
      properties:
        profile_code: { type: string }
        area_code: { type: string }
        next_seq: { type: integer, minimum: 1 }
        code: { type: string }

    ActiveDocumentResponse:
      type: object
      properties:
        document_id: { type: string, format: uuid }
        approval_state: { type: string, enum: [draft, under_review, approved, scheduled, rejected, cancelled] }
        content_hash: { type: string }
        revision_version: { type: integer, minimum: 1 }
        published_document_id: { type: string, format: uuid }
        approval_instance_id: { type: string, format: uuid }
    ApprovalInstanceResponse:
      type: object
      required: [id, document_id, route_id, tenant_id, status, submitted_by, submitted_at, stages, etag, completed_at, frozen_content_hash]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        status:
          type: string
          enum: [in_progress, approved, rejected, cancelled, changes_requested]
        submitted_by: { type: string }
        submitted_at: { type: string, format: date-time }
        completed_at:
          type: string
          format: date-time
          nullable: true
        stages:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStageInstanceResponse'
        etag: { type: string }
        frozen_content_hash:
          type: string
          nullable: true
          description: >-
            F6/F8 — the SHA-256 hex digest pinned at freeze time (no-fallback
            principle, spec §11). null when the instance has not yet reached
            the freeze boundary.
    ApprovalInstanceByDocumentResponse:
      type: object
      required: [id, document_id, route_id, tenant_id, status, submitted_by, submitted_at, stages, etag, completed_at, frozen_content_hash, viewer, verdicts]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        status:
          type: string
          enum: [in_progress, approved, rejected, cancelled, changes_requested]
        submitted_by: { type: string }
        submitted_at: { type: string, format: date-time }
        completed_at:
          type: string
          format: date-time
          nullable: true
        stages:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStageInstanceResponse'
        etag: { type: string }
        frozen_content_hash:
          type: string
          nullable: true
          description: >-
            F6/F8 — the SHA-256 hex digest pinned at freeze time (no-fallback
            principle, spec §11). null when the instance has not yet reached
            the freeze boundary.
        viewer:
          type: object
          description: >-
            F2d.1 (ADR 0078) — server-derived eligibility truth for the
            authenticated caller, always present when the instance is
            returned. Display facts only: the frontend must never derive
            eligibility client-side; enforcement stays at tier-2
            authz.Require plus the write-path CheckEligibility/CheckSoD.
          required: [is_author, eligible_for_active_stage, has_signed_active_stage, via_delegation_from]
          properties:
            is_author: { type: boolean }
            eligible_for_active_stage: { type: boolean }
            has_signed_active_stage: { type: boolean }
            via_delegation_from:
              nullable: true
              type: object
              required: [user_id, display_name]
              properties:
                user_id: { type: string }
                display_name: { type: string }
        verdicts:
          type: array
          description: >-
            F2d.2 (ADR 0079) — the instance's review-verdict history across ALL
            stages, ordered chronologically (verdict_at ascending). Empty array
            when no verdict has been recorded. actor_display_name is the
            immutable snapshot cast at the moment of the verdict (audit truth —
            never re-resolved from the live directory, no fallback).
          items:
            $ref: '#/components/schemas/ApprovalVerdictRecordResponse'
    ApprovalVerdictRecordResponse:
      type: object
      required: [id, stage_instance_id, actor_user_id, actor_display_name, verdict, reason, verdict_at]
      properties:
        id: { type: string, format: uuid }
        stage_instance_id: { type: string, format: uuid }
        actor_user_id: { type: string }
        actor_display_name:
          type: string
          description: >-
            Immutable snapshot of the actor's display name at verdict time
            (DB-enforced non-empty, migration 0294). Never re-resolved live.
        verdict:
          type: string
          enum: [ready, request_changes]
        reason:
          type: string
          nullable: true
          description: >-
            The verdict comment. Required and non-empty for request_changes,
            optional for ready; null when absent.
        verdict_at: { type: string, format: date-time }
    ApprovalStageInstanceResponse:
      type: object
      required: [id, stage_index, label, status, signoffs, actors, due_at]
      properties:
        id: { type: string, format: uuid }
        stage_index: { type: integer, minimum: 1 }
        label: { type: string }
        status:
          type: string
          enum: [pending, active, passed, failed, cancelled]
        signoffs:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalSignoffRecordResponse'
        actors:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalStageActorResponse'
        stage_kind:
          type: string
          enum: [review, approval]
          description: F8 (spec.md §4/W4) — distinguishes a review (comment/feedback) stage from an approval (signoff) stage.
        due_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            F8 (spec.md §4/W4) — this stage's SLA due date, set on activation
            from due_in_days_snapshot. null while pending, or when no SLA is
            configured (no-fallback principle, spec §11).
    ApprovalStageActorResponse:
      type: object
      required: [user_id, display_name, status, decision]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        status:
          type: string
          enum: [approved, rejected, active, waiting]
        decision:
          type: string
          nullable: true
          enum: [approve, reject]
    ApprovalSignoffRecordResponse:
      type: object
      required: [id, actor_user_id, decision, signature_method, signed_at, signature_meaning]
      properties:
        id: { type: string, format: uuid }
        actor_user_id: { type: string }
        decision:
          type: string
          enum: [approve, reject]
        reason: { type: string }
        signature_method: { type: string }
        signed_at: { type: string, format: date-time }
        signature_meaning:
          type: string
          enum: [approval, rejection]
          description: >-
            What this signature legally attests (21 CFR 11.50(a)(3)) — derived
            from the actor's decision at signoff time, never client-writable.
    SubmitDocumentRequest:
      type: object
      properties:
        route_id:
          type: string
          format: uuid
          description: >-
            Active approval route to submit against. Optional: when omitted the
            server resolves the single active route for the document's
            controlled-document profile in the same transaction (ADR 0073).
        content_hash:
          type: string
          minLength: 64
          maxLength: 64
          description: >-
            SHA-256 hex digest of the content being submitted (autosave-computed).
            Optional: when omitted the server binds the head revision's stored
            content hash in the same transaction (ADR 0073).
        revision_title:
          type: string
          minLength: 1
          description: >-
            Governed revision title. Required for revision >= 1 (enforced by the
            service against the in-tx governed revision number); omit at revision 0
            to use the canonical initial title.
        reason_for_change:
          type: string
          description: >-
            Structured reason-for-change (21 CFR Part 11 attributable change reason).
            Distinct from revision_title (the title of the revision). Optional in the
            schema; the handler requires it for revision >= 1 (rejected 422 problem+json
            when missing), and it is optional at initial creation (revision 0).
        reason_category:
          type: string
          enum: [content, corrective, regulatory, periodic_review, administrative]
          description: Optional structured category for the reason-for-change.
        chosen_actors:
          type: array
          items:
            $ref: '#/components/schemas/SubmitChosenActors'
          description: >-
            Per-stage caller-chosen actors (M4, unit 3.2, slice 5). Required
            only for stages governed by a submit_choice actor selector: a
            matching entry with a non-empty user_ids is mandatory for such a
            stage (422 otherwise), and every chosen user is validated
            server-side against the selector's role x area_code constraint
            (422 on violation). An entry naming a stage_order with no
            submit_choice selector is also rejected (422, fail-closed).
    SubmitChosenActors:
      type: object
      required: [stage_order, user_ids]
      properties:
        stage_order:
          type: integer
          minimum: 1
        user_ids:
          type: array
          minItems: 1
          items:
            type: string
    SubmitDocumentResponse:
      type: object
      required: [instance_id, was_replay, etag]
      properties:
        instance_id:
          type: string
          format: uuid
        was_replay:
          type: boolean
        etag:
          type: string
    SignoffDocumentRequest:
      type: object
      required: [decision, password, content_hash]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          description: Required when decision is reject.
        password:
          type: string
          minLength: 1
          description: Re-authentication password for the signature (password_reauth method).
        content_hash:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 hex digest of the content being signed off.
    SignoffDocumentResponse:
      type: object
      required: [signoff_id, was_replay, outcome]
      properties:
        signoff_id:
          type: string
        was_replay:
          type: boolean
        outcome:
          type: string
    TemplateApprovalSubmitResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [instance_id, version_status]
          properties:
            instance_id:
              type: string
              format: uuid
            version_status:
              type: string
              description: The template version's status after the kernel submit-lock (always under_review on success).
    TemplateSubmitForApprovalRequest:
      type: object
      properties:
        chosen_actors:
          type: array
          items:
            $ref: '#/components/schemas/SubmitChosenActors'
          description: >-
            Per-stage caller-chosen actors (M4, unit 3.2, slice 5), symmetric
            with SubmitDocumentRequest.chosen_actors. Optional body: existing
            callers that never submit a submit_choice-governed route may omit
            it entirely.
    SignoffTemplateVersionRequest:
      type: object
      required: [decision, password]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          description: Required when decision is reject.
        password:
          type: string
          minLength: 1
          description: Re-authentication password for the signature (password_reauth method).
    SignoffApprovalStageRequest:
      type: object
      required: [decision, password_token, content_hash]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          description: Required when decision is reject.
        password_token:
          type: string
          minLength: 1
          description: Re-authentication password for the signature (password_reauth method).
        content_hash:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 hex digest of the content being signed off.
    ReviewVerdictRequest:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [ready, request_changes]
        comment:
          type: string
          description: Required when verdict is request_changes.
    ReviewVerdictResponse:
      type: object
      required: [verdict_id, was_replay, outcome, fast_forward_eligible]
      properties:
        verdict_id:
          type: string
        was_replay:
          type: boolean
        outcome:
          type: string
        fast_forward_eligible:
          type: boolean
          description: >-
            R5 (unit 2.3 G3) — true iff this verdict completed the review
            stage (quorum satisfied) AND the actor is eligible on the
            now-active approval-kind stage.
        next_stage_id:
          type: string
          format: uuid
          description: >-
            R5 — the now-active stage's id, present only when
            fast_forward_eligible is true.
    FastForwardRequest:
      type: object
      required: [password_token, content_hash]
      properties:
        comment:
          type: string
          description: Optional verdict comment recorded on the `ready` review-verdict leg.
        password_token:
          type: string
          minLength: 1
          description: Re-authentication password for the signature (password_reauth method).
        content_hash:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 hex digest of the content being signed off.
    FastForwardResponse:
      type: object
      required: [signoff_id, was_replay, outcome]
      properties:
        signoff_id:
          type: string
        was_replay:
          type: boolean
        outcome:
          type: string
          description: Final outcome of the signature leg (same vocabulary as signoff).
    ApprovalInboxItem:
      type: object
      required: [instance_id, subject_kind, subject_key, subject_title, subject_ref, controlled_document_id, area_code, submitted_by, submitted_at, stage_label, quorum_progress, stage_kind, due_at]
      properties:
        instance_id: { type: string, format: uuid }
        subject_kind:
          type: string
          enum: [document, template]
          description: Unit 4.2 — the approval instance's subject discriminator (ai.subject_kind).
        subject_key:
          type: string
          description: >-
            Unit 4.2 — the kernel subject key (ai.subject_key): documentId for
            document instances, template version id for template instances.
        subject_title:
          type: string
          description: >-
            Unit 4.2 — display name: the document name for document instances,
            the template name for template instances.
        subject_ref:
          type: string
          description: >-
            Unit 4.2 — the FE navigation id: documentId for document
            instances, templateId for template instances (NOT the version id).
        controlled_document_id:
          type: string
          format: uuid
          nullable: true
          description: Document instances only; always present, null for template instances.
        area_code: { type: string }
        submitted_by: { type: string }
        submitted_at: { type: string, format: date-time }
        stage_label: { type: string }
        quorum_progress:
          type: string
          description: Human-readable quorum progress for the actor's pending stage, e.g. "1/2".
        stage_kind:
          type: string
          enum: [review, approval]
          description: F8 (spec.md §4/W4) — the actor's pending stage's kind.
        due_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            F8 (spec.md §4/W4) — the actor's pending stage's SLA due date, if
            configured (due_in_days_snapshot non-null). null when no SLA is
            configured for the stage (no-fallback principle, spec §11: never a
            substitute default).
    ApprovalInboxResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalInboxItem'
        total:
          type: integer
          description: Total pending items for the actor across all pages.
    SchedulePublishDocumentRequest:
      type: object
      required: [effective_from]
      properties:
        effective_from:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp the publish takes effect; non-UTC offsets are rejected.
        superseded_document_id:
          type: string
          format: uuid
          description: Optional document to supersede when the scheduled publish fires.
        effective_to:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry date; the publish is no longer effective after this instant.
        review_due_at:
          type: string
          format: date-time
          nullable: true
          description: Optional initial periodic-review due date set at schedule/publish time.
    MarkDocumentReviewedRequest:
      type: object
      required: [review_due_at]
      properties:
        review_due_at:
          type: string
          format: date-time
          description: The NEXT periodic-review due date to set on the document (RFC3339 UTC).
        effective_to:
          type: string
          format: date-time
          nullable: true
          description: Optional updated expiry date to set alongside the review completion.
    PublishDocumentResponse:
      type: object
      required: [document_id, new_status]
      properties:
        document_id:
          type: string
          format: uuid
        new_status:
          type: string
          description: published for immediate publish; scheduled for schedule-publish.
        effective_from:
          type: string
          format: date-time
          description: Present only for schedule-publish; RFC3339 UTC effective date.
    ObsoleteDocumentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    ObsoleteDocumentResponse:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: string
          format: uuid
    CancelDocumentApprovalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    CancelDocumentApprovalResponse:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: string
          format: uuid
    CreateApprovalDelegationRequest:
      type: object
      required: [delegate_id, starts_at, ends_at, reason]
      properties:
        delegate_id:
          type: string
          description: user_id of the user receiving the delegated eligibility.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
    ApprovalDelegation:
      type: object
      required: [id, tenant_id, delegator_id, delegate_id, starts_at, ends_at, reason, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        delegator_id:
          type: string
        delegate_id:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    SupersedeDocumentRequest:
      type: object
      required: [superseded_document_id]
      properties:
        superseded_document_id:
          type: string
          format: uuid
          description: Published document this document supersedes.
    SupersedeDocumentResponse:
      type: object
      required: [document_id, superseded_id]
      properties:
        document_id:
          type: string
          format: uuid
        superseded_id:
          type: string
          format: uuid
    DocumentRevisionHistoryItem:
      type: object
      required: [document_id, revision_number, revision_title, status, created_at, is_current]
      properties:
        document_id:
          type: string
          format: uuid
        revision_number:
          type: integer
          format: int64
        revision_title:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        is_current:
          type: boolean
    DocumentRevisionHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRevisionHistoryItem'
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: 'JSON pointer or dot path' }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      # RFC 9457 §3.1: `type` is optional (absent ⇒ "about:blank"). The Go helper
      # (internal/platform/problem) omits it unless WithType is called, so it is
      # not in the required set — required mirrors what every emitter guarantees.
      required: [title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Machine-readable code from canonical taxonomy' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    QuorumKind:
      type: string
      description: Quorum policy applied to a stage. `m_of_n` requires `quorum_m`.
      enum: [any_1_of, all_of, m_of_n]
    DriftPolicy:
      type: string
      description: Behaviour applied when an actor loses eligibility mid-stage.
      enum: [reduce_quorum, fail_stage, keep_snapshot]
    ActorSelector:
      type: object
      additionalProperties: true
      required: [kind]
      properties:
        kind: { type: string, enum: [named_user, role_in_fixed_area, role_in_document_area, submit_choice] }
        user_id: { type: string, minLength: 1, maxLength: 64 }
        role: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9_-]+$' }
        area_code: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9_-]+$' }
      description: >-
        M4 ActorSelector (unit 3.2). Discriminated union by `kind`; per-kind field
        presence enforced in domain + DB (named_user→user_id; role_in_fixed_area→role+area_code;
        role_in_document_area→role; submit_choice→role+area_code).
    StageRequest:
      type: object
      additionalProperties: true
      required: [order, name, required_capability, quorum, drift_policy, selectors]
      properties:
        order:
          type: integer
          minimum: 1
          description: 1-based stage ordinal. Must equal index+1.
        name: { type: string, minLength: 1, maxLength: 64 }
        required_capability: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9_]*\.[a-z0-9._]*[a-z0-9]$' }
        quorum: { $ref: '#/components/schemas/QuorumKind' }
        quorum_m:
          type: integer
          minimum: 1
          description: Required when `quorum` is `m_of_n`; must be omitted otherwise.
        drift_policy: { $ref: '#/components/schemas/DriftPolicy' }
        stage_kind:
          type: string
          enum: [review, approval]
          description: >-
            F0 (spec.md §4/W2) — review (comment/suggestion) vs approval
            (signoff) stage. Optional; omitted defaults to approval at
            persistence. A review-kind route is only creatable by supplying
            this field.
        selectors:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ActorSelector' }
          description: >-
            M4 ActorSelector (unit 3.2). REQUIRED — selectors are the sole
            source of truth for a stage's actor pool. The legacy flat
            required_role/area_code wire fields have been removed entirely
            (no fallback, no synthesis).
    StageSummary:
      type: object
      additionalProperties: true
      required: [order, name, required_capability, quorum, drift_policy, quorum_m, selectors]
      properties:
        order: { type: integer, minimum: 1 }
        name: { type: string }
        required_capability: { type: string }
        quorum: { $ref: '#/components/schemas/QuorumKind' }
        quorum_m:
          type: integer
          minimum: 1
          nullable: true
        drift_policy: { $ref: '#/components/schemas/DriftPolicy' }
        stage_kind:
          type: string
          enum: [review, approval]
          description: F0 (spec.md §4/W2) — review vs approval stage; defaults to approval.
        selectors:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ActorSelector' }
          description: >-
            M4 ActorSelector (unit 3.2). Sole source of truth for the stage's
            actor pool; always returned. The legacy flat required_role/area_code
            wire fields have been removed entirely.
    ApprovalRoutePreviewStage:
      type: object
      required: [stage_order, label, selectors]
      properties:
        stage_order: { type: integer, minimum: 1 }
        label: { type: string, description: The stage's configured name. }
        selectors:
          type: array
          items: { $ref: '#/components/schemas/ActorSelector' }
          description: >-
            M4 ActorSelector (unit 3.2). Reused verbatim from StageSummary —
            the same discriminated union a submit_choice picker inspects to
            learn a stage's role/area_code constraint before the caller
            supplies chosen_actors.
    ApprovalRoutePreview:
      type: object
      required: [route_id, route_name, stages]
      properties:
        route_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The resolved active route's id, or null when no active approval
            route resolves for this subject yet. Informational only —
            submit-time resolution (ADR 0073 / ADR 0082) remains the sole
            authority; a null here does not guarantee submit will also fail
            (a route could be activated concurrently) and a non-null id does
            not guarantee submit will succeed (e.g. a concurrently
            deactivated route).
        route_name:
          type: string
          nullable: true
          description: The resolved route's configured display name; null when route_id is null.
        stages:
          type: array
          items: { $ref: '#/components/schemas/ApprovalRoutePreviewStage' }
          description: Empty when route_id is null.
    CreateRouteRequest:
      type: object
      additionalProperties: true
      required: [profile_code, name, stages]
      properties:
        profile_code: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9_-]+$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        subject_kind:
          type: string
          enum: [document, template]
          description: >-
            M3 kernel extraction (ADR 0082, P2.S3). Optional; omitted defaults
            to `document`, preserving the legacy (document, profile_code)
            subject unchanged. A non-document kind is accepted and persisted
            faithfully but carries no template-specific governance in this
            slice (Phase 3).
        subject_key:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            M3 kernel extraction (ADR 0082, P2.S3). Optional; omitted defaults
            to `profile_code` when `subject_kind` is `document` (or absent),
            preserving byte-equal legacy behavior.
        stages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StageRequest' }
    UpdateRouteRequest:
      type: object
      additionalProperties: true
      required: [name, stages]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        stages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StageRequest' }
    DeactivateRouteRequest:
      type: object
      additionalProperties: true
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Governance reason recorded with deactivation event.
    RouteResponse:
      type: object
      additionalProperties: true
      required: [route_id]
      properties:
        route_id: { type: string, format: uuid }
        new_version:
          type: integer
          minimum: 1
          description: New route version after a successful update. Omitted for create/deactivate.
    RouteSummary:
      type: object
      additionalProperties: true
      required: [id, name, tenant_id, profile_code, active, version, stages, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenant_id: { type: string, format: uuid }
        profile_code: { type: string }
        subject_kind:
          type: string
          enum: [document, template]
          description: >-
            M3 kernel extraction (ADR 0082, P2.S3). What this route governs;
            `document` for every route created via the legacy profile_code
            path.
        subject_key:
          type: string
          description: >-
            M3 kernel extraction (ADR 0082, P2.S3). The governed entity's key
            within subject_kind's bounded context; equals profile_code for a
            document-subject route.
        active: { type: boolean }
        version:
          type: integer
          minimum: 1
          description: Monotonic version bumped on each update or deactivation.
        stages:
          type: array
          items: { $ref: '#/components/schemas/StageSummary' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListRoutesResponse:
      type: object
      additionalProperties: true
      required: [routes, total]
      properties:
        routes:
          type: array
          items: { $ref: '#/components/schemas/RouteSummary' }
    TokenDictionaryEntry:
      type: object
      required: [id, name, value, label, created_at, updated_at, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 64 }
        value: { type: string, minLength: 1, maxLength: 4096 }
        label: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 1024, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListTokenDictionaryEntriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TokenDictionaryEntry'
    CreateTokenDictionaryEntryRequest:
      type: object
      required: [name, value, label]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        value: { type: string, minLength: 1, maxLength: 4096 }
        label: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 1024, nullable: true }
    UpdateTokenDictionaryEntryRequest:
      type: object
      required: [name, value, label]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        value: { type: string, minLength: 1, maxLength: 4096 }
        label: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, maxLength: 1024, nullable: true }
