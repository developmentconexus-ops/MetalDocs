      # ADR 0022 Phase 11 (F4): tier-1 + tier-2 both enforce route.manage. The
      # tier-1 row lives in apps/api/cmd/metaldocs-api/permissions.go
      # (/api/v1/approval/routes -> CapRouteManage); tier-2 is
      # authz.Require(CapRouteManage) in approval/application/route_admin_service.go.
      security:
        - sessionCookie: []
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List approval routes for the active tenant
      tags: [approval]
      operationId: listApprovalRoutes
      security:
        - sessionCookie: []
      # ADR 0022 Phase 11 (F4): approval routes are a small, bounded per-tenant
      # configuration set (roughly one active route per document profile), not a
      # growth table. The runtime returns the full tenant set in one response with
      # a `total`; it does not implement cursor/limit. Declaring pagination params
      # the server does not honor would be spec-fiction drift, so this list is
      # explicitly exempted rather than given a fake pagination contract.
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Bounded per-tenant approval-route config set; runtime returns the full set with total, no cursor/limit. Declaring pagination would be spec-fiction (no shape change permitted in ADR 0022).'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRoutesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /approval/routes/{id}:
    put:
      summary: Update an approval route (new version)
      tags: [approval]
      operationId: updateApprovalRoute
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Expected route version ETag in the form "v<N>"' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRouteRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Deactivate an approval route
      tags: [approval]
      operationId: deactivateApprovalRoute
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Expected route version ETag in the form "v<N>"' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRouteRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    # Referenced by `security: [- sessionCookie: []]` across the spec. Declared
    # here so codegen emits a defined scope-key type (oapi-codegen v2.7.0 errors
    # out on an undefined scheme). Authentication is actually enforced by the
    # application's session middleware (wiki/concepts/authz-tiers.md); this entry
    # documents the requirement for OpenAPI consumers and the generated server.
    sessionCookie:
      type: apiKey
      in: cookie
      name: metaldocs_session
      description: Session cookie issued by POST /api/v1/auth/login.
  responses:
    BadRequest:
      description: Requisicao invalida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Nao autenticado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Sem permissao
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso nao encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito de estado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Entidade nao processavel
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
  schemas:
    AuthLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
    CurrentUser:
      type: object
      required: [userId, tenantId, tenantName, username, displayName, mustChangePassword, roles, capabilities]
      properties:
        userId:
          type: string
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            type: string
            enum: [system_admin, approver, author, editor, viewer]
        capabilities:
          type: array
          description: |
            Capability codes the actor holds in the active tenant. UX hint only —
            backend remains the sole authorization boundary (see
            wiki/concepts/authz-tiers.md). May be empty when no capability
            provider is wired (in-memory dev modes).
          items:
            type: string
    AuthLoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        expiresAt:
          type: string
          format: date-time
    HealthCheckItem:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
        mode:
          type: string
        provider:
          type: string
        enabled:
          type: boolean
        detail:
          type: string
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckItem'
    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: Obrigatoria para troca de senha em sessao normal; opcional no fluxo de primeiro acesso com troca obrigatoria.
        newPassword:
          type: string
    ChangePasswordResponse:
      type: object
      required: [changed, user]
      properties:
        changed:
          type: boolean
        user:
          $ref: '#/components/schemas/CurrentUser'
    UserRole:
      type: string
      description: Canonical tenant role. 8 values; no `admin` or `reviewer` phantoms.
      enum: [system_admin, approver, author, editor, viewer, signer, area_admin, qms_admin]
    AreaMembership:
      type: object
      required: [userId, areaCode, role]
      properties:
        userId: { type: string }
        areaCode: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
    AreaMembershipInput:
      type: object
      required: [areaCode, role]
      properties:
        areaCode: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
    AreaMembershipRow:
      type: object
      description: Active area membership row returned by the tenant-scoped /iam/area-memberships listing.
      required: [userId, tenantId, areaCode, role, effectiveFrom]
      properties:
        userId: { type: string }
        tenantId: { type: string }
        areaCode: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        grantedBy:
          type: string
          nullable: true
    AreaMembershipListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AreaMembershipRow'
    GrantAreaMembershipRequest:
      type: object
      required: [userId, areaCode, role]
      properties:
        userId: { type: string }
        areaCode: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
    GrantAreaMembershipResponse:
      type: object
      required: [userId, tenantId, areaCode, role]
      properties:
        userId: { type: string }
        tenantId: { type: string }
        areaCode: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
    ManagedUserCore:
      type: object
      description: Canonical user shape — single tenantRole + multi area memberships.
      required:
        - userId
        - username
        - displayName
        - isActive
        - mustChangePassword
        - failedLoginAttempts
        - tenantRole
        - areaMemberships
        - createdAt
        - updatedAt
      properties:
        userId: { type: string }
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        failedLoginAttempts: { type: integer }
        lockedUntil:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        tenantRole:
          $ref: '#/components/schemas/UserRole'
        areaMemberships:
          type: array
          items:
            $ref: '#/components/schemas/AreaMembership'
        mfaEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CursorPage:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    ListUsersResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedUserCore'
        page:
          $ref: '#/components/schemas/CursorPage'
        total:
          type: integer
          minimum: 0
    UserInviteRequest:
