      tags: [templates]
      operationId: publishTemplateVersion
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: n, required: true, schema: { type: integer } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docx_key, schema_key]
              properties:
                docx_key: { type: string }
                schema_key: { type: string }
      responses:
        '200':
          description: published + next draft created
          content:
            application/json:
              schema:
                type: object
                required: [published_version_id, next_draft_id, next_draft_version_num]
                properties:
                  published_version_id: { type: string }
                  next_draft_id: { type: string }
                  next_draft_version_num: { type: integer }
        '422':
          description: template invalid
          # AD-2 exemption (api-contract-hardening Phase D): bespoke template-token
          # validation result, not the RFC 9457 error shape. Consumed by the template
          # editor FE (features/templates/api/templates.ts) to render parse errors +
          # missing tokens; migrating it to Problem.errors[] is a coupled spec+runtime+FE
          # change owned by the templates-module contract refresh (Phase E/F).
          x-error-envelope-exempt: "Legacy template-token validation payload (valid/parse_errors/missing_tokens) consumed by the template editor; Problem migration tracked for the templates-module contract refresh."
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  parse_errors: { type: array, items: { type: object } }
                  missing_tokens: { type: array, items: { type: string } }
                  orphan_tokens: { type: array, items: { type: string } }

