        '404': { description: not_found }
    patch:
      tags: [documents]
      operationId: renameDocument
      x-authz-skip-area: true
      x-authz-skip-reason: >-
        document.edit is area-grade; the document's process area is loaded from
        the document row and enforced at tier-2 in the repository layer, not from a
        request field scannable here (ADR 0022 Phase 7). Representative surface for
        the document.edit area posture.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
