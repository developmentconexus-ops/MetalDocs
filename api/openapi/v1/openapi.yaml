      operationId: listDocumentCheckpoints
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentCheckpoint'
    post:
      tags: [documents]
      operationId: createDocumentCheckpoint
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { label: { type: string } } }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCheckpoint'

  /api/v1/documents/{id}/checkpoints/{version}/restore:
    post:
      tags: [documents]
      operationId: restoreDocumentCheckpoint
      summary: Forward-only restore - clones the checkpoint rev into a new head revision
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: restored (new head revision appended) OR idempotent no-op (if current head already equals the checkpoint hash)
          content:
            application/json:
              schema:
                type: object
                required: [new_revision_id, new_revision_num, idempotent]
                properties:
                  new_revision_id: { type: string, format: uuid }
                  new_revision_num: { type: integer, minimum: 1 }
                  source_checkpoint_version_num: { type: integer, minimum: 1 }
                  idempotent: { type: boolean, description: "true when ON CONFLICT (document_id, content_hash) fired - current head already matches" }
        '403': { description: session_not_holder | document_not_owner | session_inactive }
        '404': { description: checkpoint_not_found }

  /api/v1/documents/{id}/revisions/{rid}/url:
    get:
      tags: [documents]
      operationId: getDocumentRevisionUrl
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '302': { description: redirect to signed URL }

  /api/v1/documents/{id}/comments:
    get:
      tags: [documents]
      operationId: listDocumentComments
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
