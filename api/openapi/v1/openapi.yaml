        source: tx
        derived_from: 'documents.process_area_code_snapshot (fallback controlled_documents.process_area_code)'
        note: >-
          Area-scoped cap enforced at tier-2 in the tx-layer service via
          authz.Require with the area resolved from the document row
          (LoadDocumentAreaCode); never from a request field. Postgres tripwire
          (migration 0142b) is the backstop.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string }, description: 'Expected revision version ETag in the form "v<N>"' }
