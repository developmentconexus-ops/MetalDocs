    SystemBlankTemplateResponse:
      type: object
      required: [templateId, templateVersionId, name]
      properties:
        templateId: { type: string, format: uuid }
        templateVersionId: { type: string, format: uuid }
        name: { type: string }
    TemplateDTO:
      type: object
      required: [id, tenant_id, key, name, latest_version, latest_revision_number, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        doc_type_code: { type: string, nullable: true }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        latest_version: { type: integer, minimum: 1 }
        latest_revision_number:
          type: integer
          format: int32
          minimum: 0
          description: >
            Regulated revision number of the template's latest (working) version.
            0-based (REV00, REV01, ...). Always present. Used as the fallback
            revision label for never-published drafts, mirroring Documents. ADR 0013.
        published_version_id: { type: string, format: uuid, nullable: true }
        published_version_number: { type: integer, nullable: true, minimum: 1 }
        current_revision_number:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: >
            Regulated revision number of the currently published template version.
            0-based (REV00, REV01, ...). Null when the template has never been
            published. ADR 0013.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    VersionDTO:
      type: object
      required: [id, template_id, version_number, status, author_id, created_at]
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        revision_number:
          type: integer
          format: int32
          minimum: 0
          description: >
            0-based regulated revision counter. REV{nn} = revision_number,
            zero-padded. ADR 0013.
        status: { type: string, enum: [draft, in_review, approved, published, obsolete] }
        docx_storage_key: { type: string, nullable: true }
        content_hash: { type: string, nullable: true }
        metadata_schema: { type: object, nullable: true, additionalProperties: true }
        placeholder_schema: { type: object, nullable: true, additionalProperties: true }
        author_id: { type: string }
        pending_reviewer_role: { type: string, nullable: true }
        pending_approver_role: { type: string, nullable: true }
        reviewer_id: { type: string, nullable: true }
        approver_id: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        obsoleted_at: { type: string, format: date-time, nullable: true }
        lock_version:
          type: integer
          format: int32
          minimum: 0
          description: >
            Optimistic-concurrency token. Increments on every successful write
            to the version row. Clients must echo the last-seen value back via
            `expected_lock_version` on PUT .../schema and PUT .../draft. A
            mismatch yields HTTP 412 with code `stale_lock_version`.
        created_at: { type: string, format: date-time }
    CreateTemplateResponse:
      type: object
      required: [data]
      properties:
        data:
