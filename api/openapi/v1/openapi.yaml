openapi: 3.0.3
info:
  title: MetalDocs API
  version: 1.0.0
  description: >
    API inicial do MetalDocs (v1). Escopo atual sem integracao com IA.
servers:
  - url: /api/v1
# Secure-by-default: every operation requires the session cookie unless it
# overrides with an explicit `security: []` (the truly public endpoints —
# login, health/readiness probes, feature flags, and signed-URL downloads).
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Session authentication — login, logout, and the current-user probe.
  - name: iam
    description: Identity and access management — users, roles, capabilities, sessions, and area memberships.
  - name: audit
    description: Tenant audit-event stream and exports.
  - name: security
    description: Security operations — account lockouts and security signals.
  - name: configuration
    description: Server-controlled configuration and feature flags.
  - name: templates
    description: Document templates, versions, schemas, and approval configuration.
  - name: taxonomy
    description: Document taxonomy — profiles, areas, and families.
  - name: controlled-documents
    description: Controlled-document lifecycle and code allocation.
  - name: documents
    description: Document authoring, sessions, autosave, comments, placeholders, and exports.
  - name: distribution
    description: Controlled-document distribution coverage — the obligated audience (denominator only; numerator parked, ADR-0042).
  - name: notifications
    description: Per-recipient notification inbox — read surface (list / unread-count / mark-read). Projected from governance_events for the document-lifecycle bundle (ADR-0043). Self-scope.
  - name: tokens
    description: Tenant token dictionary — author-defined reusable {name} -> value constants. Capability-governed (token.view / token_dictionary.manage). Backend only at SP-1.
  - name: approval
    description: Approval routes, instances, sign-offs, and document lifecycle transitions.
  - name: search
    description: Cross-document search.
  - name: health
    description: Liveness and readiness probes.
  - name: observability
    description: Operational HTTP metrics.
paths:
  /health/live:
    get:
      summary: Liveness check
      operationId: checkLiveness
      tags: [health]
      security: []
      responses:
        '200':
          description: API em execucao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      summary: Readiness check
      operationId: checkReadiness
      tags: [health]
      security: []
      responses:
        '200':
          description: Dependencias prontas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Dependencias indisponiveis ou degradadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: HTTP RED metrics por rota
      operationId: getMetrics
      tags: [observability]
      responses:
        '200':
          description: Metricas de requests, erros e duracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      summary: Autentica usuario local e cria sessao por cookie
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Sessao criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      summary: Revoga a sessao atual
      tags: [auth]
      operationId: logout
      responses:
        '204':
          description: Sessao encerrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/me:
    get:
      summary: Retorna o usuario autenticado atual
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Usuario atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/change-password:
    post:
      summary: Troca a senha do usuario autenticado
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users:
    get:
      summary: List tenant users (cursor-paginated, filterable)
      tags: [iam]
      operationId: listUsers
      parameters:
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: area_code
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: Free-text search across displayName, username, email
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Cria usuario interno com credencial local inicial (legacy; prefer POST /iam/users/invite)
      tags: [iam]
      operationId: createManagedUser
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedUserRequest'
      responses:
        '201':
          description: Usuario criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateManagedUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tenants:
    post:
      summary: Provisiona novo tenant com usuario administrador inicial
      tags: [iam]
      operationId: onboardTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardTenantRequest'
      responses:
        '201':
          description: Tenant provisionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardTenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tenants/{tenant_id}/export:
    post:
      summary: Solicita exportacao completa dos dados de um tenant (assincrono)
      tags: [iam]
      operationId: exportTenant
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Exportacao enfileirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tenants/{tenant_id}/erase:
    post:
      summary: Solicita apagamento (crypto-shred) irreversivel dos dados de um tenant (assincrono)
      tags: [iam]
      operationId: eraseTenant
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Apagamento enfileirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{user_id}:
    patch:
      summary: Atomic metadata + tenant role update (single tx)
      tags: [iam]
      operationId: patchUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagedUserRequest'
      responses:
        '200':
          description: Usuario atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserCore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{user_id}/reset-password:
    post:
      summary: Admin password reset (forces must-change-on-first-login)
      tags: [iam]
      operationId: resetPassword
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetManagedUserPasswordRequest'
      responses:
        '200':
          description: Senha resetada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetManagedUserPasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{user_id}/unlock:
    post:
      summary: Clear operational lock + failed-login counter for a user
      tags: [iam]
      operationId: unlockUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario desbloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockManagedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/admin/overview:
    get:
      summary: Composed Admin Center overview (KPI strip + presence + recent activity)
      tags: [iam]
      operationId: getIamAdminOverview
      responses:
        '200':
          description: Resumo administrativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/invite:
    post:
      summary: Invite a new user (server-generated temp password, must change on first login)
      tags: [iam]
      operationId: inviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteRequest'
      responses:
        '201':
          description: Usuario convidado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInviteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/bulk:
    post:
      summary: Bulk action over a set of users (activate, deactivate, unlock, force-logout)
      tags: [iam]
      operationId: bulkUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBulkActionRequest'
      responses:
        '200':
          description: Resultado da acao em lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBulkActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{user_id}/memberships:
    get:
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Bounded per-user set: a single user''s active area memberships; not a growing collection.'
      summary: List area memberships for a user
      tags: [iam]
      operationId: listMemberships
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Lista de memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMembershipsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/roles:
    get:
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Fixed reference catalog: the tenant role set is a small bounded enumeration.'
      summary: List canonical tenant roles (read-only)
      tags: [iam]
      operationId: listRoles
      responses:
        '200':
          description: Lista de roles canonicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/capabilities:
    get:
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Fixed reference catalog: the capability set is a small bounded enumeration.'
      summary: List capability registry (read-only)
      tags: [iam]
      operationId: listCapabilities
      responses:
        '200':
          description: Lista de capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/role-capabilities:
    get:
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Fixed reference catalog: the role→capability matrix is a small bounded set.'
      summary: List role-capability matrix rows (read-only)
      tags: [iam]
      operationId: listRoleCapabilities
      responses:
        '200':
          description: Matriz role x capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRoleCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/kpi:
    get:
      summary: Tenant KPI snapshot for the Overview strip
      tags: [iam]
      operationId: getKpi
      responses:
        '200':
          description: Snapshot de KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IamKpiSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/usage:
    get:
      summary: Tenant consumption snapshot (seats, storage, API, active users)
      tags: [iam]
      operationId: getUsage
      responses:
        '200':
          description: Snapshot de consumo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/presence/snapshot:
    get:
      summary: Online presence snapshot (HTTP fallback when WebSocket unavailable)
      tags: [iam]
      operationId: getPresenceSnapshot
      responses:
        '200':
          description: Snapshot de presenca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/presence/stream:
    get:
      summary: Online presence live stream (WebSocket upgrade)
      description: >
        Upgrades to a WebSocket (HTTP 101) and streams presence frames: an initial
        `snapshot`, then `join`/`leave`/`online`/`idle` deltas and periodic `heartbeat`.
        Each frame conforms to PresenceStreamEvent. Not a request/response operation —
        excluded from server codegen (exclude-operation-ids: streamPresence); the
        hand-written upgrade handler is authoritative. HTTP fallback: /iam/presence/snapshot.
      tags: [iam]
      operationId: streamPresence
      x-websocket-message:
        $ref: '#/components/schemas/PresenceStreamEvent'
      responses:
        '101':
          description: Switching Protocols — WebSocket established; server streams PresenceStreamEvent frames.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/events/export:
    post:
      summary: Export filtered audit events as CSV or JSONL (signed URL, async if large)
      tags: [audit]
      operationId: exportAuditEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportRequest'
      responses:
        '202':
          description: Exportacao agendada (assinada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/events/export/{export_id}:
    get:
      summary: Read the status of an audit export job
      tags: [audit]
      operationId: getAuditExportStatus
      parameters:
        - name: export_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status atual da exportacao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/events/export/{export_id}/download:
    get:
      summary: Download the rendered audit export payload via a signed token
      tags: [audit]
      operationId: downloadAuditExport
      parameters:
        - name: export_id
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Conteudo binario da exportacao (CSV ou JSONL)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/sessions:
    get:
      summary: List active sessions in the current tenant
      tags: [iam]
      operationId: listSessions
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string }
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Lista de sessoes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/sessions/{session_id}:
    delete:
      summary: Revoke (force-logout) a specific session. Gate CapSessionManage.
      tags: [iam]
      operationId: revokeSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Sessao revogada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /security/mfa-coverage:
    get:
      summary: MFA enrollment coverage by tenant + by role
      tags: [security]
      operationId: getMfaCoverage
      responses:
        '200':
          description: Cobertura de MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaCoverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /security/lockouts:
    get:
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Bounded admin view: currently-active account lockouts, a small operational set.'
      summary: Current account lockouts (locked-until window)
      tags: [security]
      operationId: listLockouts
      responses:
        '200':
          description: Lista de lockouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLockoutsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /security/signals:
    get:
      x-pagination-exempt: true
      x-pagination-exempt-reason: 'Bounded admin view: recent security signals, a small operational set.'
