      summary: Revoke an approval delegation
      description: >-
        F9 (spec.md §4/W5, ADR 0077): real-time revocation — hard-deletes the
        delegation row. Only the delegator, or a CapApprovalOversee holder, may
        revoke. A subsequent signoff/review-verdict attempt by the delegate
        re-evaluates eligibility fresh, in-tx, at use-time; there is no cached
        or soft-flag state to go stale.
      tags: [approval]
      operationId: revokeApprovalDelegation
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
