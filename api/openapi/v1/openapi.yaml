            in-progress instances in the tenant (not just the actor's own
            eligible-pool items) and REQUIRES the actor hold CapApprovalOversee
            — a 403 if the capability is missing. Omitted (default) preserves
            the existing eligibility-based inbox (actor's own pending stages).
      responses:
        '200':
          description: ok
