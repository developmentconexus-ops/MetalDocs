        version_number: { type: integer, minimum: 1 }
        revision_number:
          type: integer
          format: int32
          minimum: 0
          description: >
            0-based regulated revision counter. REV{nn} = revision_number,
            zero-padded. ADR 0013.
        status: { type: string, enum: [draft, in_review, approved, published, obsolete] }
        docx_storage_key: { type: string, nullable: true }
