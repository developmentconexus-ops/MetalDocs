    PresenceStreamEvent:
      type: object
      description: >
        One frame on the presence WebSocket, discriminated by `type`. The `snapshot` frame
        carries the full `presence` array; delta frames (`join`/`leave`/`online`/`idle`) carry
        the changed user's `user_id`, `username`, `display_name`, `last_seen_at`, `status`;
        the `heartbeat` frame carries only `type`.
      required: [type]
      properties:
        type: { type: string, enum: [snapshot, join, leave, online, idle, heartbeat] }
        user_id: { type: string }
        username: { type: string }
        display_name: { type: string }
        last_seen_at:
          type: string
          format: date-time
        status: { type: string, enum: [online, idle] }
        presence:
          type: array
          items: { $ref: '#/components/schemas/PresenceStreamItem' }
