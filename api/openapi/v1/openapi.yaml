      description: |
        Returns feature flag values read from server environment at startup.
        Consumed by the frontend at app init to configure per-user rollout gates.
        Response is not user-specific and may be cached client-side for the
        duration of the session; the server sets Cache-Control: no-store.
      operationId: getFeatureFlags
      tags:
        - configuration
      responses:
        '200':
          description: Current feature flag values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagsResponse'
        '405':
          description: Method not allowed
      security: []
