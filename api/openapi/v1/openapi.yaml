  /api/v1/documents/{id}/session/acquire:
    post:
      tags: [documents]
      operationId: acquireDocumentSession
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201':
          description: writer acquired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSessionWriterResponse'
        '200':
          description: readonly (another user holds session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSessionReadonlyResponse'
  /api/v1/documents/{id}/session/heartbeat:
    post:
      tags: [documents]
      operationId: heartbeatDocumentSession
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ok }, '409': { description: session_inactive } }
  /api/v1/documents/{id}/session/release:
    post:
      tags: [documents]
      operationId: releaseDocumentSession
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ok } }
  /api/v1/documents/{id}/session/force-release:
    post:
      tags: [documents]
      operationId: forceReleaseDocumentSession
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ok }, '403': { description: forbidden } }

  /api/v1/documents/{id}/autosave/presign:
    post:
      tags: [documents]
      operationId: presignDocumentAutosave
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, base_revision_id, content_hash]
              properties:
                session_id: { type: string, format: uuid }
                base_revision_id: { type: string, format: uuid }
                content_hash: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: presigned url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAutosavePresignResponse'
        '409': { description: session_inactive | session_not_holder | stale_base }
  /api/v1/documents/{id}/autosave/commit:
    post:
      tags: [documents]
      operationId: commitDocumentAutosave
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, pending_upload_id]
              properties:
                session_id: { type: string, format: uuid }
                pending_upload_id: { type: string, format: uuid }
                form_data_snapshot:
                  type: object
                  additionalProperties: true
                page_count: { type: integer, minimum: 1, nullable: true }
              # NOTE: content_hash is NOT a request field. The server streams
              # S3 -> SHA256 and compares to the expected hash captured at
              # presign time. Client cannot forge the hash.
      responses:
        '200':
          description: revision committed or idempotent replay
          content:
            application/json:
              schema:
                type: object
                required: [revision_id, revision_num]
                properties:
                  revision_id: { type: string, format: uuid }
                  revision_num: { type: integer, minimum: 1 }
                  idempotent_replay: { type: boolean }
                  file_size_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
                  page_count: { type: integer, minimum: 1, nullable: true }
                  page_count_source:
                    type: string
                    nullable: true
                    enum: [eigenpal_client, server_renderer]
        '403': { description: session_not_holder | document_not_owner }
        '404': { description: pending_not_found }
        '409': { description: misbound | session_inactive | stale_base }
        '410': { description: expired_upload | upload_missing }
        '422': { description: content_hash_mismatch }

  /api/v1/documents/{id}/checkpoints:
