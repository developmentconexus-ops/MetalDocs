openapi: 3.0.3
info:
  title: MetalDocs API
  version: 1.0.0
  description: >
    API inicial do MetalDocs (v1). Escopo atual sem integracao com IA.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      summary: Liveness check
      responses:
        '200':
          description: API em execucao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Dependencias prontas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Dependencias indisponiveis ou degradadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: HTTP RED metrics por rota
      responses:
        '200':
          description: Metricas de requests, erros e duracao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      summary: Autentica usuario local e cria sessao por cookie
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Sessao criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      summary: Revoga a sessao atual
      tags: [auth]
      operationId: logout
      responses:
        '204':
          description: Sessao encerrada
  /auth/me:
    get:
      summary: Retorna o usuario autenticado atual
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Usuario atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/change-password:
    post:
      summary: Troca a senha do usuario autenticado
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users:
    get:
      summary: List tenant users (cursor-paginated, filterable)
      tags: [iam]
      operationId: listUsers
      parameters:
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: areaCode
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: Free-text search across displayName, username, email
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Cria usuario interno com credencial local inicial (legacy; prefer POST /iam/users/invite)
      tags: [iam]
      operationId: createManagedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedUserRequest'
      responses:
        '201':
          description: Usuario criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateManagedUserResponse'
  /iam/users/{userId}:
    patch:
      summary: Atomic metadata + tenant role update (single tx)
      tags: [iam]
      operationId: patchUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagedUserRequest'
      responses:
        '200':
          description: Usuario atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserCore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{userId}/reset-password:
    post:
      summary: Admin password reset (forces must-change-on-first-login)
      tags: [iam]
      operationId: resetPassword
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetManagedUserPasswordRequest'
      responses:
        '200':
          description: Senha resetada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetManagedUserPasswordResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{userId}/unlock:
    post:
      summary: Clear operational lock + failed-login counter for a user
      tags: [iam]
      operationId: unlockUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario desbloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockManagedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/admin/overview:
    get:
      summary: Composed Admin Center overview (KPI strip + presence + recent activity)
      tags: [iam]
      operationId: getIamAdminOverview
      responses:
        '200':
          description: Resumo administrativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/invite:
    post:
      summary: Invite a new user (server-generated temp password, must change on first login)
      tags: [iam]
      operationId: inviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteRequest'
      responses:
        '201':
          description: Usuario convidado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInviteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/bulk:
    post:
      summary: Bulk action over a set of users (activate, deactivate, unlock, force-logout)
      tags: [iam]
      operationId: bulkUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBulkActionRequest'
      responses:
        '200':
          description: Resultado da acao em lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBulkActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{userId}/memberships:
    get:
      summary: List area memberships for a user
      tags: [iam]
      operationId: listMemberships
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Lista de memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMembershipsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/roles:
    get:
      summary: List canonical tenant roles (read-only)
      tags: [iam]
      operationId: listRoles
      responses:
        '200':
          description: Lista de roles canonicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/capabilities:
    get:
      summary: List capability registry (read-only)
      tags: [iam]
      operationId: listCapabilities
      responses:
        '200':
          description: Lista de capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/role-capabilities:
    get:
      summary: List role-capability matrix rows (read-only)
      tags: [iam]
      operationId: listRoleCapabilities
      responses:
        '200':
          description: Matriz role x capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRoleCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/kpi:
    get:
      summary: Tenant KPI snapshot for the Overview strip
      tags: [iam]
      operationId: getKpi
      responses:
        '200':
          description: Snapshot de KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IamKpiSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/usage:
    get:
      summary: Tenant consumption snapshot (seats, storage, API, active users)
      tags: [iam]
      operationId: getUsage
      responses:
        '200':
          description: Snapshot de consumo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/presence/snapshot:
    get:
      summary: Online presence snapshot (HTTP fallback when WebSocket unavailable)
      tags: [iam]
      operationId: getPresenceSnapshot
      responses:
        '200':
          description: Snapshot de presenca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/events/export:
    post:
      summary: Export filtered audit events as CSV or JSONL (signed URL, async if large)
      tags: [audit]
      operationId: exportAuditEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditExportRequest'
      responses:
        '202':
          description: Exportacao agendada (assinada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/events/export/{exportId}:
    get:
      summary: Read the status of an audit export job
      tags: [audit]
      operationId: getAuditExportStatus
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status atual da exportacao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditExportStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/events/export/{exportId}/download:
    get:
      summary: Download the rendered audit export payload via a signed token
      tags: [audit]
      operationId: downloadAuditExport
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Conteudo binario da exportacao (CSV ou JSONL)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/sessions:
    get:
      summary: List active sessions in the current tenant
      tags: [iam]
      operationId: listSessions
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string }
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Lista de sessoes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/sessions/{sessionId}:
    delete:
      summary: Revoke (force-logout) a specific session. Gate CapSessionManage.
      tags: [iam]
      operationId: revokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Sessao revogada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /security/mfa-coverage:
    get:
      summary: MFA enrollment coverage by tenant + by role
      tags: [security]
      operationId: getMfaCoverage
      responses:
        '200':
          description: Cobertura de MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaCoverage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /security/lockouts:
    get:
      summary: Current account lockouts (locked-until window)
      tags: [security]
      operationId: listLockouts
      responses:
        '200':
          description: Lista de lockouts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLockoutsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /security/signals:
    get:
      summary: Anomaly cards (repeated-failed-login, new-device-login, lockout-spike, off-hours-admin-action)
      tags: [security]
      operationId: listSecuritySignals
      responses:
        '200':
          description: Sinais de seguranca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecuritySignalsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /audit/events:
    get:
      summary: Lista eventos de auditoria append-only (multi-axis filter, cursor-paginated)
      tags: [audit]
      operationId: listAuditEvents
      parameters:
        - name: actorId
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: resourceType
          in: query
          required: false
          schema: { type: string }
        - name: resourceId
          in: query
          required: false
          schema: { type: string }
        - name: occurredAfter
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: occurredBefore
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: q
          in: query
          required: false
          description: Free-text search on action / payload summary
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Lista de eventos de auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /search/documents:
    get:
      summary: Pesquisa documentos por filtros
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
        - name: documentType
          in: query
          required: false
          schema:
            type: string
            enum: [po, it, rg]
        - name: documentProfile
          in: query
          required: false
          schema:
            type: string
        - name: documentFamily
          in: query
          required: false
          schema:
            type: string
        - name: processArea
          in: query
          required: false
          schema:
            type: string
        - name: department
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: expiryBefore
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: expiryAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista filtrada de documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDocumentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/users/{userId}/roles:
    post:
      summary: Cria/atualiza usuario IAM e atribui role
      tags: [iam]
      operationId: upsertUserRole
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertUserRoleRequest'
      responses:
        '200':
          description: Role atribuida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertUserRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Reconcilia o conjunto de roles de um usuario interno
      tags: [iam]
      operationId: replaceUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserRolesRequest'
      responses:
        '200':
          description: Roles reconciliadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceUserRolesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/area-memberships:
    get:
      summary: List active area memberships for the current tenant
      tags: [iam]
      operationId: listAreaMemberships
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string }
          description: >-
            Filter by target userId. System admins omitting userId receive the
            full tenant directory; non-admins are always scoped to their own
            memberships regardless of this value.
        - name: areaCode
          in: query
          required: false
          schema: { type: string }
          description: Optional exact-match filter on the process area code.
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UserRole' }
          description: Optional exact-match filter on the membership role.
      responses:
        '200':
          description: Active memberships for the current tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaMembershipListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
