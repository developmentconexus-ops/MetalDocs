        '403':
          description: Sem permissao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /document-profiles/{profileCode}/template/docx:
    get:
      deprecated: true
      summary: "[DEPRECATED] Template DOCX rendering removed â€” use content builder"
      parameters:
        - name: profileCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '501':
          description: Template rendering removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    put:
      summary: Atualiza governanca ativa de um profile
      parameters:
        - name: profileCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentProfileGovernanceUpdateRequest'
      responses:
