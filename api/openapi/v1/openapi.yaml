      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Governance reason recorded with deactivation event.
    RouteResponse:
      type: object
      additionalProperties: true
      required: [route_id]
      properties:
        route_id: { type: string, format: uuid }
        new_version:
          type: integer
          minimum: 1
          description: New route version after a successful update. Omitted for create/deactivate.
    RouteSummary:
      type: object
      additionalProperties: true
      required: [id, name, tenant_id, profile_code, active, version, stages, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenant_id: { type: string, format: uuid }
        profile_code: { type: string }
        active: { type: boolean }
        version:
          type: integer
          minimum: 1
          description: Monotonic version bumped on each update or deactivation.
        stages:
          type: array
          items: { $ref: '#/components/schemas/StageSummary' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ListRoutesResponse:
      type: object
      additionalProperties: true
      required: [routes, total]
      properties:
        routes:
          type: array
          items: { $ref: '#/components/schemas/RouteSummary' }
        total: { type: integer, minimum: 0 }
