        meta:
          type: object
          required: [limit, offset]
          properties:
            limit: { type: integer }
            offset: { type: integer }
    TemplateVersionRef:
      type: object
      description: >
        Compact reference to a template version: internal version counter,
        regulated revision number (REV{nn}, ADR 0013), and lifecycle status.
        ADR 0065 — version pointers are nested value objects, never parallel
        scalars.
      required: [id, number, revision_number, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        revision_number: { type: integer, format: int32, minimum: 0 }
        status: { type: string, enum: [draft, under_review, approved, published, obsolete] }
    TemplateDTO:
      type: object
      # ADR 0065: version pointers are nested value objects. published_version
      # is required-and-nullable (present-and-null, never absent) — consumers
      # gate template clonability on this single object; the 9f86828b
      # null-serialization guarantee carries forward.
      required: [id, tenant_id, doc_type_code, key, name, latest_version,
                 published_version, created_by, created_at, archived_at,
                 description, created_by_display_name, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        doc_type_code: { type: string, nullable: true }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        latest_version:
          $ref: '#/components/schemas/TemplateVersionRef'
        published_version:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TemplateVersionRef'
        created_by: { type: string }
        created_by_display_name:
          type: string
          nullable: true
          description: >
            Display name for created_by, resolved via the iam-owned
            UserDisplayNameReader port (M4/F4.1). Omitted/null when the user
            has no resolvable display name; callers fall back to created_by
            (the raw user id). FE-08.
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Last-modified timestamp for the template row. Nullable only for
            wire-compatibility with historical rows created before this field
            existed (db/migrations/0267_templates_template_updated_at.sql
            backfills all existing rows to created_at, so in practice this is
            always present going forward). FE-08.
        archived_at: { type: string, format: date-time, nullable: true }
    VersionDTO:
      type: object
      required: [id, template_id, version_number, status, author_id, created_at,
                 docx_storage_key, content_hash, metadata_schema, placeholder_schema,
                 reviewer_id, approver_id,
                 submitted_at, reviewed_at, approved_at, published_at, obsoleted_at]
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        revision_number:
          type: integer
          format: int32
          minimum: 0
          description: >
            0-based regulated revision counter. REV{nn} = revision_number,
            zero-padded. ADR 0013.
        status: { type: string, enum: [draft, under_review, approved, published, obsolete] }
        docx_storage_key: { type: string, nullable: true }
        content_hash: { type: string, nullable: true }
        metadata_schema: { type: object, nullable: true, additionalProperties: true }
        placeholder_schema:
          type: array
          nullable: true
          items: { type: object, additionalProperties: true }
          description: >
            Ordered placeholder list. Matches `domain.TemplateVersion.PlaceholderSchema`
            ([]Placeholder). Backend always emits as array; ADR 0035 declared shape
            corrected from `object` 2026-06-15 (F1.2).
        author_id: { type: string }
        reviewer_id: { type: string, nullable: true }
        approver_id: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        obsoleted_at: { type: string, format: date-time, nullable: true }
        lock_version:
          type: integer
          format: int32
          minimum: 0
          description: >
            Optimistic-concurrency token. Increments on every successful write
            to the version row. Clients must echo the last-seen value back via
            `expected_lock_version` on PUT .../schema. A
            mismatch yields HTTP 412 with code `stale_lock_version`.
        created_at: { type: string, format: date-time }
