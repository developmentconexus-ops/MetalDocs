paths:
  /api/v1/templates/system/blank:
    get:
      summary: Get system-owned blank template
      tags: [templates]
      operationId: getSystemBlankTemplate
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemBlankTemplateResponse'
        '404': { description: not_found }
  /api/v1/templates:
    get:
      summary: List templates for tenant (docx)
      tags: [templates]
      operationId: listTemplates
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateDTO'
        '403': { description: forbidden }
    post:
      summary: Create template (docx)
      tags: [templates]
      operationId: createTemplate
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: { type: string }
                name: { type: string }
                description: { type: string }
                doc_type_code: { type: string, description: "Profile code (e.g. DC, POP). Omit or null for generic templates." }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTemplateResponse'
  /api/v1/templates/{id}/versions/{n}:
    get:
      summary: Get template version metadata (docx)
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: n, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok }
        '404': { description: not_found }
  /api/v1/templates/placeholder-catalog:
    get:
      summary: List supported template placeholder catalog entries
      tags: [templates]
      operationId: listTemplatePlaceholderCatalog
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceholderCatalogResponse'
  /api/v1/templates/{id}/versions/{n}/docx-upload-url:
    post:
      summary: Presign PUT URL for draft .docx upload
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: n, required: true, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  storage_key: { type: string }
  /api/v1/templates/{id}/versions/{n}/schema-upload-url:
    post:
      summary: Presign PUT URL for draft schema.json upload
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: n, required: true, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  storage_key: { type: string }
  /api/v1/signed:
    get:
      summary: Redirect to presigned GET URL for a stored object
      tags: [templates]
      parameters:
        - { in: query, name: key, required: true, schema: { type: string } }
      responses:
        '302': { description: redirect }
  /api/v1/templates/{id}/versions/{n}/draft:
    put:
      summary: Save draft (CAS via expected_lock_version)
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: n, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_lock_version, docx_storage_key, schema_storage_key, docx_content_hash, schema_content_hash]
              properties:
                expected_lock_version: { type: integer }
                docx_storage_key: { type: string }
                schema_storage_key: { type: string }
                docx_content_hash: { type: string }
                schema_content_hash: { type: string }
      responses:
        '204': { description: ok }
        '409': { description: template_draft_stale }
  /api/v1/templates/{id}/versions/{n}/publish:
    post:
      summary: Publish draft (delegates to docgen-v2 /validate/template)
      tags: [templates]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: n, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docx_key, schema_key]
              properties:
                docx_key: { type: string }
                schema_key: { type: string }
      responses:
        '200':
          description: published + next draft created
          content:
            application/json:
              schema:
                type: object
                required: [published_version_id, next_draft_id, next_draft_version_num]
                properties:
                  published_version_id: { type: string }
                  next_draft_id: { type: string }
                  next_draft_version_num: { type: integer }
        '422':
          description: template invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  parse_errors: { type: array, items: { type: object } }
                  missing_tokens: { type: array, items: { type: string } }
                  orphan_tokens: { type: array, items: { type: string } }

components:
  schemas:
    SystemBlankTemplateResponse:
      type: object
      required: [templateId, templateVersionId, name]
      properties:
        templateId: { type: string, format: uuid }
        templateVersionId: { type: string, format: uuid }
        name: { type: string }
    TemplateDTO:
      type: object
      required: [id, tenant_id, key, name, latest_version, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        doc_type_code: { type: string, nullable: true }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        latest_version: { type: integer, minimum: 1 }
        published_version_id: { type: string, format: uuid, nullable: true }
        published_version_number: { type: integer, nullable: true, minimum: 1 }
        current_revision_number:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: >
            Regulated revision number of the currently published template version.
            0-based (REV00, REV01, ...). Null when the template has never been
            published. ADR 0013.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
    VersionDTO:
      type: object
      required: [id, template_id, version_number, status, author_id, created_at]
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        revision_number:
          type: integer
          format: int32
          minimum: 0
          description: >
            0-based regulated revision counter. REV{nn} = revision_number,
            zero-padded. ADR 0013.
        status: { type: string, enum: [draft, in_review, approved, published, obsolete] }
        docx_storage_key: { type: string, nullable: true }
        content_hash: { type: string, nullable: true }
        metadata_schema: { type: object, nullable: true, additionalProperties: true }
        placeholder_schema: { type: object, nullable: true, additionalProperties: true }
        author_id: { type: string }
        pending_reviewer_role: { type: string, nullable: true }
        pending_approver_role: { type: string, nullable: true }
        reviewer_id: { type: string, nullable: true }
        approver_id: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        obsoleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreateTemplateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [template, version]
          properties:
            template:
              $ref: '#/components/schemas/TemplateDTO'
            version:
              $ref: '#/components/schemas/VersionDTO'
    PlaceholderCatalogEntry:
      type: object
      required: [key, label, description]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
    PlaceholderCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceholderCatalogEntry'
