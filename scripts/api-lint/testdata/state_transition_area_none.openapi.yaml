openapi: 3.0.3
info:
  title: transition-area-none
  version: 1.0.0
paths:
  /widgets/{id}/archive:
    post:
      operationId: archiveWidget
      security:
        - sessionCookie: []
      x-authz-area-none: 'Widgets are tenant-global; tier-1 capability-gated, no per-area scope.'
      responses:
        '204':
          description: done
        '403':
          description: denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: md_session
  schemas:
    Problem:
      type: object
      properties:
        title:
          type: string
