openapi: 3.0.3
info:
  title: transition-area-tx
  version: 1.0.0
paths:
  /widgets/{id}/publish:
    post:
      operationId: publishWidget
      security:
        - sessionCookie: []
      x-authz-area:
        source: tx
        derived_from: 'widgets.process_area_code'
      responses:
        '204':
          description: done
        '403':
          description: denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: md_session
  schemas:
    Problem:
      type: object
      properties:
        title:
          type: string
