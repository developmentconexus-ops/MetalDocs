openapi: 3.0.3
info:
  title: good
  version: 1.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWidgetsResponse'
        '400':
          description: bad
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /widgets/{id}/publish:
    post:
      operationId: publishWidget
      security:
        - bearerAuth: []
      x-authz-area:
        source: path
        field: id
      responses:
        '204':
          description: done
        '403':
          description: forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
    Page:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    ListWidgetsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        page:
          $ref: '#/components/schemas/Page'
