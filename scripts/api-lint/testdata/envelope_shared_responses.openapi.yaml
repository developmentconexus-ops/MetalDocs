openapi: 3.0.3
info:
  title: envelope-shared-responses
  version: 1.0.0
# Phase D ENVELOPE-DRIFT coverage: every error response here is compliant, so the
# rule must report ZERO. It exercises the four non-inline-Problem paths the rule
# learned to accept: a $ref into components/responses (shared Problem), a
# description-only response, an x-error-envelope-exempt bespoke body, and a
# health-probe 503 that returns its health document rather than RFC 9457.
paths:
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object }
        '503':
          description: degraded
          content:
            application/json:
              schema: { type: object }
  /widgets/{id}:
    get:
      operationId: getWidget
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          description: method not allowed
        '422':
          description: bespoke validation result, not RFC 9457
          x-error-envelope-exempt: "legacy domain payload; Problem migration tracked separately"
          content:
            application/json:
              schema: { type: object }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
