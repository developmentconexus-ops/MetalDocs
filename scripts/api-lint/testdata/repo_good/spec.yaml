openapi: 3.0.3
info:
  title: repo
  version: 1.0.0
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
        '404':
          description: missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        title:
          type: string
