<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Catálogo de Slots · MetalDocs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../styles.css"/>
<style>html,body,#root{height:100%;margin:0;overflow:hidden;}</style>
</head>
<body class="palette-wine">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shell.jsx"></script>
<script type="text/babel" src="../screens-2.jsx"></script>
<script type="text/babel" src="../selected-library.jsx"></script>
<script type="text/babel" src="../selected-editor-v2.jsx"></script>
<script type="text/babel" src="../selected-wizard.jsx"></script>
<script type="text/babel" src="../selected-wizard-v2.jsx"></script>
<script type="text/babel">

const { Sidebar, Rail, Toolbar } = window.MD;
const FrameFull = ({ active = 'library', breadcrumb, children }) => (
  <div style={{ width: '100%', height: '100%', display: 'flex', background: 'var(--surface)', overflow: 'hidden' }}>
    <Sidebar section="documents" active={active}/>
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
      <Toolbar breadcrumb={breadcrumb}/>{children}
    </div>
  </div>
);
const FrameRail = ({ section = 'documents', breadcrumb, children, hideToolbar }) => (
  <div style={{ width: '100%', height: '100%', display: 'flex', background: 'var(--surface)', overflow: 'hidden' }}>
    <Rail section={section}/>
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
      {!hideToolbar && <Toolbar breadcrumb={breadcrumb}/>}{children}
    </div>
  </div>
);
const { SelectedLibrary } = window.MD_LIB_SELECTED;
const { SelectedEditorV2 } = window.MD_EDITOR_V2;
const { WizardStep1, WizardStep3, WizardStep4 } = window.MD_WIZARD;
const { WizardStep2V2 } = window.MD_WIZARD_V2;
const { Login, Templates, Registry } = window.MD_SCREENS_2;

ReactDOM.createRoot(document.getElementById('root')).render(<FrameRail section="registry" breadcrumb={['Registro']}><Registry/></FrameRail>);
</script>
</body></html>
