<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>MetalDocs — Template Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
/* =========================================================
   MetalDocs Template Editor — Swiss / Minimal
   Padding rhythm: 4 / 8 / 12 / 16 / 20 / 24 only
   ========================================================= */

:root {
  --brand: #6b1f2a;
  --brand-weak: #f3e6e8;
  --brand-ink: #4a1720;
  --blue: #2563eb;
  --blue-hover: #1d4fd8;
  --amber: #b45309;
  --amber-bg: #fef3c7;
  --green: #15803d;

  --bg: #f8fafc;
  --surface: #ffffff;
  --ink: #1e293b;
  --ink-2: #334155;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --border: #e5e7eb;
  --border-2: #eef1f4;
  --hover: #f1f5f9;
  --active: #e2e8f0;

  --brand-tint: rgba(107, 31, 42, 0.08);
  --brand-tint-2: rgba(107, 31, 42, 0.14);

  --topbar-h: 44px;
  --rail-w: 48px;
  --rail-w-expanded: 280px;
  --doc-w: 800px;

  --radius: 6px;
  --radius-lg: 8px;

  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-doc: "Source Serif Pro", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink);
  background: #eef1f4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; cursor: pointer; }

/* ---------- Viewport switcher (variant selector) ---------- */
.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  gap: 16px;
}
.stage-head {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 1440px;
}
.stage-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.stage-title .dot {
  width: 14px;
  height: 14px;
  background: var(--brand);
  display: inline-block;
}
.stage-title .sep { color: var(--muted-2); font-weight: 400; }
.stage-title .sub { color: var(--muted); font-weight: 400; }

.stage-variants {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-left: auto;
}
.stage-variants button {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  border-radius: 5px;
  transition: all 150ms ease;
}
.stage-variants button:hover { color: var(--ink); background: var(--hover); }
.stage-variants button.is-active {
  background: var(--ink);
  color: #fff;
}

.stage-meta {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--font-mono);
}

/* ---------- App frame ---------- */
.app {
  width: 1440px;
  height: 900px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: grid;
  grid-template-rows: var(--topbar-h) 1fr;
  font-size: 13px;
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.03);
}

/* =========================================================
   TOPBAR
   ========================================================= */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: var(--topbar-h);
}
.topbar-left, .topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.topbar-right { margin-left: auto; gap: 12px; }

.brand-dot {
  width: 24px;
  height: 24px;
  background: var(--brand);
  display: grid;
  place-items: center;
  color: #fff;
}
.brand-name {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin-right: 4px;
}
.icon-btn {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  border-radius: 5px;
  color: var(--ink-2);
  transition: background 150ms ease, color 150ms ease;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn.is-active { background: var(--active); color: var(--ink); }

.divider-v {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 4px;
}

.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  min-width: 0;
}
.crumbs .sep { color: var(--muted-2); }
.crumbs .current {
  color: var(--ink);
  font-weight: 500;
}
.version-badge {
  font-size: 10.5px;
  font-family: var(--font-mono);
  font-weight: 500;
  padding: 2px 6px;
  background: var(--hover);
  color: var(--muted);
  border-radius: 4px;
  letter-spacing: 0.02em;
}
.status-pill {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.status-pill.draft { background: var(--amber-bg); color: var(--amber); }

.saved-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
}
.saved-indicator .check {
  width: 14px;
  height: 14px;
  color: var(--green);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  background: var(--blue);
  color: #fff;
  border: 0;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.005em;
  transition: background 150ms ease;
}
.btn-primary:hover { background: var(--blue-hover); }

.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--brand);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: grid;
  place-items: center;
  letter-spacing: 0.02em;
}

/* =========================================================
   BODY GRID
   ========================================================= */
.body {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr var(--rail-w);
  min-height: 0;
  transition: grid-template-columns 220ms ease;
}
.body.blocks-open { grid-template-columns: var(--rail-w-expanded) 1fr var(--rail-w); }
.body.inspector-open { grid-template-columns: var(--rail-w) 1fr var(--rail-w-expanded); }

/* ---------- Rails ---------- */
.rail {
  background: var(--surface);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.rail-left { border-right: 1px solid var(--border); }
.rail-right { border-left: 1px solid var(--border); }

.rail-icons {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 2px;
  width: var(--rail-w);
  flex-shrink: 0;
}
.rail-icon-btn {
  position: relative;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: var(--ink-2);
  transition: background 150ms ease, color 150ms ease;
}
.rail-icon-btn:hover { background: var(--hover); color: var(--ink); }
.rail-icon-btn.is-active {
  background: var(--brand-tint);
  color: var(--brand);
}
.rail-icon-btn.is-active::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--brand);
  border-radius: 0 2px 2px 0;
}
.rail-right .rail-icon-btn.is-active::before {
  left: auto;
  right: -8px;
  border-radius: 2px 0 0 2px;
}
.rail-divider {
  width: 20px;
  height: 1px;
  background: var(--border);
  margin: 6px 0;
}

/* Tooltips */
.rail-icon-btn .tip {
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  background: var(--ink);
  color: #fff;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms ease;
  z-index: 30;
}
.rail-right .rail-icon-btn .tip { left: auto; right: calc(100% + 10px); }
.rail-icon-btn:hover .tip { opacity: 1; }
.rail-icon-btn .tip .kbd {
  margin-left: 6px;
  padding: 1px 4px;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
}

/* Expanded rail panels */
.rail-panel {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--surface);
}
.rail-right .rail-panel { border-left: 0; border-right: 1px solid var(--border); order: -1; }

.rail-panel-head {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  height: 44px;
  gap: 8px;
}
.rail-panel-head h3 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink);
  text-transform: uppercase;
}
.rail-panel-head .close {
  margin-left: auto;
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 4px;
}
.rail-panel-head .close:hover { background: var(--hover); color: var(--ink); }

.rail-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

/* =========================================================
   CENTER CANVAS
   ========================================================= */
.canvas {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--surface);
}

/* Doc head bar */
.dochead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  flex-shrink: 0;
}
.dochead .left {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
  font-weight: 500;
}
.dochead .left .sep { color: var(--muted-2); font-weight: 400; }
.dochead .left .meta { color: var(--muted); font-weight: 400; }
.dochead .right {
  color: var(--muted);
  font-size: 11.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dochead .right .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--muted-2);
}

/* Toolbar — wraps never scrolls */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 6px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
}
.toolbar-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 6px;
}
.tb-btn {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  border-radius: 4px;
  color: var(--ink-2);
  transition: background 150ms ease, color 150ms ease;
}
.tb-btn:hover { background: var(--hover); color: var(--ink); }
.tb-btn.is-active { background: var(--active); color: var(--ink); }
.tb-btn:disabled { color: var(--muted-2); cursor: not-allowed; }
.tb-btn:disabled:hover { background: transparent; color: var(--muted-2); }

.tb-select {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 26px;
  padding: 0 6px 0 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  transition: border-color 150ms ease;
}
.tb-select:hover { border-color: #cbd5e1; }
.tb-select .chev { color: var(--muted); }

.tb-color {
  position: relative;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  border-radius: 4px;
  color: var(--ink-2);
}
.tb-color:hover { background: var(--hover); }
.tb-color .swatch {
  position: absolute;
  bottom: 4px;
  left: 5px;
  right: 5px;
  height: 3px;
  border-radius: 1px;
}

/* ---------- Scroll region (ONLY scroll on screen) ---------- */
.canvas-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  padding: 40px 0 80px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 0;
}

/* Custom wine scrollbar */
.canvas-scroll::-webkit-scrollbar { width: 10px; }
.canvas-scroll::-webkit-scrollbar-track { background: transparent; }
.canvas-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #b05866 0%, #6b1f2a 100%);
  border-radius: 10px;
  border: 2px solid var(--bg);
}
.canvas-scroll::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #c16672 0%, #7a2431 100%);
  border: 2px solid var(--bg);
}
.canvas-scroll { scrollbar-width: thin; scrollbar-color: var(--brand) transparent; }

.page {
  width: var(--doc-w);
  min-height: 1036px; /* A4-ish ratio */
  background: #fff;
  padding: 80px 72px;
  box-shadow:
    0 1px 2px rgba(15, 23, 42, 0.04),
    0 8px 24px rgba(15, 23, 42, 0.06);
  font-family: var(--font-doc);
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink);
  border-radius: 2px;
}
.page h1 {
  margin: 0 0 20px;
  font-family: var(--font-doc);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: #0f172a;
}
.page h2 {
  margin: 24px 0 12px;
  font-family: var(--font-doc);
  font-size: 20px;
  font-weight: 600;
  color: #0f172a;
}
.page p { margin: 0 0 16px; }
.page p.muted {
  color: var(--muted-2);
  font-style: italic;
}
.page p .bold { font-weight: 700; }

/* Caret (resting) */
.caret {
  display: inline-block;
  width: 1px;
  height: 1.1em;
  background: var(--ink);
  vertical-align: text-bottom;
  margin-left: 1px;
  animation: caret 1.1s steps(2) infinite;
}
@keyframes caret { 50% { opacity: 0; } }

/* ---------- Empty state page ---------- */
.empty-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  min-height: 720px;
  color: var(--muted);
  text-align: center;
}
.empty-page .empty-icon {
  width: 48px;
  height: 48px;
  border: 1.5px dashed #cbd5e1;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: var(--muted-2);
}
.empty-page h2 {
  font-family: var(--font-doc);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink-2);
  margin: 0;
}
.empty-page p {
  color: var(--muted);
  margin: 0;
  max-width: 42ch;
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.55;
}
.empty-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 500;
  transition: all 150ms ease;
  margin-top: 4px;
}
.empty-cta:hover { background: var(--hover); border-color: #cbd5e1; }
.empty-cta .arrow {
  color: var(--brand);
  animation: nudge 2s ease-in-out infinite;
}
@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-4px); }
}

/* =========================================================
   BLOCKS LIBRARY PANEL
   ========================================================= */
.blocks-search {
  position: relative;
  margin-bottom: 16px;
}
.blocks-search input {
  width: 100%;
  height: 28px;
  padding: 0 8px 0 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
  transition: border-color 150ms ease;
}
.blocks-search input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}
.blocks-search .ic {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}

.block-section {
  margin-bottom: 20px;
}
.block-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.block-section-head h4 {
  margin: 0;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.block-section-head .count {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--muted-2);
}
.block-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.block-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  cursor: grab;
  transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 92px;
}
.block-card:hover {
  border-color: var(--brand);
  box-shadow: 0 2px 8px rgba(107,31,42,0.08);
}
.block-card:active { cursor: grabbing; transform: translateY(1px); }
.block-card .preview {
  height: 36px;
  background: var(--bg);
  border-radius: 4px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.block-card .label {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
}
.block-card .meta {
  font-size: 10px;
  color: var(--muted);
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}

/* =========================================================
   INSPECTOR PANEL
   ========================================================= */
.inspector-selection {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.inspector-selection .chip {
  width: 20px;
  height: 20px;
  background: var(--brand);
  color: #fff;
  border-radius: 4px;
  display: grid;
  place-items: center;
}
.inspector-selection .name {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
}
.inspector-selection .id {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
}

.ins-section {
  margin-bottom: 20px;
}
.ins-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.ins-section-head h4 {
  margin: 0;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.ins-section-head .reset {
  border: 0;
  background: transparent;
  color: var(--muted-2);
  font-size: 10.5px;
}
.ins-section-head .reset:hover { color: var(--ink); }

.ins-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.ins-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ins-field label {
  font-size: 10.5px;
  color: var(--muted);
  font-weight: 500;
}
.ins-input-wrap {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  height: 26px;
  background: var(--surface);
  overflow: hidden;
}
.ins-input-wrap:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}
.ins-input-wrap .prefix {
  font-size: 11px;
  color: var(--muted-2);
  padding: 0 6px 0 8px;
}
.ins-input-wrap input {
  flex: 1;
  border: 0;
  background: transparent;
  font-family: inherit;
  font-size: 12px;
  color: var(--ink);
  padding: 0;
  min-width: 0;
  width: 100%;
}
.ins-input-wrap input:focus { outline: none; }
.ins-input-wrap .unit {
  font-size: 10.5px;
  color: var(--muted-2);
  padding: 0 8px 0 4px;
  font-family: var(--font-mono);
}

.swatch-row { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  position: relative;
  transition: transform 150ms ease;
}
.swatch:hover { transform: scale(1.08); }
.swatch.is-active::after {
  content: "";
  position: absolute;
  inset: -3px;
  border: 1.5px solid var(--blue);
  border-radius: 6px;
}

.stroke-pick {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  margin-bottom: 10px;
}
.stroke-opt {
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  transition: all 150ms ease;
}
.stroke-opt:hover { background: var(--hover); }
.stroke-opt.is-active {
  background: var(--active);
  border-color: #94a3b8;
}
.stroke-opt .line-solid {
  width: 32px; height: 0;
  border-top: 1.5px solid var(--ink);
}
.stroke-opt .line-dashed {
  width: 32px; height: 0;
  border-top: 1.5px dashed var(--ink);
}
.stroke-opt .line-double {
  width: 32px; height: 4px;
  border-top: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.slider-row input[type=range] {
  flex: 1;
  accent-color: var(--brand);
  height: 2px;
}
.slider-row .val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink);
  width: 32px;
  text-align: right;
}

/* Spacing diamond */
.spacing-box {
  position: relative;
  padding: 12px;
  border: 1px dashed #cbd5e1;
  border-radius: 6px;
  background: var(--bg);
  margin-top: 4px;
}
.spacing-inner {
  position: relative;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
}
.spacing-label {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  background: var(--bg);
  padding: 0 4px;
}
.spacing-input {
  width: 36px;
  height: 20px;
  padding: 0 4px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-align: center;
  color: var(--ink);
  background: var(--surface);
}
.spacing-input:focus {
  outline: none;
  border-color: var(--blue);
}

/* =========================================================
   SELECTED BLOCK IN DOC (inspector variant)
   ========================================================= */
.selected-block {
  position: relative;
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 2px;
}
.selected-block::before {
  content: "Header Block";
  position: absolute;
  top: -22px;
  left: -2px;
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 500;
  color: #fff;
  background: var(--blue);
  padding: 2px 6px;
  border-radius: 3px 3px 0 0;
  letter-spacing: 0.02em;
}

/* Handles */
.handle {
  position: absolute;
  width: 8px;
  height: 8px;
  background: #fff;
  border: 1.5px solid var(--blue);
  border-radius: 1px;
}
.handle.tl { top: -6px; left: -6px; }
.handle.tr { top: -6px; right: -6px; }
.handle.bl { bottom: -6px; left: -6px; }
.handle.br { bottom: -6px; right: -6px; }

/* =========================================================
   TWEAKS PANEL
   ========================================================= */
.tweaks {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
  font-size: 12px;
  z-index: 100;
  overflow: hidden;
}
.tweaks.hidden { display: none; }
.tweaks-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tweaks-head h5 {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.tweaks-head button {
  border: 0;
  background: transparent;
  padding: 2px 6px;
  color: var(--muted);
  border-radius: 4px;
  font-size: 11px;
}
.tweaks-head button:hover { background: var(--hover); color: var(--ink); }
.tweaks-body {
  padding: 12px;
  display: grid;
  gap: 12px;
}
.tweak-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  align-items: center;
  gap: 8px;
}
.tweak-row label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}
.tweak-row input[type=range] {
  width: 100%;
  accent-color: var(--brand);
}
.tweak-row .seg {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.tweak-row .seg button {
  flex: 1;
  padding: 4px 6px;
  border: 0;
  background: transparent;
  font-size: 10.5px;
  color: var(--muted);
  transition: all 150ms ease;
}
.tweak-row .seg button.is-active {
  background: var(--ink);
  color: #fff;
}
.tweak-color-row {
  display: flex;
  gap: 6px;
}
.tweak-color-row .dot {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
}
.tweak-color-row .dot.is-active {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}

/* =========================================================
   DARK MODE
   ========================================================= */
.app.dark {
  --brand: #c27884;
  --brand-weak: rgba(194,120,132,0.12);
  --brand-ink: #e7b3bc;
  --blue: #3b82f6;
  --blue-hover: #2563eb;
  --amber: #fbbf24;
  --amber-bg: rgba(251,191,36,0.15);
  --green: #4ade80;

  --bg: #0b0e13;
  --surface: #12161d;
  --ink: #e5e7eb;
  --ink-2: #cbd5e1;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --border: #1f2630;
  --border-2: #1a1f27;
  --hover: #1a1f27;
  --active: #242b36;

  --brand-tint: rgba(194,120,132,0.12);
  --brand-tint-2: rgba(194,120,132,0.2);
}
.app.dark .page {
  background: #0f141b;
  color: #e5e7eb;
  box-shadow:
    0 1px 2px rgba(0,0,0,0.4),
    0 8px 24px rgba(0,0,0,0.4);
}
.app.dark .page h1,
.app.dark .page h2 { color: #f1f5f9; }
.app.dark .brand-dot { background: #6b1f2a; }
.app.dark .avatar { background: #6b1f2a; }
.app.dark .status-pill.draft { background: rgba(251,191,36,0.15); color: #fbbf24; }
.app.dark .canvas-scroll::-webkit-scrollbar-thumb {
  border: 2px solid var(--bg);
}

</style>
</head>
