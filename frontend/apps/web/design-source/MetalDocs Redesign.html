<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>MetalDocs — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body, #root { height: 100%; margin: 0; }
  /* design canvas overrides */
  dc-canvas { background: #2a1418; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="library.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const { Sidebar, Toolbar } = window.MD;
const { LibraryA, LibraryB, LibraryC } = window.MD_LIBRARY;
const { Dashboard, DocumentDetail } = window.MD_OTHER;
const { CreateWizard, Registry, Templates, Login, SiteMap } = window.MD_SCREENS_2;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "wine",
  "density": "balanced"
}/*EDITMODE-END*/;

// Frame: shell + content
const Frame = ({ section = 'documents', active = 'library', breadcrumb, title, children, fullBleed = false }) => (
  <div style={{ width: '100%', height: '100%', display: 'flex', background: 'var(--surface)', overflow: 'hidden' }}>
    <Sidebar section={section} active={active}/>
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
      {!fullBleed && <Toolbar breadcrumb={breadcrumb} title={title}/>}
      {children}
    </div>
  </div>
);

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  // Apply palette globally to canvas + each artboard
  useEffect(() => {
    document.body.className = `palette-${tweaks.palette}`;
  }, [tweaks.palette]);

  const PaletteWrap = ({ palette, children }) => (
    <div className={`palette-${palette || tweaks.palette}`} style={{ width: '100%', height: '100%' }}>{children}</div>
  );

  return (
    <>
      <dc-canvas style={{ width: '100%', height: '100%' }}>
        {/* === SECTION 0: SITE MAP === */}
        <dc-section id="map" title="00 · Mapa do produto">
          <dc-artboard id="map-1" label="Arquitetura de telas" width={1280} height={820}>
            <PaletteWrap><SiteMap/></PaletteWrap>
          </dc-artboard>
        </dc-section>

        {/* === SECTION 1: HERO — Documents Library, 3 directions × 3 palettes === */}
        <dc-section id="hero" title="01 · Hero — Biblioteca de documentos (3 direções × 3 paletas)">
          <dc-artboard id="lib-a-wine" label="A · Tabela densa — Wine" width={1440} height={900}>
            <PaletteWrap palette="wine"><Frame breadcrumb={['Documentos', 'Biblioteca']}><LibraryA/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="lib-a-graph" label="A · Tabela densa — Graphite" width={1440} height={900}>
            <PaletteWrap palette="graphite"><Frame breadcrumb={['Documentos', 'Biblioteca']}><LibraryA/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="lib-a-bone" label="A · Tabela densa — Bone & Ink" width={1440} height={900}>
            <PaletteWrap palette="bone"><Frame breadcrumb={['Documentos', 'Biblioteca']}><LibraryA/></Frame></PaletteWrap>
          </dc-artboard>

          <dc-artboard id="lib-b-wine" label="B · Cards + atividade — Wine" width={1440} height={900}>
            <PaletteWrap palette="wine"><Frame breadcrumb={['Documentos', 'Início']}><LibraryB/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="lib-b-graph" label="B · Cards + atividade — Graphite" width={1440} height={900}>
            <PaletteWrap palette="graphite"><Frame breadcrumb={['Documentos', 'Início']}><LibraryB/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="lib-b-bone" label="B · Cards + atividade — Bone & Ink" width={1440} height={900}>
            <PaletteWrap palette="bone"><Frame breadcrumb={['Documentos', 'Início']}><LibraryB/></Frame></PaletteWrap>
          </dc-artboard>

          <dc-artboard id="lib-c-wine" label="C · Editorial — Wine" width={1440} height={900}>
            <PaletteWrap palette="wine"><Frame breadcrumb={['Documentos', 'Acervo']}><LibraryC/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="lib-c-graph" label="C · Editorial — Graphite" width={1440} height={900}>
            <PaletteWrap palette="graphite"><Frame breadcrumb={['Documentos', 'Acervo']}><LibraryC/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="lib-c-bone" label="C · Editorial — Bone & Ink" width={1440} height={900}>
            <PaletteWrap palette="bone"><Frame breadcrumb={['Documentos', 'Acervo']}><LibraryC/></Frame></PaletteWrap>
          </dc-artboard>
        </dc-section>

        {/* === SECTION 2: SUPPORTING SCREENS === */}
        <dc-section id="screens" title="02 · Telas de apoio (paleta atual)">
          <dc-artboard id="dashboard" label="Dashboard / Início" width={1440} height={900}>
            <PaletteWrap><Frame section="documents" active="home" breadcrumb={['Início']}><Dashboard/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="detail" label="Detalhe de documento" width={1440} height={920}>
            <PaletteWrap><Frame breadcrumb={['Documentos', 'RH', 'POP-RH-001']}><DocumentDetail/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="create" label="Wizard de criação" width={1440} height={900}>
            <PaletteWrap><Frame active="my-docs" breadcrumb={['Documentos', 'Novo']}><CreateWizard/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="registry" label="Documentos Controlados (registry)" width={1440} height={900}>
            <PaletteWrap><Frame section="documents" active="library" breadcrumb={['Registro']}><Registry/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="templates" label="Templates" width={1440} height={900}>
            <PaletteWrap><Frame section="documents" active="library" breadcrumb={['Templates']}><Templates/></Frame></PaletteWrap>
          </dc-artboard>
          <dc-artboard id="login" label="Login / SSO" width={1280} height={820}>
            <PaletteWrap><Login/></PaletteWrap>
          </dc-artboard>
        </dc-section>
      </dc-canvas>

      {/* Tweaks */}
      <window.TweaksPanel title="MetalDocs Tweaks">
        <window.TweakSection title="Paleta" subtitle="Aplica-se às telas da seção 02. Seção 01 mostra todas.">
          <window.TweakRadio
            value={tweaks.palette}
            onChange={v => setTweak('palette', v)}
            options={[
              { value: 'wine', label: 'Wine' },
              { value: 'graphite', label: 'Graphite' },
              { value: 'bone', label: 'Bone' },
            ]}
          />
        </window.TweakSection>
        <window.TweakSection title="Densidade" subtitle="Visual — não afeta o layout no protótipo">
          <window.TweakRadio
            value={tweaks.density}
            onChange={v => setTweak('density', v)}
            options={[
              { value: 'comfortable', label: 'Confortável' },
              { value: 'balanced', label: 'Balanceada' },
              { value: 'dense', label: 'Densa' },
            ]}
          />
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
