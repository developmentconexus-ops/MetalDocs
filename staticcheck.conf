# Staticcheck configuration.
#
# This mirrors staticcheck's built-in default check set and additionally
# disables ST1005 (error strings should not be capitalized): oapi-codegen emits
# capitalized error strings throughout the generated *api.gen.go files (and a
# couple of hand-written spots), and this purely-stylistic check is not worth
# churning generated code over. Every other default check stays on — including
# U1000 (unused code) and the SA* correctness checks.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1005"]
