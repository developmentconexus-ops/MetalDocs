# gitleaks config — extends the default ruleset with project allowlists.
# Disposition recorded in Wave 0 item 0.2 (F-18); allowlist rationale revisited
# in the round-2 review. NOTE: gitleaks v8.24.3 honors the SINGULAR [allowlist]
# table only — the plural [[allowlists]] (with per-block `condition = "AND"`)
# form is silently ignored on this version, so path+regex scoping is OR-only.
title = "MetalDocs secret-scan config"

[extend]
useDefault = true

[allowlist]
description = "Assessed non-secrets (Wave 0 item 0.2)"
paths = [
    # Go test fixtures (named test* constants, fake S3 keys) — entropy noise.
    '''.*_test\.go$''',
    # oapi-codegen output: embedded base64 spec chunks trip entropy rules.
    '''.*\.gen\.go$''',
    # Ephemeral AI plan docs. The directory is gitignored for NEW content
    # (.gitignore: docs/superpowers/plans/), so this only ever covers the
    # already-tracked historical leftovers (stale example tokens, verified ≠
    # current .env). A new secret here cannot be committed without a force-add.
    '''docs/superpowers/plans/.*''',
    # Screen-QA artifacts: idempotency-key UUIDs, captured payloads.
    '''frontend/apps/web/design-source/.*/artifacts/.*''',
    # The secret-scan check's own negative fixture (#87/A1 review B1). That
    # tree carries a fake AWS key on purpose: the fixture harness copies it —
    # and this config — into a sandbox where the file lands at
    # internal/config/aws.go, a path NO entry in this list matches, and then
    # asserts that this config still trips on it. Without this exemption the
    # repo's own full-history scan would flag the fixture whose entire purpose
    # is to be flagged. Scoped to that single directory, so it cannot hide a
    # credential committed anywhere else.
    '''scripts/testdata/guard-fixtures/secret-scan/.*''',
]
# Matched against each finding's own MATCH text (gitleaks' default target),
# not the whole line. This was previously `regexTarget = "line"`, which
# checks the allowlist regex against the raw source line instead of the
# specific finding being evaluated — so ANY finding sharing a physical line
# with a matched pattern got dropped, including an unrelated finding that
# regex never touched. Verified concretely: a synthetic line pairing a
# real-shaped `Idempotency-Key: <uuid>` with a fake `aws_access_key_id: AKIA…`
# on the same line — under `"line"`, both findings were dropped (the fake key
# silently exempted); under `"match"` with the same anchored regexes below,
# only the Idempotency-Key finding drops and the fake key still trips
# (`aws-access-token`, confirmed via `docker run ghcr.io/gitleaks/gitleaks`).
# `StrongPass123` and the two protocol-header rules below all still match
# correctly under `"match"`, because each finding's own Match text for a
# generic-secret-shaped rule already includes the key/header context that
# flagged it (e.g. `Idempotency-Key: 3f9a1b2c-…` is the literal Match text for
# the generic-api-key finding on that value) — "line" was never necessary to
# make the header visible to the allowlist check, it just also leaked visibility
# into every OTHER finding on the same line.
regexTarget = "match"
regexes = [
    # Documented throwaway sample password used in the manual-setup runbook's
    # user-creation curl example. This exempts only this exact dummy literal
    # everywhere — a DIFFERENT secret (incl. in the same runbook) still trips.
    # Per-file scoping needs the [[allowlists]] AND-form, unsupported here.
    '''StrongPass123''',

    # --- Protocol values that are structurally not credentials ---------------
    #
    # These two are CLASS-level, not instance-level, on purpose. QA evidence
    # docs capture raw HTTP exchanges, so both headers will keep appearing in
    # new files; pinning them by fingerprint would mean re-triaging the same
    # non-finding forever, and a triage queue full of known noise is how a real
    # finding gets waved through.
    #
    # An Idempotency-Key is a client-generated request de-duplication token.
    # It grants nothing: replaying it can only collapse into the original
    # response, and it is meaningless without the caller's actual credentials.
    #
    # Anchored to the value shape, not the bare header name: under
    # regexTarget = "line" a bare `Idempotency-Key:` match exempts the WHOLE
    # line, so a captured exchange like
    #   curl -H "Idempotency-Key: …" -H "Authorization: Bearer <real-token>"
    # would silently wave through the real token sharing that line. This repo's
    # own values take two shapes (checked against fixtures rather than assumed):
    # UUIDs generated by callers (`ops/archive/approval-v2-smoke-roundtrip.sh`)
    # and short human-readable QA labels (`qa4-signoff-01`,
    # `qa-happy-<X>` in wiki/docs QA evidence). Match either shape so an
    # unrelated secret sharing the line still trips the scanner.
    '''Idempotency-Key:\s*[0-9a-fA-F-]{8,36}''',
    '''Idempotency-Key:\s*qa[A-Za-z0-9<>_-]*''',
    #
    # Sec-WebSocket-Key is the RFC 6455 handshake nonce — base64 of 16 random
    # bytes that the server echoes back through a fixed public transform. RFC
    # 6455 §1.3 states outright that it is not used for authentication.
    #
    # Anchored to the value shape (base64, RFC 6455 requires exactly 16 raw
    # bytes so the wire form is 24 base64 chars ending in `==`) for the same
    # reason as Idempotency-Key above — the repo's fixture at
    # docs/superpowers/milestones/grade-a-architecture-remediation/milestone-1-reach-a-blockers/f1.2-presence-stream-spec/plan.md:198
    # carries `dGhlIHNhbXBsZSBub25jZQ==`, a real-shaped example nonce.
    '''Sec-WebSocket-Key:\s*[A-Za-z0-9+/]{22}==''',
]
