# F9.2 traceability-gate — manual evidence map.
#
# Hand-maintained. Schema: entries: [{req, kind, ref, note}]. `kind` MUST be
# `commit` — this is the anti-gaming boundary (validation-contract.md §2.3):
# doc-annotation evidence is auto-derived from the REQ line's own inline
# "(MUST — satisfied ...)" annotation in backend-target-architecture.md, never
# from this map, so a bulk "doc" kind here would be structurally impossible
# to game. Every entry's note names its evidence source per the spec's HARD
# RULES ("M2 F2.1 evidence, commit X"-style).
#
# Regenerate the coverage report after editing this file:
#   go run ./scripts/req-trace -write
#
# Populated 2026-07-06 via git log research (F9.2 Task 4). Entries cite the
# commit that most directly implements/enforces the REQ's behavior; most
# predate the REQ-doc's Wave-1 authoring (2026-06-11) so they don't carry an
# inline "satisfied Wave N" annotation even though the work is real and
# resolvable via `git show <ref>`.

