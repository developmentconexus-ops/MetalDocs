services:
  postgres:
    image: postgres:16
    container_name: metaldocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - metaldocs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    container_name: metaldocs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - metaldocs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: metaldocs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1,http://localhost"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - metaldocs_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: metaldocs-minio-init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb -p local/${METALDOCS_MINIO_BUCKET} || true

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: metaldocs-gotenberg
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  docx-renderer:
    build:
      context: ../..
      dockerfile: apps/docx-renderer/Dockerfile
    environment:
      DOCX_RENDERER_PORT: 3100
      DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN:?DOCX_RENDERER_SERVICE_TOKEN required}
      LOG_LEVEL: info
      VERSION: ${DOCX_RENDERER_VERSION:-dev}
      # S3/MinIO: MUST share the API's bucket — the API uploads the template body
      # and reads back the frozen.docx by the key the renderer returns.
      DOCX_RENDERER_S3_ENDPOINT: http://minio:9000
      DOCX_RENDERER_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      DOCX_RENDERER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DOCX_RENDERER_S3_BUCKET: ${METALDOCS_MINIO_BUCKET}
      DOCX_RENDERER_S3_USE_SSL: "false"
      DOCX_RENDERER_GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "3110:3100"
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    image: ${API_IMAGE}
    container_name: metaldocs-api
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      METALDOCS_REPOSITORY: postgres
      METALDOCS_AUTH_ENABLED: ${METALDOCS_AUTH_ENABLED}
      METALDOCS_AUTHZ_CACHE_TTL_SECONDS: ${METALDOCS_AUTHZ_CACHE_TTL_SECONDS}
      METALDOCS_AUTH_SESSION_SECRET: ${METALDOCS_AUTH_SESSION_SECRET}
      METALDOCS_AUTH_SESSION_COOKIE_NAME: ${METALDOCS_AUTH_SESSION_COOKIE_NAME}
      METALDOCS_AUTH_SESSION_TTL_HOURS: ${METALDOCS_AUTH_SESSION_TTL_HOURS}
      METALDOCS_AUTH_COOKIE_SECURE: ${METALDOCS_AUTH_COOKIE_SECURE}
      METALDOCS_AUTH_PASSWORD_MIN_LENGTH: ${METALDOCS_AUTH_PASSWORD_MIN_LENGTH}
      METALDOCS_AUTH_LOGIN_MAX_FAILED_ATTEMPTS: ${METALDOCS_AUTH_LOGIN_MAX_FAILED_ATTEMPTS}
      METALDOCS_AUTH_LOGIN_LOCK_MINUTES: ${METALDOCS_AUTH_LOGIN_LOCK_MINUTES}
      METALDOCS_AUTH_LEGACY_HEADER_ENABLED: ${METALDOCS_AUTH_LEGACY_HEADER_ENABLED}
      METALDOCS_BOOTSTRAP_ADMIN_ENABLED: ${METALDOCS_BOOTSTRAP_ADMIN_ENABLED}
      METALDOCS_BOOTSTRAP_ADMIN_USER_ID: ${METALDOCS_BOOTSTRAP_ADMIN_USER_ID}
      METALDOCS_BOOTSTRAP_ADMIN_USERNAME: ${METALDOCS_BOOTSTRAP_ADMIN_USERNAME}
      METALDOCS_BOOTSTRAP_ADMIN_EMAIL: ${METALDOCS_BOOTSTRAP_ADMIN_EMAIL}
      METALDOCS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${METALDOCS_BOOTSTRAP_ADMIN_DISPLAY_NAME}
      METALDOCS_BOOTSTRAP_ADMIN_PASSWORD: ${METALDOCS_BOOTSTRAP_ADMIN_PASSWORD}
      METALDOCS_RATE_LIMIT_ENABLED: ${METALDOCS_RATE_LIMIT_ENABLED}
      METALDOCS_RATE_LIMIT_WINDOW_SECONDS: ${METALDOCS_RATE_LIMIT_WINDOW_SECONDS}
      METALDOCS_RATE_LIMIT_MAX_REQUESTS: ${METALDOCS_RATE_LIMIT_MAX_REQUESTS}
      METALDOCS_CORS_ENABLED: false
      METALDOCS_STORAGE_PROVIDER: ${METALDOCS_STORAGE_PROVIDER}
      METALDOCS_ATTACHMENTS_SIGNING_SECRET: ${METALDOCS_ATTACHMENTS_SIGNING_SECRET}
      METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS: ${METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS}
      # Runtime object-store access stays on Docker DNS; browser-facing presigned URLs
      # use a separate public endpoint so the host browser can fetch them reliably.
      METALDOCS_MINIO_ENDPOINT: minio:9000
      METALDOCS_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      METALDOCS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      METALDOCS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      METALDOCS_MINIO_BUCKET: ${METALDOCS_MINIO_BUCKET}
      METALDOCS_MINIO_USE_SSL: ${METALDOCS_MINIO_USE_SSL}
      METALDOCS_MINIO_AUTO_CREATE_BUCKET: ${METALDOCS_MINIO_AUTO_CREATE_BUCKET}
      METALDOCS_GOTENBERG_URL: ${METALDOCS_GOTENBERG_URL}
      METALDOCS_FANOUT_URL: http://docx-renderer:3100
      METALDOCS_DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    image: ${WORKER_IMAGE}
    container_name: metaldocs-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      METALDOCS_REPOSITORY: postgres
      METALDOCS_WORKER_POLL_INTERVAL_SECONDS: ${METALDOCS_WORKER_POLL_INTERVAL_SECONDS}
      METALDOCS_WORKER_BATCH_SIZE: ${METALDOCS_WORKER_BATCH_SIZE}
      METALDOCS_WORKER_REVIEW_REMINDER_DAYS: ${METALDOCS_WORKER_REVIEW_REMINDER_DAYS}
      METALDOCS_WORKER_RUN_ONCE: ${METALDOCS_WORKER_RUN_ONCE}
      METALDOCS_WORKER_MAX_ATTEMPTS: ${METALDOCS_WORKER_MAX_ATTEMPTS}
      METALDOCS_WORKER_RETRY_BASE_SECONDS: ${METALDOCS_WORKER_RETRY_BASE_SECONDS}
      METALDOCS_WORKER_RETRY_MAX_SECONDS: ${METALDOCS_WORKER_RETRY_MAX_SECONDS}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable

  web:
    build:
      context: ../..
      dockerfile: frontend/apps/web/Dockerfile
    image: ${WEB_IMAGE}
    container_name: metaldocs-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    container_name: metaldocs-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  metaldocs_postgres_data:
  metaldocs_redis_data:
  metaldocs_minio_data:
