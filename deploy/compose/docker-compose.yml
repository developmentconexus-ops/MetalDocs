services:
  postgres:
    image: postgres:16
    container_name: metaldocs-postgres
    restart: unless-stopped
    # After an unclean shutdown, PG16's default crash-recovery pre-sync walks EVERY file
    # in the data dir with fsync — with the testdb-factory's hundreds of test databases
    # on WSL2 that took 40+ min. syncfs syncs each filesystem in one call instead
    # (same durability guarantee, Linux-only, which the container always is).
    # synchronous_commit=off: dev/test-only durability trade — commits return before
    # WAL flush, cutting integration-suite wall time (per-test DB clones commit
    # hundreds of small txs each). No corruption risk (WAL stays ordered); worst
    # case a crash loses the last few seconds of commits, acceptable for a
    # disposable dev DB. NEVER copy this flag to a production deployment.
    # max_connections=300: go test runs one process per package in parallel and each
    # opens its own pool against a fresh per-test clone DB; the PG16 default (100)
    # collapses under that fan-out into SASL-auth timeouts that read as test failures.
    command: ["postgres", "-c", "recovery_init_sync_method=syncfs", "-c", "synchronous_commit=off", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - metaldocs_postgres_data:/var/lib/postgresql/data
      # Curated-baseline cold-start bootstrap. Postgres runs /docker-entrypoint-initdb.d/*
      # exactly once, on first init of an empty data volume, in filename order, BEFORE the
      # server accepts connections (so the api's service_healthy gate cannot race it). This
      # is the faithful compose translation of scripts/dev-bootstrap-baseline.ps1 steps
      # 1-4 (prerequisites -> schema -> reference-data -> grants). Post-baseline forward
      # migrations, and any grants-stage re-run needed on an EXISTING volume, are applied
      # by the db-provision one-shot service below (A6.1 re-cut, issue #88) — not by the
      # api container, which no longer has DDL rights. See apps/dbprovision/cmd/
      # metaldocs-dbprovision and internal/platform/migrate/migrate.go.
      - ../../db/prerequisites/0001_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
      - ../../db/baseline/0001_current_schema.sql:/docker-entrypoint-initdb.d/02_baseline.sql:ro
      - ../../db/reference-data/0001_product_reference_data.sql:/docker-entrypoint-initdb.d/03_reference_data.sql:ro
      # Filename order matters: 0000_identity_roles.sql must run BEFORE
      # 0001_role_grants.sql (roles must exist before they can be granted to).
      - ../../db/grants/0000_identity_roles.sql:/docker-entrypoint-initdb.d/04_identity_roles.sql:ro
      - ../../db/grants/0001_role_grants.sql:/docker-entrypoint-initdb.d/05_role_grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Cold start applies the curated baseline (~166 KB schema + reference data) via
      # initdb.d BEFORE the server accepts connections; that can take 1-2 min. Failures
      # during start_period do NOT count toward retries, so give initdb generous room —
      # otherwise the api/worker service_healthy gate aborts before the schema is loaded.
      # After an unclean shutdown (Docker/WSL VM kill), PG16 additionally fsyncs the
      # whole data directory before accepting connections — observed >6 min on WSL2.
      # start_period must cover the worst of both paths or compose up aborts on
      # "dependency postgres failed to start ... is unhealthy" mid-recovery.
      start_period: 600s

  redis:
    image: redis:7
    container_name: metaldocs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - metaldocs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: metaldocs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1,http://localhost"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - metaldocs_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: metaldocs-minio-init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: ["/bin/sh"]
    volumes:
      # Deterministic system blank template artifact (1289 bytes, sha256 pinned in
      # db/reference-data/0001_product_reference_data.sql content_hash). The
      # reference-data row points at system/templates/blank.docx; controlled-document
      # creation fails 409 template.artifact_missing if the object is absent. Seeding
      # it here makes cold-start self-contained instead of depending on the manual
      # scripts/seed-system-blank-template.ps1 step.
      - ./assets/system-blank.docx:/seed/system-blank.docx:ro
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb -p local/${METALDOCS_MINIO_BUCKET} || true;
        mc cp /seed/system-blank.docx local/${METALDOCS_MINIO_BUCKET}/system/templates/blank.docx

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: metaldocs-gotenberg
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  docx-renderer:
    build:
      context: ../..
      dockerfile: apps/docx-renderer/Dockerfile
    environment:
      DOCX_RENDERER_PORT: 3100
      DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN:?DOCX_RENDERER_SERVICE_TOKEN required}
      LOG_LEVEL: info
      VERSION: ${DOCX_RENDERER_VERSION:-dev}
      # S3/MinIO: MUST share the API's bucket — the API uploads the template body
      # and reads back the frozen.docx by the key the renderer returns.
      DOCX_RENDERER_S3_ENDPOINT: http://minio:9000
      DOCX_RENDERER_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      DOCX_RENDERER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DOCX_RENDERER_S3_BUCKET: ${METALDOCS_MINIO_BUCKET}
      DOCX_RENDERER_S3_USE_SSL: "false"
      DOCX_RENDERER_GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "3110:3100"
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # db-provision is the one-shot database provisioning step (A6.1 re-cut,
  # issue #88): it is the ONLY service that connects as the bootstrap
  # superuser (${POSTGRES_USER}) after cluster init. It creates
  # metaldocs_owner/metaldocs_runtime/metaldocs_ci, transfers schema/object
  # ownership to metaldocs_owner, re-applies db/grants (idempotent — closes
  # F1: an existing volume that predates this change gets metaldocs_runtime
  # created here, not left permanently missing), and runs db/migrations +
  # River's schema under SET ROLE metaldocs_owner (closes F2: DDL never runs
  # over the metaldocs_runtime connection api/worker/jobs use to serve
  # traffic). `restart: "no"` + service_completed_successfully below make
  # api/worker/jobs wait for this to exit 0 before they start; it is safe to
  # re-run on every `compose up` (every stage is idempotent by construction).
  db-provision:
    build:
      context: ../..
      dockerfile: deploy/docker/dbprovision.Dockerfile
    container_name: metaldocs-db-provision
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      METALDOCS_JOBS_RIVER_SCHEMA: ${METALDOCS_JOBS_RIVER_SCHEMA:-}
      # The single credential source for metaldocs_runtime (PR #110 review
      # finding): db-provision sets the role's password to this value, and
      # api/worker/jobs below read the SAME var as their own PGPASSWORD, so
      # provisioning and authentication can never name two different
      # passwords. Defaults to the db/grants/0000_identity_roles.sql
      # dev-fixture password, matching api/worker/jobs' own default.
      METALDOCS_RUNTIME_DB_PASSWORD: ${METALDOCS_RUNTIME_DB_PASSWORD:-metaldocs_runtime_dev}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    image: ${API_IMAGE}
    container_name: metaldocs-api
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      gotenberg:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      # Prometheus scrape surface on a DEDICATED listener (F-R1, Dim-9). This
      # port is intentionally NOT host-published below — the api service exposes
      # only ${APP_PORT}:8081. The metrics listener is reachable only on the
      # compose (infra) network, e.g. by an in-network Prometheus at api:9090.
      # The public API port structurally cannot serve /metrics.
      METRICS_ADDR: ":9090"
      METALDOCS_REPOSITORY: postgres
      METALDOCS_AUTH_ENABLED: ${METALDOCS_AUTH_ENABLED}
      METALDOCS_AUTHZ_CACHE_TTL_SECONDS: ${METALDOCS_AUTHZ_CACHE_TTL_SECONDS}
      METALDOCS_AUTH_SESSION_SECRET: ${METALDOCS_AUTH_SESSION_SECRET}
      METALDOCS_AUTH_SESSION_COOKIE_NAME: ${METALDOCS_AUTH_SESSION_COOKIE_NAME}
      METALDOCS_AUTH_SESSION_TTL_HOURS: ${METALDOCS_AUTH_SESSION_TTL_HOURS}
      METALDOCS_AUTH_SESSION_IDLE_MINUTES: ${METALDOCS_AUTH_SESSION_IDLE_MINUTES}
      METALDOCS_AUTH_COOKIE_SECURE: ${METALDOCS_AUTH_COOKIE_SECURE}
      METALDOCS_AUTH_PASSWORD_MIN_LENGTH: ${METALDOCS_AUTH_PASSWORD_MIN_LENGTH}
      METALDOCS_AUTH_LOGIN_MAX_FAILED_ATTEMPTS: ${METALDOCS_AUTH_LOGIN_MAX_FAILED_ATTEMPTS}
      METALDOCS_AUTH_LOGIN_LOCK_MINUTES: ${METALDOCS_AUTH_LOGIN_LOCK_MINUTES}
      METALDOCS_BOOTSTRAP_ADMIN_ENABLED: ${METALDOCS_BOOTSTRAP_ADMIN_ENABLED}
      METALDOCS_BOOTSTRAP_ADMIN_USER_ID: ${METALDOCS_BOOTSTRAP_ADMIN_USER_ID}
      METALDOCS_BOOTSTRAP_ADMIN_USERNAME: ${METALDOCS_BOOTSTRAP_ADMIN_USERNAME}
      METALDOCS_BOOTSTRAP_ADMIN_EMAIL: ${METALDOCS_BOOTSTRAP_ADMIN_EMAIL}
      METALDOCS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${METALDOCS_BOOTSTRAP_ADMIN_DISPLAY_NAME}
      METALDOCS_BOOTSTRAP_ADMIN_PASSWORD: ${METALDOCS_BOOTSTRAP_ADMIN_PASSWORD}
      METALDOCS_CORS_ENABLED: false
      METALDOCS_STORAGE_PROVIDER: ${METALDOCS_STORAGE_PROVIDER}
      METALDOCS_ATTACHMENTS_SIGNING_SECRET: ${METALDOCS_ATTACHMENTS_SIGNING_SECRET}
      METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS: ${METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS}
      # Runtime object-store access stays on Docker DNS; browser-facing presigned URLs
      # use a separate public endpoint so the host browser can fetch them reliably.
      METALDOCS_MINIO_ENDPOINT: minio:9000
      METALDOCS_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      METALDOCS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      METALDOCS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      METALDOCS_MINIO_BUCKET: ${METALDOCS_MINIO_BUCKET}
      METALDOCS_MINIO_USE_SSL: ${METALDOCS_MINIO_USE_SSL}
      METALDOCS_MINIO_AUTO_CREATE_BUCKET: ${METALDOCS_MINIO_AUTO_CREATE_BUCKET}
      # Internal service-to-service URL: use the Docker-DNS name, NOT the dev
      # .env localhost value (the /health/ready gotenberg probe runs from inside
      # the api container, where localhost is the api itself). Mirrors the
      # hardcoded FANOUT_URL below and docx-renderer's DOCX_RENDERER_GOTENBERG_URL.
      METALDOCS_GOTENBERG_URL: http://gotenberg:3000
      METALDOCS_FANOUT_URL: http://docx-renderer:3100
      METALDOCS_DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN}
      # River schema must match the jobs service exactly — both default to ""
      # (public) when unset; set explicitly so they cannot diverge.
      METALDOCS_JOBS_RIVER_SCHEMA: ${METALDOCS_JOBS_RIVER_SCHEMA:-}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      # A6.1 re-cut (issue #88): api connects as metaldocs_runtime, NOT the
      # bootstrap superuser — internal/platform/db/postgres.AssertSafeIdentity
      # boot-fatals otherwise. metaldocs_runtime is provisioned by the
      # db-provision service above (depends_on: service_completed_successfully).
      PGUSER: metaldocs_runtime
      PGPASSWORD: ${METALDOCS_RUNTIME_DB_PASSWORD:-metaldocs_runtime_dev}
      PGSSLMODE: disable
      # Rate limiting: shared Redis store so limits stay correct when api scales to N
      # replicas (per-replica in-memory counting would multiply limits ×N — ADR 0071).
      # MULTI_REPLICA=true makes a memory-store misconfig fail-fast at boot.
      METALDOCS_RATELIMIT_STORE: ${METALDOCS_RATELIMIT_STORE:-redis}
      METALDOCS_RATELIMIT_REDIS_ADDR: ${METALDOCS_RATELIMIT_REDIS_ADDR:-redis:6379}
      METALDOCS_MULTI_REPLICA: ${METALDOCS_MULTI_REPLICA:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    image: ${WORKER_IMAGE}
    container_name: metaldocs-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy
      docx-renderer:
        condition: service_healthy
    environment:
      METALDOCS_REPOSITORY: postgres
      METALDOCS_WORKER_POLL_INTERVAL_SECONDS: ${METALDOCS_WORKER_POLL_INTERVAL_SECONDS}
      METALDOCS_WORKER_BATCH_SIZE: ${METALDOCS_WORKER_BATCH_SIZE}
      METALDOCS_WORKER_RUN_ONCE: ${METALDOCS_WORKER_RUN_ONCE}
      METALDOCS_WORKER_MAX_ATTEMPTS: ${METALDOCS_WORKER_MAX_ATTEMPTS}
      METALDOCS_WORKER_RETRY_BASE_SECONDS: ${METALDOCS_WORKER_RETRY_BASE_SECONDS}
      METALDOCS_WORKER_RETRY_MAX_SECONDS: ${METALDOCS_WORKER_RETRY_MAX_SECONDS}
      METALDOCS_FANOUT_URL: http://docx-renderer:3100
      METALDOCS_DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN}
      # Storage + Gotenberg stanza — REQUIRED, not optional: the worker binary
      # builds the docgen_v2_pdf converter (bootstrap.buildWorkerPDFConverter),
      # which returns nil when Gotenberg is unconfigured or storage is not
      # MinIO — and a nil converter means PDF events are consumed without any
      # PDF being generated. Mirrors the api/jobs storage blocks exactly so
      # provider truth cannot diverge.
      METALDOCS_GOTENBERG_URL: http://gotenberg:3000
      METALDOCS_STORAGE_PROVIDER: ${METALDOCS_STORAGE_PROVIDER}
      METALDOCS_ATTACHMENTS_SIGNING_SECRET: ${METALDOCS_ATTACHMENTS_SIGNING_SECRET}
      METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS: ${METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS}
      METALDOCS_MINIO_ENDPOINT: minio:9000
      METALDOCS_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      METALDOCS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      METALDOCS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      METALDOCS_MINIO_BUCKET: ${METALDOCS_MINIO_BUCKET}
      METALDOCS_MINIO_USE_SSL: ${METALDOCS_MINIO_USE_SSL}
      METALDOCS_MINIO_AUTO_CREATE_BUCKET: ${METALDOCS_MINIO_AUTO_CREATE_BUCKET}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      # A6.1 re-cut (issue #88): see the matching comment on the api service.
      PGUSER: metaldocs_runtime
      PGPASSWORD: ${METALDOCS_RUNTIME_DB_PASSWORD:-metaldocs_runtime_dev}
      PGSSLMODE: disable
    healthcheck:
      # A7.1 F2: probes /live (liveness), NOT /ready. Round-5 correction: a
      # Docker Compose healthcheck only updates the container's reported
      # health state (docker compose ps / docker inspect .State.Health,
      # and — if anything downstream ever adds one — a depends_on:
      # condition: service_healthy gate); it does NOT by itself cause
      # `restart: unless-stopped` above to fire. Compose's restart policy is
      # driven purely by the container's own process exiting, independent of
      # and unrelated to healthcheck status (docs.docker.com/reference/
      # compose-file/services, docs.docker.com/engine/containers/
      # start-containers-automatically). The real reason to prefer /live
      # here: /ready reports a dependency-degraded-but-alive process as
      # unhealthy, which would misreport a worker that is merely waiting on
      # a slow-but-recovering dependency (e.g. Postgres mid crash-recovery)
      # as broken — /ready is for orchestration-level dependency gating (a
      # human or a gateway deciding whether to route to or depend on it),
      # not for this container-level liveness probe. worker.Dockerfile's
      # runtime stage is alpine:3.21 (same as api's, whose healthcheck
      # already uses this exact wget pattern below), so a shell + busybox
      # wget are present.
      # NOT yet demonstrated live in this environment: the worker/jobs image
      # build is currently broken on trunk (go.mod requires go>=1.26.5, the
      # Dockerfiles hardcode golang:1.25-alpine — fix on
      # fix/dockerfile-go-version, out of this slice's fence). The /live
      # endpoint itself was live-verified via the compiled binary directly
      # (PR #109 thread replies); this block will get its own docker compose
      # ps healthy proof once that fix merges.
      # F7 (review round 3): METALDOCS_WORKER_RUN_ONCE=true is a supported
      # mode of THIS SAME service block (see the environment stanza above) —
      # a one-shot batch invocation that deliberately never starts the infra
      # server (apps/worker/cmd/metaldocs-worker/main.go: "there is no
      # persistent process for an orchestrator to probe, so the A7.1 infra
      # server is deliberately not started here"). A plain wget probe is
      # structurally unsatisfiable for that mode's entire lifetime, which
      # would misreport a correctly-behaving batch worker as unhealthy
      # rather than reporting neither. The case guard below makes RunOnce a
      # deliberate no-op pass instead of a false failure; continuous-mode
      # (the default, empty/false) still gets the real /live probe unchanged.
      #
      # F9 (review round 4): this guard and config.LoadWorkerConfig's own
      # truthy check (internal/platform/config/worker.go) are TWO
      # independently-maintained readings of the same rule — a hand-synced
      # enumeration, the exact defect class this repo keeps getting burned
      # by. They are proven to agree (Go TrimSpace+EqualFold("true")/"1" vs.
      # this POSIX trim+case, cross-checked under both dash and busybox ash,
      # the actual /bin/sh CMD-SHELL runs against — script + table in the
      # PR #109 F9 thread) for every value tested, INCLUDING
      # leading/trailing-whitespace-padded ones (the shell previously used a
      # bare `case` with no trim step, which silently disagreed with Go's
      # TrimSpace on padded input — direction of failure was safe,
      # unhealthy-not-false-healthy, but still a real divergence). Deletion
      # was considered and rejected for this slice: the worker's infra-port
      # listener is not started in batch mode at all (see the comment
      # above), so there is structurally no process for the shell probe to
      # ask instead of parsing the env var itself — closing that gap for
      # real means giving batch mode a minimal listener to answer "am I
      # batch?", which is main.go behavior change out of this slice's fence,
      # not a healthcheck fix. TRANSITIONAL local maximum: the
      # global-maximum structure is a single source of truth for
      # batch-mode detection (e.g. the worker binary writing a sentinel the
      # shell probe reads, or the batch-mode listener above) that deletes
      # this second reading entirely. Tracked as ME-16
      # (docs/engineering/mechanical-enforcement-register.md,
      # https://github.com/developmentconexus-ops/MetalDocs/issues/115) —
      # closes when that issue's Surface B firing mechanism (a batch-specific
      # compose service/override) lands and removes this guard's reason to
      # exist.
      #
      # Round-5 review (thread on this line): the 127.0.0.1:9091 probed here
      # is a SECOND reading of infraserver.go:34's WORKER_METRICS_ADDR
      # (default :9091, overridable) — they agree today only because this
      # service's environment: block never sets WORKER_METRICS_ADDR. Fixing
      # that for real means interpolating one compose variable into both
      # environment: and this test:, which is out of this slice's fence (the
      # PR #109/#110 fence on this file allows healthcheck:/test:/etc. edits
      # but the correct fix threads through environment: too, since the
      # value has to reach both the process and the probe from one place).
      # TRANSITIONAL local maximum, tracked as ME-16 Surface A
      # (docs/engineering/mechanical-enforcement-register.md,
      # https://github.com/developmentconexus-ops/MetalDocs/issues/115) —
      # closes when a compose variable drives both readings.
      test: ["CMD-SHELL", "v=\"$$METALDOCS_WORKER_RUN_ONCE\"; v=\"$${v#\"$${v%%[![:space:]]*}\"}\"; v=\"$${v%\"$${v##*[![:space:]]}\"}\"; case \"$$v\" in [Tt][Rr][Uu][Ee]|1) exit 0 ;; esac; wget -qO- http://127.0.0.1:9091/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  jobs:
    build:
      context: ../..
      dockerfile: deploy/docker/jobs.Dockerfile
    container_name: metaldocs-jobs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      METALDOCS_JOBS_ENABLED: ${METALDOCS_JOBS_ENABLED:-true}
      METALDOCS_JOBS_TEMPORAL_MAX_WORKERS: ${METALDOCS_JOBS_TEMPORAL_MAX_WORKERS:-10}
      # Must match the api service's value (both default to "" / public schema).
      METALDOCS_JOBS_RIVER_SCHEMA: ${METALDOCS_JOBS_RIVER_SCHEMA:-}
      # Storage stanza — REQUIRED, not optional: the jobs binary builds the M7
      # tenant-lifecycle (export/erase) worker, which calls LoadAttachmentsConfig
      # at boot and fails closed without the signing secret, then needs the full
      # minio config for the export-artifact write / blob-deletion path. Mirrors
      # the api service's storage block exactly so provider truth cannot diverge.
      METALDOCS_STORAGE_PROVIDER: ${METALDOCS_STORAGE_PROVIDER}
      METALDOCS_ATTACHMENTS_SIGNING_SECRET: ${METALDOCS_ATTACHMENTS_SIGNING_SECRET}
      METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS: ${METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS}
      METALDOCS_MINIO_ENDPOINT: minio:9000
      METALDOCS_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      METALDOCS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      METALDOCS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      METALDOCS_MINIO_BUCKET: ${METALDOCS_MINIO_BUCKET}
      METALDOCS_MINIO_USE_SSL: ${METALDOCS_MINIO_USE_SSL}
      METALDOCS_MINIO_AUTO_CREATE_BUCKET: ${METALDOCS_MINIO_AUTO_CREATE_BUCKET}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      # A6.1 re-cut (issue #88): see the matching comment on the api service.
      PGUSER: metaldocs_runtime
      PGPASSWORD: ${METALDOCS_RUNTIME_DB_PASSWORD:-metaldocs_runtime_dev}
      PGSSLMODE: disable
    healthcheck:
      # A7.1 F2: same reasoning as worker's healthcheck above — /live not
      # /ready, because a Compose healthcheck only reports status (it does
      # not itself trigger restart: unless-stopped, which fires on process
      # exit only) and /ready would misreport a dependency-degraded-but-alive
      # process as unhealthy. jobs.Dockerfile shares worker/api's alpine:3.21
      # runtime base so wget is present.
      #
      # Round-5 review: same ME-16 Surface A gap as worker's healthcheck
      # above — 127.0.0.1:9092 here is a second, unforced reading of
      # infraserver.go:53's JOBS_METRICS_ADDR (default :9092). See
      # https://github.com/developmentconexus-ops/MetalDocs/issues/115.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9092/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: frontend/apps/web/Dockerfile
    image: ${WEB_IMAGE}
    container_name: metaldocs-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    container_name: metaldocs-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  metaldocs_postgres_data:
  metaldocs_redis_data:
  metaldocs_minio_data:
