services:
  postgres:
    image: postgres:16
    container_name: metaldocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - metaldocs_postgres_data:/var/lib/postgresql/data
      # Curated-baseline cold-start bootstrap. Postgres runs /docker-entrypoint-initdb.d/*
      # exactly once, on first init of an empty data volume, in filename order, BEFORE the
      # server accepts connections (so the api's service_healthy gate cannot race it). This
      # is the faithful compose translation of scripts/dev-bootstrap-baseline.ps1 steps
      # 1-3 (prerequisites -> schema -> reference-data); the api container applies the
      # post-baseline forward migrations (0257+) itself at startup. See internal/platform/
      # migrate/migrate.go: "the curated baseline bootstrap is owned by [the bootstrap]".
      - ../../db/prerequisites/0001_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
      - ../../db/baseline/0001_current_schema.sql:/docker-entrypoint-initdb.d/02_baseline.sql:ro
      - ../../db/reference-data/0001_product_reference_data.sql:/docker-entrypoint-initdb.d/03_reference_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Cold start applies the curated baseline (~166 KB schema + reference data) via
      # initdb.d BEFORE the server accepts connections; that can take 1-2 min. Failures
      # during start_period do NOT count toward retries, so give initdb generous room —
      # otherwise the api/worker service_healthy gate aborts before the schema is loaded.
      start_period: 180s

  redis:
    image: redis:7
    container_name: metaldocs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - metaldocs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: metaldocs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1,http://localhost"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - metaldocs_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: metaldocs-minio-init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: ["/bin/sh"]
    volumes:
      # Deterministic system blank template artifact (1289 bytes, sha256 pinned in
      # db/reference-data/0001_product_reference_data.sql content_hash). The
      # reference-data row points at system/templates/blank.docx; controlled-document
      # creation fails 409 template.artifact_missing if the object is absent. Seeding
      # it here makes cold-start self-contained instead of depending on the manual
      # scripts/seed-system-blank-template.ps1 step.
      - ./assets/system-blank.docx:/seed/system-blank.docx:ro
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb -p local/${METALDOCS_MINIO_BUCKET} || true;
        mc cp /seed/system-blank.docx local/${METALDOCS_MINIO_BUCKET}/system/templates/blank.docx

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: metaldocs-gotenberg
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  docx-renderer:
    build:
      context: ../..
      dockerfile: apps/docx-renderer/Dockerfile
    environment:
      DOCX_RENDERER_PORT: 3100
      DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN:?DOCX_RENDERER_SERVICE_TOKEN required}
      LOG_LEVEL: info
      VERSION: ${DOCX_RENDERER_VERSION:-dev}
      # S3/MinIO: MUST share the API's bucket — the API uploads the template body
      # and reads back the frozen.docx by the key the renderer returns.
      DOCX_RENDERER_S3_ENDPOINT: http://minio:9000
      DOCX_RENDERER_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      DOCX_RENDERER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DOCX_RENDERER_S3_BUCKET: ${METALDOCS_MINIO_BUCKET}
      DOCX_RENDERER_S3_USE_SSL: "false"
      DOCX_RENDERER_GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "3110:3100"
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    image: ${API_IMAGE}
    container_name: metaldocs-api
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      gotenberg:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      # Prometheus scrape surface on a DEDICATED listener (F-R1, Dim-9). This
      # port is intentionally NOT host-published below — the api service exposes
      # only ${APP_PORT}:8081. The metrics listener is reachable only on the
      # compose (infra) network, e.g. by an in-network Prometheus at api:9090.
      # The public API port structurally cannot serve /metrics.
      METRICS_ADDR: ":9090"
      METALDOCS_REPOSITORY: postgres
      METALDOCS_AUTH_ENABLED: ${METALDOCS_AUTH_ENABLED}
      METALDOCS_AUTHZ_CACHE_TTL_SECONDS: ${METALDOCS_AUTHZ_CACHE_TTL_SECONDS}
      METALDOCS_AUTH_SESSION_SECRET: ${METALDOCS_AUTH_SESSION_SECRET}
      METALDOCS_AUTH_SESSION_COOKIE_NAME: ${METALDOCS_AUTH_SESSION_COOKIE_NAME}
      METALDOCS_AUTH_SESSION_TTL_HOURS: ${METALDOCS_AUTH_SESSION_TTL_HOURS}
      METALDOCS_AUTH_SESSION_IDLE_MINUTES: ${METALDOCS_AUTH_SESSION_IDLE_MINUTES}
      METALDOCS_AUTH_COOKIE_SECURE: ${METALDOCS_AUTH_COOKIE_SECURE}
      METALDOCS_AUTH_PASSWORD_MIN_LENGTH: ${METALDOCS_AUTH_PASSWORD_MIN_LENGTH}
      METALDOCS_AUTH_LOGIN_MAX_FAILED_ATTEMPTS: ${METALDOCS_AUTH_LOGIN_MAX_FAILED_ATTEMPTS}
      METALDOCS_AUTH_LOGIN_LOCK_MINUTES: ${METALDOCS_AUTH_LOGIN_LOCK_MINUTES}
      METALDOCS_BOOTSTRAP_ADMIN_ENABLED: ${METALDOCS_BOOTSTRAP_ADMIN_ENABLED}
      METALDOCS_BOOTSTRAP_ADMIN_USER_ID: ${METALDOCS_BOOTSTRAP_ADMIN_USER_ID}
      METALDOCS_BOOTSTRAP_ADMIN_USERNAME: ${METALDOCS_BOOTSTRAP_ADMIN_USERNAME}
      METALDOCS_BOOTSTRAP_ADMIN_EMAIL: ${METALDOCS_BOOTSTRAP_ADMIN_EMAIL}
      METALDOCS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${METALDOCS_BOOTSTRAP_ADMIN_DISPLAY_NAME}
      METALDOCS_BOOTSTRAP_ADMIN_PASSWORD: ${METALDOCS_BOOTSTRAP_ADMIN_PASSWORD}
      METALDOCS_CORS_ENABLED: false
      METALDOCS_STORAGE_PROVIDER: ${METALDOCS_STORAGE_PROVIDER}
      METALDOCS_ATTACHMENTS_SIGNING_SECRET: ${METALDOCS_ATTACHMENTS_SIGNING_SECRET}
      METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS: ${METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS}
      # Runtime object-store access stays on Docker DNS; browser-facing presigned URLs
      # use a separate public endpoint so the host browser can fetch them reliably.
      METALDOCS_MINIO_ENDPOINT: minio:9000
      METALDOCS_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      METALDOCS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      METALDOCS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      METALDOCS_MINIO_BUCKET: ${METALDOCS_MINIO_BUCKET}
      METALDOCS_MINIO_USE_SSL: ${METALDOCS_MINIO_USE_SSL}
      METALDOCS_MINIO_AUTO_CREATE_BUCKET: ${METALDOCS_MINIO_AUTO_CREATE_BUCKET}
      # Internal service-to-service URL: use the Docker-DNS name, NOT the dev
      # .env localhost value (the /health/ready gotenberg probe runs from inside
      # the api container, where localhost is the api itself). Mirrors the
      # hardcoded FANOUT_URL below and docx-renderer's DOCX_RENDERER_GOTENBERG_URL.
      METALDOCS_GOTENBERG_URL: http://gotenberg:3000
      METALDOCS_FANOUT_URL: http://docx-renderer:3100
      METALDOCS_DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN}
      # River schema must match the jobs service exactly — both default to ""
      # (public) when unset; set explicitly so they cannot diverge.
      METALDOCS_JOBS_RIVER_SCHEMA: ${METALDOCS_JOBS_RIVER_SCHEMA:-}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      # Rate limiting: shared Redis store so limits stay correct when api scales to N
      # replicas (per-replica in-memory counting would multiply limits ×N — ADR 0071).
      # MULTI_REPLICA=true makes a memory-store misconfig fail-fast at boot.
      METALDOCS_RATELIMIT_STORE: ${METALDOCS_RATELIMIT_STORE:-redis}
      METALDOCS_RATELIMIT_REDIS_ADDR: ${METALDOCS_RATELIMIT_REDIS_ADDR:-redis:6379}
      METALDOCS_MULTI_REPLICA: ${METALDOCS_MULTI_REPLICA:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    image: ${WORKER_IMAGE}
    container_name: metaldocs-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy
      docx-renderer:
        condition: service_healthy
    environment:
      METALDOCS_REPOSITORY: postgres
      METALDOCS_WORKER_POLL_INTERVAL_SECONDS: ${METALDOCS_WORKER_POLL_INTERVAL_SECONDS}
      METALDOCS_WORKER_BATCH_SIZE: ${METALDOCS_WORKER_BATCH_SIZE}
      METALDOCS_WORKER_RUN_ONCE: ${METALDOCS_WORKER_RUN_ONCE}
      METALDOCS_WORKER_MAX_ATTEMPTS: ${METALDOCS_WORKER_MAX_ATTEMPTS}
      METALDOCS_WORKER_RETRY_BASE_SECONDS: ${METALDOCS_WORKER_RETRY_BASE_SECONDS}
      METALDOCS_WORKER_RETRY_MAX_SECONDS: ${METALDOCS_WORKER_RETRY_MAX_SECONDS}
      METALDOCS_FANOUT_URL: http://docx-renderer:3100
      METALDOCS_DOCX_RENDERER_SERVICE_TOKEN: ${DOCX_RENDERER_SERVICE_TOKEN}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable

  jobs:
    build:
      context: ../..
      dockerfile: deploy/docker/jobs.Dockerfile
    container_name: metaldocs-jobs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      METALDOCS_JOBS_ENABLED: ${METALDOCS_JOBS_ENABLED:-true}
      METALDOCS_JOBS_TEMPORAL_MAX_WORKERS: ${METALDOCS_JOBS_TEMPORAL_MAX_WORKERS:-10}
      # Must match the api service's value (both default to "" / public schema).
      METALDOCS_JOBS_RIVER_SCHEMA: ${METALDOCS_JOBS_RIVER_SCHEMA:-}
      # Storage stanza — REQUIRED, not optional: the jobs binary builds the M7
      # tenant-lifecycle (export/erase) worker, which calls LoadAttachmentsConfig
      # at boot and fails closed without the signing secret, then needs the full
      # minio config for the export-artifact write / blob-deletion path. Mirrors
      # the api service's storage block exactly so provider truth cannot diverge.
      METALDOCS_STORAGE_PROVIDER: ${METALDOCS_STORAGE_PROVIDER}
      METALDOCS_ATTACHMENTS_SIGNING_SECRET: ${METALDOCS_ATTACHMENTS_SIGNING_SECRET}
      METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS: ${METALDOCS_ATTACHMENTS_DOWNLOAD_TTL_SECONDS}
      METALDOCS_MINIO_ENDPOINT: minio:9000
      METALDOCS_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      METALDOCS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      METALDOCS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      METALDOCS_MINIO_BUCKET: ${METALDOCS_MINIO_BUCKET}
      METALDOCS_MINIO_USE_SSL: ${METALDOCS_MINIO_USE_SSL}
      METALDOCS_MINIO_AUTO_CREATE_BUCKET: ${METALDOCS_MINIO_AUTO_CREATE_BUCKET}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable

  web:
    build:
      context: ../..
      dockerfile: frontend/apps/web/Dockerfile
    image: ${WEB_IMAGE}
    container_name: metaldocs-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:4173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    container_name: metaldocs-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  metaldocs_postgres_data:
  metaldocs_redis_data:
  metaldocs_minio_data:
